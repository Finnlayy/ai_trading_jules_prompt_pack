        }

        function ChartPanel({ chartState, setChartState, chartRef, chartContainerRef, orders }) {
            const timeframes = ["1m", "5m", "15m", "30m", "1h", "4h", "1d"];

            async function loadChart() {
                setChartState(s => ({ ...s, loading: true }));
                try {
                    const [ohlcv, indicators] = await Promise.all([
                        fetch(`/market/ohlcv?symbol=${chartState.symbol}&timeframe=${chartState.timeframe}&bars=300`).then(r => r.json()),
                        fetch(`/market/indicators?symbol=${chartState.symbol}&timeframe=${chartState.timeframe}&bars=300`).then(r => r.json()),
                    ]);
                    setChartState(s => ({
                        ...s,
                        bars: ohlcv.bars || [],
                        indicators: indicators.indicators || [],
                        loading: false,
                    }));
                } catch (err) {
                    setChartState(s => ({ ...s, loading: false }));
                }
            }

            React.useEffect(() => {
                loadChart();
                const timer = setInterval(loadChart, 30000);
                return () => clearInterval(timer);
            }, [chartState.symbol, chartState.timeframe]);

            React.useEffect(() => {
                if (!chartContainerRef.current || !chartState.bars.length) return;
                if (chartRef.current) {
                    chartRef.current.remove();
                    chartRef.current = null;
                }
                const chart = LightweightCharts.createChart(chartContainerRef.current, {
                    width: chartContainerRef.current.clientWidth,
                    height: 520,
                    layout: { background: { color: "#ffffff" }, textColor: "var(--text)" },
                    grid: { vertLines: { color: "#f0f0f0" }, horzLines: { color: "#f0f0f0" } },
                    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                    rightPriceScale: { borderColor: "#dde8df" },
                    timeScale: { borderColor: "#dde8df", timeVisible: true },
                });
                chartRef.current = chart;

                const candleSeries = chart.addCandlestickSeries({
                    upColor: "#33a56b", downColor: "#d86545", borderUpColor: "#33a56b", borderDownColor: "#d86545",
                    wickUpColor: "#33a56b", wickDownColor: "#d86545",
                });
                candleSeries.setData(chartState.bars);

                const volumeSeries = chart.addHistogramSeries({
                    color: "#33a56b", priceFormat: { type: "volume" }, priceScaleId: "", scaleMargins: { top: 0.8, bottom: 0 },
                });
                volumeSeries.setData(chartState.bars.map(b => ({
                    time: b.time,
                    value: b.volume,
                    color: b.close >= b.open ? "rgba(51,165,107,0.35)" : "rgba(216,101,69,0.35)",
                })));

                // Overlay signal markers from indicators
                const markers = [];
                (chartState.indicators || []).forEach(ind => {
                    if (ind.direction_hint === "LONG" && ind.confluence_score >= 11) {
                        markers.push({ time: ind.time, position: "belowBar", color: "#33a56b", shape: "arrowUp", text: `C${Math.round(ind.confluence_score)}` });
                    } else if (ind.direction_hint === "SHORT" && ind.confluence_score >= 11) {
                        markers.push({ time: ind.time, position: "aboveBar", color: "#d86545", shape: "arrowDown", text: `C${Math.round(ind.confluence_score)}` });
                    }
                });
                candleSeries.setMarkers(markers);

                // Overlay executed orders as horizontal lines
                const symbolOrders = orders.filter(o => o.symbol === chartState.symbol && o.entry_price);
                symbolOrders.forEach(order => {
                    const color = order.direction === "LONG" ? "#33a56b" : "#d86545";
                    if (order.entry_price) {
                        const line = chart.addLineSeries({ color, lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dotted, lastValueVisible: false, title: `${order.direction} Entry` });
                        line.setData(chartState.bars.map(b => ({ time: b.time, value: order.entry_price })));
                    }
                    if (order.stop_price) {
                        const line = chart.addLineSeries({ color: "#a87812", lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed, lastValueVisible: false, title: "SL" });
                        line.setData(chartState.bars.map(b => ({ time: b.time, value: order.stop_price })));
                    }
                    if (order.target_price) {
                        const line = chart.addLineSeries({ color: "#367bb8", lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed, lastValueVisible: false, title: "TP" });
                        line.setData(chartState.bars.map(b => ({ time: b.time, value: order.target_price })));
                    }
                });

                chart.timeScale().fitContent();

                const handleResize = () => {
                    if (chartContainerRef.current && chartRef.current) {
                        chartRef.current.applyOptions({ width: chartContainerRef.current.clientWidth });
                    }
                };
                window.addEventListener("resize", handleResize);
                return () => {
                    window.removeEventListener("resize", handleResize);
                    if (chartRef.current) { chartRef.current.remove(); chartRef.current = null; }
                };
            }, [chartState.bars, chartState.indicators, orders, chartState.symbol]);

            return (
                <div className="grid">
                    <div className="panel span-12">
                        <div className="panel-title">
                            <span>Live Chart</span>
                            <span style={{ display: "flex", gap: 10, alignItems: "center" }}>
                                <input value={chartState.symbol} onChange={e => setChartState(s => ({ ...s, symbol: e.target.value.toUpperCase() }))} placeholder="Symbol" style={{ width: 120 }} />
                                <select value={chartState.timeframe} onChange={e => setChartState(s => ({ ...s, timeframe: e.target.value }))} style={{ width: 90 }}>
                                    {timeframes.map(tf => <option key={tf} value={tf}>{tf}</option>)}
                                </select>
                                <button onClick={loadChart} disabled={chartState.loading}>Refresh</button>
                                {chartState.loading && <span className="kpi-caption">Loading…</span>}
                            </span>
                        </div>
                        <div ref={chartContainerRef} style={{ width: "100%", height: 520 }} />
                    </div>
                    <div className="panel span-12">
                        <div className="panel-title">Indicator Snapshot <span className="pill">{chartState.indicators.length} bars scored</span></div>
                        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(180px, 1fr))", gap: 10 }}>
                            {(chartState.indicators.slice(-12)).map((ind, i) => (
                                <div key={i} style={{ padding: 10, borderRadius: 12, border: "1px solid var(--line)", background: ind.direction_hint === "LONG" ? "rgba(51,165,107,0.08)" : ind.direction_hint === "SHORT" ? "rgba(216,101,69,0.08)" : "rgba(104,120,109,0.06)" }}>
                                    <div className="mono" style={{ fontSize: 11 }}>{new Date(ind.time * 1000).toLocaleTimeString()}</div>
                                    <div style={{ fontWeight: 700, fontSize: 14 }}>{ind.direction_hint} <span className="pill">{ind.confluence_score}</span></div>
                                    <div className="kpi-caption">Align {ind.alignment_count}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function AILayer({ aiLayer, aiMessage, setAiMessage, sendAIMessage, updateAIProfile, saveAIProfile, resetAIMemory, loading, orders, chartState, request, addLog, setRaw, setAiLayer }) {
            const profile = aiLayer.profile || {};
            const preferred = Array.isArray(profile.preferred_symbols) ? profile.preferred_symbols.join(", ") : (profile.preferred_symbols || "");
            const blocked = Array.isArray(profile.blocked_symbols) ? profile.blocked_symbols.join(", ") : (profile.blocked_symbols || "");
            const guardrails = Array.isArray(profile.guardrails) ? profile.guardrails.join("\n") : (profile.guardrails || "");
            const latestTrace = (orders || []).find(order => order.ai_trace)?.ai_trace;

            const [analyzeBars, setAnalyzeBars] = React.useState(50);
            const [analyzeStrategy, setAnalyzeStrategy] = React.useState("");
            const [strategies, setStrategies] = React.useState([]);
            const [showPrompt, setShowPrompt] = React.useState(false);
            const [smokeResult, setSmokeResult] = React.useState(null);
            const [smokeLoading, setSmokeLoading] = React.useState(false);

            React.useEffect(() => {
                request("/ai/strategies").then(data => setStrategies(data.strategies || [])).catch(() => setStrategies([]));
            }, []);

            async function runSmokeTest() {
                setSmokeLoading(true);
                try {
                    const response = await request("/backtest/smoke", { method: "POST" });
                    setSmokeResult(response);
                                        addLog("system", `Smoke test ${response.all_passed ? "PASSED" : "FAILED"}`, { broker_mode: response.broker_mode, live_capable: response.live_capable });
                } catch (error) {
                    setSmokeResult({ error: error.message });
                    addLog("error", "Smoke test failed", { error: error.message });
                } finally {
                    setSmokeLoading(false);
                }
            }

            function buildChartContext() {
                const recentBars = chartState.bars.slice(-analyzeBars);
                const lastInd = chartState.indicators[chartState.indicators.length - 1] || {};
                return {
                    symbol: chartState.symbol,
                    timeframe: chartState.timeframe,
                    recent_candles: recentBars.map(b => ({ time: b.time, open: b.open, high: b.high, low: b.low, close: b.close, volume: b.volume })),
                    latest_indicator: {
                        confluence_score: lastInd.confluence_score,
                        direction_hint: lastInd.direction_hint,
                        alignment_count: lastInd.alignment_count,
                    },
                };
            }

            async function analyzeChart(previewOnly = false) {
                if (!chartState.bars.length) return;
                const chartContext = buildChartContext();
                const body = {
                    message: `Analyze ${chartState.symbol} on ${chartState.timeframe}.`,
                    apply_to_profile: false,
                    chart_context: chartContext,
                    bars_count: analyzeBars,
                    strategy_context: analyzeStrategy || null,
                    return_prompt_only: previewOnly,
                };
                try {
                    const response = await request("/ai/chat", { method: "POST", body: JSON.stringify(body) });
                    setAiLayer(current => ({ ...current, ...response }));
                                        if (previewOnly) setShowPrompt(true);
                    addLog("ai", previewOnly ? "AI prompt previewed" : "AI analyzed chart context", { symbol: chartState.symbol, timeframe: chartState.timeframe, bars: analyzeBars, strategy: analyzeStrategy });
                } catch (error) {
                                        addLog("error", "AI chart analysis failed", { error: error.message });
                }
            }

            return (
                <div className="grid">
                    <div className="panel span-4">
                        <div className="panel-title">AI Runtime <span className="pill ai">{aiLayer.provider || "loading"}</span></div>
                        <div className="kpi-value">{profile.risk_tolerance || "..."}</div>
                        <div className="kpi-caption">Behavior profile updated {profile.updated_at ? new Date(profile.updated_at).toLocaleString() : "never"}</div>
                    </div>
                    <div className="panel span-4">
                        <div className="panel-title">Memory</div>
                        <div className="kpi-value">{(aiLayer.memory || []).length}</div>
                        <div className="kpi-caption">Recent chat messages stored locally in server logs.</div>
                    </div>
                    <div className="panel span-4">
                        <div className="panel-title">Review Influence</div>
                        <div className="kpi-value">{profile.min_confluence_preference || "auto"}</div>
                        <div className="kpi-caption">Preferred minimum confluence for AI review context.</div>
                    </div>

                    <div className="panel span-12">
                        <div className="panel-title">
                            <span>Pionex Dry-Run Smoke Test</span>
                            <button type="button" className="primary" onClick={runSmokeTest} disabled={smokeLoading}>
                                {smokeLoading ? "Running…" : "Run Smoke Test"}
                            </button>
                        </div>
                        {smokeResult ? (
                            <div>
                                <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 10 }}>
                                    <span className={`pill ${smokeResult.all_passed ? "ok" : "bad"}`}>{smokeResult.all_passed ? "ALL PASSED" : "ISSUES FOUND"}</span>
                                    <span className="pill">Mode: {smokeResult.broker_mode}</span>
                                    <span className="pill">Live Capable: {smokeResult.live_capable ? "Yes" : "No"}</span>
                                </div>
                                {smokeResult.infrastructure_checks && (
                                    <div style={{ marginBottom: 10 }}>
                                        <div className="kpi-caption" style={{ fontWeight: 700 }}>Infrastructure</div>
                                        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(200px, 1fr))", gap: 8 }}>
                                            {smokeResult.infrastructure_checks.map((check, i) => (
                                                <div key={i} style={{ padding: 8, borderRadius: 10, border: "1px solid var(--line)", background: check.passed ? "rgba(51,165,107,0.08)" : check.passed === false ? "rgba(216,101,69,0.08)" : "rgba(104,120,109,0.06)" }}>
                                                    <div className="mono" style={{ fontSize: 11 }}>{check.test}</div>
                                                    <div style={{ fontWeight: 700, fontSize: 13 }}>{check.passed === true ? "✓ PASS" : check.passed === false ? "✗ FAIL" : "— SKIP"}</div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                                {smokeResult.pipeline_checks && (
                                    <div>
                                        <div className="kpi-caption" style={{ fontWeight: 700 }}>Pipeline</div>
                                        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(240px, 1fr))", gap: 8 }}>
                                            {smokeResult.pipeline_checks.map((check, i) => (
                                                <div key={i} style={{ padding: 8, borderRadius: 10, border: "1px solid var(--line)", background: check.error ? "rgba(216,101,69,0.08)" : check.is_dry_run ? "rgba(51,165,107,0.08)" : "rgba(167,139,12,0.08)" }}>
                                                    <div className="mono" style={{ fontSize: 11 }}>{check.signal_id}</div>
                                                    <div style={{ fontWeight: 700, fontSize: 13 }}>{check.error ? `✗ ERROR: ${check.error}` : `${check.final_decision} (${check.broker_status})`}</div>
                                                    {check.reject_reason && <div className="kpi-caption">{check.reject_reason}</div>}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                                {smokeResult.error && <div style={{ color: "#d86545" }}>⚠ {smokeResult.error}</div>}
                            </div>
                        ) : (
                            <div className="kpi-caption">Click "Run Smoke Test" to verify the Pionex Direct broker pipeline in dry-run mode. No live orders will be sent.</div>
                        )}
                    </div>

                    {/* Scout Review Detail Panel */}
                    <div className="panel span-12">
                        <div className="panel-title">
                            <span>AI Review Detail — Latest Signal</span>
                            {latestTrace && <span className="pill ai">{latestTrace.final_summary?.decision || "UNKNOWN"}</span>}
                        </div>
                        {latestTrace && latestTrace.scouts ? (
                            <div>
                                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(260px, 1fr))", gap: 12, marginBottom: 12 }}>
                                    {["technical", "sentiment", "risk", "macro"].map(name => {
                                        const scout = latestTrace.scouts[name] || {};
                                        const decision = scout.decision || "UNKNOWN";
                                        const confidence = scout.confidence ?? 0.5;
                                        const reason = scout.reason || "";
                                        const weight = (latestTrace.scout_weights || {})[name] ?? 0.5;
                                        const fillClass = confidence >= 0.7 ? "high" : confidence >= 0.4 ? "medium" : "low";
                                        const approved = decision === "PROCEED_TO_SIMULATION" || decision === "APPROVE";
                                        return (
                                            <div key={name} className={`scout-box ${name}`}>
                                                <div className="scout-title">
                                                    <span>{name === "technical" ? "📊" : name === "sentiment" ? "💬" : name === "risk" ? "⚠️" : "🌍"}</span>
                                                    {name.charAt(0).toUpperCase() + name.slice(1)} Scout
                                                    <span className={`pill ${approved ? "ok" : "warn"}`} style={{ marginLeft: "auto" }}>{approved ? "APPROVE" : "REJECT"}</span>
                                                </div>
                                                <div style={{ marginBottom: 8 }}>
                                                    <div className="kpi-caption" style={{ display: "flex", justifyContent: "space-between" }}>
                                                        <span>Confidence</span>
                                                        <span>{(confidence * 100).toFixed(0)}%</span>
                                                    </div>
                                                    <div className="confidence-bar">
                                                        <div className={`confidence-fill ${fillClass}`} style={{ width: `${confidence * 100}%` }} />
                                                    </div>
                                                </div>
                                                <div className="kpi-caption" style={{ marginBottom: 6 }}>Weight: {(weight * 100).toFixed(0)}% | {reason}</div>
                                                {scout.risk_flags && scout.risk_flags.length > 0 && (
                                                    <div style={{ fontSize: 11, color: "var(--rose)" }}>Flags: {scout.risk_flags.join(", ")}</div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                                {latestTrace.symbol_context && (
                                    <details>
                                        <summary className="kpi-caption">Symbol Context (injected into prompts)</summary>
                                        <pre style={{ fontSize: 11, marginTop: 8, maxHeight: 200, overflow: "auto", whiteSpace: "pre-wrap" }}>{latestTrace.symbol_context}</pre>
                                    </details>
                                )}
                            </div>
                        ) : (
                            <div className="kpi-caption">No AI review trace available yet. Execute a signal through the pipeline to see scout breakdowns.</div>
                        )}
                    </div>

                    <form className="panel span-7" onSubmit={sendAIMessage}>
                        <div className="panel-title">AI Layer Chat <span className="pill ok">memory on</span></div>
                        <div className="chat">
                            {(aiLayer.memory || []).length === 0 ? (
                                <div className="kpi-caption">No AI-layer memory yet.</div>
                            ) : (aiLayer.memory || []).map((message, index) => (
                                <div className={`chat-message ${message.role}`} key={`${message.timestamp}-${index}`}>
                                    <div className="mono">{message.role} - {new Date(message.timestamp).toLocaleTimeString()}</div>
                                    <div>{message.content}</div>
                                </div>
                            ))}
                        </div>
                        <div className="row-actions">
                            <input value={aiMessage} onChange={event => setAiMessage(event.target.value)} placeholder="Tell the AI layer how to behave during signal review" />
                            <button className="primary" type="submit" disabled={loading}>Send</button>
                            <button type="button" className="danger" onClick={resetAIMemory} disabled={loading}>Reset Memory</button>
                        </div>

                        <div style={{ marginTop: 14, padding: 12, border: "1px solid var(--line)", borderRadius: 12, background: "var(--surface-soft)" }}>
                            <div className="panel-title" style={{ marginBottom: 10 }}>Chart Analysis Controls</div>
                            <div className="row-actions" style={{ marginBottom: 10, flexWrap: "wrap" }}>
                                <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12 }}>
                                    <span>Bars</span>
                                    <select value={analyzeBars} onChange={e => setAnalyzeBars(Number(e.target.value))} style={{ width: 70 }}>
                                        {[10, 25, 50, 100, 200].map(n => <option key={n} value={n}>{n}</option>)}
                                    </select>
                                </label>
                                <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12 }}>
                                    <span>Strategy</span>
                                    <select value={analyzeStrategy} onChange={e => setAnalyzeStrategy(e.target.value)} style={{ width: 180 }}>
                                        <option value="">None / Manual</option>
                                        {strategies.map(s => <option key={`${s.type}-${s.name}`} value={s.name}>{s.name} ({s.type})</option>)}
                                    </select>
                                </label>
                                <button type="button" className="warning" disabled={loading || !chartState.bars.length} onClick={() => analyzeChart(false)}>
                                    {loading ? "Analyzing…" : "Analyze Chart"}
                                </button>
                                <button type="button" disabled={loading || !chartState.bars.length} onClick={() => analyzeChart(true)}>
                                    Preview Prompt
                                </button>
                            </div>
                            <div className="kpi-caption">Moonshot AI key is used for LLM calls. Bars: {analyzeBars} | Strategy: {analyzeStrategy || "none"}</div>
                        </div>

                        {aiLayer.generated_prompt && showPrompt && (
                            <div style={{ marginTop: 14 }}>
                                <div className="panel-title">
                                    <span>Generated Prompt</span>
                                    <button type="button" onClick={() => { setAiMessage(aiLayer.generated_prompt); setShowPrompt(false); addLog("system", "Copied generated prompt to chat input"); }}>
                                        Copy to Chat Input
                                    </button>
                                </div>
                                <pre style={{ maxHeight: 300, overflow: "auto", fontSize: 12 }}>{aiLayer.generated_prompt}</pre>
                                {aiLayer.system_prompt && (
                                    <details style={{ marginTop: 8 }}>
                                        <summary className="kpi-caption">System Prompt</summary>
                                        <pre style={{ maxHeight: 200, overflow: "auto", fontSize: 11, marginTop: 6 }}>{aiLayer.system_prompt}</pre>
                                    </details>
                                )}
                            </div>
                        )}
                    </form>

                    <div className="panel span-5">
                        <div className="panel-title">Behavior Profile</div>
                        <div className="form-grid">
                            <Field label="Trading Style" value={profile.trading_style || ""} onChange={value => updateAIProfile("trading_style", value)} />
                            <Select label="Risk Tolerance" value={profile.risk_tolerance || "moderate"} options={["conservative", "moderate", "aggressive"]} onChange={value => updateAIProfile("risk_tolerance", value)} />
                            <Field label="Preferred Symbols" value={preferred} onChange={value => updateAIProfile("preferred_symbols", value)} />
                            <Field label="Blocked Symbols" value={blocked} onChange={value => updateAIProfile("blocked_symbols", value)} />
                            <Field label="Max Risk %" type="number" value={profile.max_risk_pct ?? ""} onChange={value => updateAIProfile("max_risk_pct", value)} />
                            <Field label="Min Confluence" type="number" value={profile.min_confluence_preference ?? ""} onChange={value => updateAIProfile("min_confluence_preference", value)} />
                            <label className="full"><span>Notes</span><textarea value={profile.notes || ""} onChange={event => updateAIProfile("notes", event.target.value)} /></label>
                            <label className="full"><span>Guardrails</span><textarea value={guardrails} onChange={event => updateAIProfile("guardrails", event.target.value)} /></label>
                        </div>
                        <div className="row-actions">
                            <button className="primary" type="button" onClick={saveAIProfile} disabled={loading}>Save Profile</button>
                        </div>
                    </div>

                    <div className="panel span-12">
                        <div className="panel-title">Active AI Review Prompt</div>
                        <pre>{aiLayer.behavior_prompt || "Loading behavior prompt..."}</pre>
                    </div>

                    <div className="panel span-12">
                        <div className="panel-title">Latest AI Reasoning Audit <span className="pill warn">summary only</span></div>
                        <pre>{latestTrace ? pretty(latestTrace) : "No AI audit trace yet. Submit a manual signal or run a backtest to populate this panel."}</pre>
                    </div>
                </div>
            );
        }

        function ConfidencePanel({ request, addLog }) {
            const [stats, setStats] = React.useState({});
            const [loading, setLoading] = React.useState(false);
            const [selectedSymbol, setSelectedSymbol] = React.useState("");

            async function loadStats() {
                setLoading(true);
                try {
                    const data = await request("/confidence/stats");
                    setStats(data);
                } catch (err) {
                    addLog("error", "Failed to load confidence stats", { error: err.message });
                } finally {
                    setLoading(false);
                }
            }

            async function resetSymbol(sym) {
                try {
                    await request(`/confidence/reset/${sym}`, { method: "POST" });
                    addLog("info", `Reset confidence stats for ${sym}`);
                    loadStats();
                } catch (err) {
                    addLog("error", `Failed to reset ${sym}`, { error: err.message });
                }
            }

            async function resetAll() {
                if (!confirm("Reset ALL confidence stats? This cannot be undone.")) return;
                try {
                    await request("/confidence/reset", { method: "POST" });
                    addLog("info", "Reset all confidence stats");
                    loadStats();
                } catch (err) {
                    addLog("error", "Failed to reset all stats", { error: err.message });
                }
            }

            React.useEffect(() => {
                loadStats();
                const timer = setInterval(loadStats, 30000);
                return () => clearInterval(timer);
            }, []);

            const symbols = Object.keys(stats).sort();

            function ScoutBar({ label, accuracy, calls }) {
                const pct = Math.round((accuracy || 0) * 100);
                const color = pct >= 70 ? "#22c55e" : pct >= 50 ? "#f59e0b" : "#ef4444";
                return (
                    <div style={{ marginBottom: 8 }}>
                        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 2 }}>
                            <span>{label}</span>
                            <span>{pct}% ({calls} calls)</span>
                        </div>
                        <div style={{ background: "#1f2937", borderRadius: 4, height: 8, overflow: "hidden" }}>
                            <div style={{ width: `${pct}%`, background: color, height: "100%", borderRadius: 4, transition: "width 0.3s" }} />
                        </div>
                    </div>
                );
            }

            function SymbolCard({ symbol, data }) {
                const long = data.long_stats || {};
                const short = data.short_stats || {};
                const scouts = data.scout_stats || {};
                return (
                    <div className="panel" style={{ minWidth: 320, flex: 1 }}>
                        <div className="panel-title" style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                            <span>{symbol}</span>
                            <span className="pill">{data.total_signals || 0} signals</span>
                        </div>
                        <div style={{ marginBottom: 12 }}>
                            <div style={{ fontSize: 13, color: "#9ca3af", marginBottom: 4 }}>Direction Track Record</div>
                            <div style={{ display: "flex", gap: 16, fontSize: 13 }}>
                                <div>LONG: <strong style={{ color: long.win_rate > 0.5 ? "#22c55e" : "#ef4444" }}>{((long.win_rate || 0) * 100).toFixed(0)}%</strong> <span className="muted">({long.wins || 0}W/{long.losses || 0}L)</span></div>
                                <div>SHORT: <strong style={{ color: short.win_rate > 0.5 ? "#22c55e" : "#ef4444" }}>{((short.win_rate || 0) * 100).toFixed(0)}%</strong> <span className="muted">({short.wins || 0}W/{short.losses || 0}L)</span></div>
                            </div>
                        </div>
                        <div style={{ marginBottom: 12 }}>
                            <div style={{ fontSize: 13, color: "#9ca3af", marginBottom: 4 }}>Scout Accuracy</div>
                            {["technical", "sentiment", "risk", "macro"].map(name => {
                                const s = scouts[name] || {};
                                return <ScoutBar key={name} label={name.charAt(0).toUpperCase() + name.slice(1)} accuracy={s.accuracy || 0} calls={s.calls || 0} />;
                            })}
                        </div>
                        <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                            <button className="small" onClick={() => setSelectedSymbol(symbol)}>View Context</button>
                            <button className="small warning" onClick={() => resetSymbol(symbol)}>Reset</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="grid">
                    <div className="panel span-12">
                        <div className="panel-title" style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                            <span>Confidence Registry <span className="pill">{symbols.length} symbols</span></span>
                            <div style={{ display: "flex", gap: 8 }}>
                                <button onClick={loadStats} disabled={loading}>{loading ? "Loading..." : "Refresh"}</button>
                                <button className="warning" onClick={resetAll}>Reset All</button>
                            </div>
                        </div>
                        <div className="kpi-caption">Per-symbol scout accuracy, win rates, and direction stats. Scouts learn via prompt injection — not model weights.</div>
                    </div>
                    {symbols.length === 0 && (
                        <div className="panel span-12">
                            <div className="kpi-caption">No confidence data yet. Submit signals or run backtests to populate the registry.</div>
                        </div>
                    )}
                    <div className="panel span-12" style={{ display: "flex", flexWrap: "wrap", gap: 12, padding: 12 }}>
                        {symbols.map(sym => <SymbolCard key={sym} symbol={sym} data={stats[sym]} />)}
                    </div>

                    {selectedSymbol && (
                        <div className="panel span-12" style={{ marginTop: 12 }}>
                            <div className="panel-title">Injected Context: {selectedSymbol}</div>
                            <pre style={{ whiteSpace: "pre-wrap", fontSize: 13 }}>
                                {(() => {
                                    const d = stats[selectedSymbol] || {};
                                    const long = d.long_stats || {};
                                    const short = d.short_stats || {};
                                    const scouts = d.scout_stats || {};
                                    return `Symbol: ${selectedSymbol}
Total signals: ${d.total_signals || 0}
LONG: ${((long.win_rate || 0) * 100).toFixed(0)}% win rate (${long.wins || 0}W/${long.losses || 0}L), avg RR: ${(long.avg_rr || 0).toFixed(2)}, avg PnL: ${(long.avg_pnl_pct || 0).toFixed(2)}%
SHORT: ${((short.win_rate || 0) * 100).toFixed(0)}% win rate (${short.wins || 0}W/${short.losses || 0}L), avg RR: ${(short.avg_rr || 0).toFixed(2)}, avg PnL: ${(short.avg_pnl_pct || 0).toFixed(2)}%
${["technical", "sentiment", "risk", "macro"].map(n => {
    const s = scouts[n] || {};
    return `  ${n}: ${((s.accuracy || 0) * 100).toFixed(0)}% accuracy (${s.correct_calls || 0}/${s.calls || 0}), avg confidence: ${(s.avg_confidence || 0).toFixed(2)}`;
}).join("\n")}
Historical avg confluence: ${(d.avg_confluence || 0).toFixed(1)}, avg crisis: ${(d.avg_crisis || 0).toFixed(1)}`;
                                })()}
                            </pre>
                            <button className="small" onClick={() => setSelectedSymbol("")}>Close</button>
                        </div>
                    )}
                </div>
            );
        }

        function NewsPanel({ request, addLog }) {
            const [feed, setFeed] = React.useState([]);
            const [glint, setGlint] = React.useState([]);
            const [manus, setManus] = React.useState([]);
            const [glintQuestion, setGlintQuestion] = React.useState("Positions");
            const [manusQuestion, setManusQuestion] = React.useState("");
            const [loading, setLoading] = React.useState(false);
            const [activeSource, setActiveSource] = React.useState("all");
            const [glintStatus, setGlintStatus] = React.useState({});
            const [manusStatus, setManusStatus] = React.useState({});

            const mergeMessages = (incoming, existing) => {
                const combined = [...(incoming || []), ...(existing || [])];
                const seen = new Set();
                return combined.filter(m => {
                    const key = `${m.chat_id || ""}-${m.id}`;
                    if (seen.has(key)) return false;
                    seen.add(key);
                    return true;
                });
            };

            async function loadFeed(source) {
                setLoading(true);
                try {
                    const data = await request(`/news/feed?source=${source}`);
                    if (data.status === "ok") {
                        setFeed(data.items || []);
                    } else {
                        addLog("error", "News feed failed", { detail: data.detail });
                    }
                } catch (err) {
                    addLog("error", "Failed to load news", { error: err.message });
                } finally {
                    setLoading(false);
                }
            }

            async function loadGlint() {
                try {
                    const data = await request("/news/glint");
                    if (data.status === "ok") {
                        setGlint(data.messages || []);
                        setGlintStatus(data.receiver_status || {});
                    }
                } catch (err) {
                    addLog("error", "Failed to load GLINT feed", { error: err.message });
                }
            }

            async function loadManus() {
                try {
                    const data = await request("/news/manus");
                    if (data.status === "ok") {
                        setManus(data.messages || []);
                        setManusStatus(data.receiver_status || {});
                    }
                } catch (err) {
                    addLog("error", "Failed to load Manus feed", { error: err.message });
                }
            }

            async function pollGlint() {
                setLoading(true);
                try {
                    const data = await request("/news/glint/poll", { method: "POST" });
                    if (data.status === "ok") {
                        setGlint(prev => mergeMessages(data.messages, prev));
                        addLog("info", `GLINT poll: ${data.new_count} new messages`);
                    }
                } catch (err) {
                    addLog("error", "GLINT poll failed", { error: err.message });
                } finally {
                    setLoading(false);
                }
            }

            async function pollManus() {
                setLoading(true);
                try {
                    const data = await request("/news/manus/poll", { method: "POST" });
                    if (data.status === "ok") {
                        setManus(prev => mergeMessages(data.messages, prev));
                        addLog("info", `Manus poll: ${data.new_count} new messages`);
                    }
                } catch (err) {
                    addLog("error", "Manus poll failed", { error: err.message });
                } finally {
                    setLoading(false);
                }
            }

            async function askGlint() {
                if (!glintQuestion.trim()) return;
                setLoading(true);
                try {
                    const data = await request(`/news/glint/ask?question=${encodeURIComponent(glintQuestion)}`, { method: "POST" });
                    if (data.status === "ok") {
                        setGlint(prev => mergeMessages(data.messages, prev));
                        addLog("info", data.timed_out ? "GLINT ask sent; no response yet" : `Asked GLINT: ${glintQuestion}`);
                        if (data.timed_out) setTimeout(pollGlint, 3000);
                    } else {
                        addLog("error", "GLINT ask failed", { detail: data.detail });
                    }
                } catch (err) {
                    addLog("error", "Failed to ask GLINT", { error: err.message });
                } finally {
                    setLoading(false);
                }
            }

            async function askManus() {
                if (!manusQuestion.trim()) return;
                setLoading(true);
                try {
                    const data = await request(`/news/manus/ask?question=${encodeURIComponent(manusQuestion)}`, { method: "POST" });
                    if (data.status === "ok") {
                        setManus(prev => mergeMessages(data.messages, prev));
                        addLog("info", data.timed_out ? "Manus ask sent; no response yet" : `Asked Manus: ${manusQuestion}`);
                        setManusQuestion("");
                        if (data.timed_out) setTimeout(pollManus, 3000);
                    } else {
                        addLog("error", "Manus ask failed", { detail: data.detail });
                    }
                } catch (err) {
                    addLog("error", "Failed to ask Manus", { error: err.message });
                } finally {
                    setLoading(false);
                }
            }

            React.useEffect(() => {
                loadFeed("all");
                loadGlint();
                loadManus();
                const timer = setInterval(() => {
                    loadFeed(activeSource);
                    loadGlint();
                    loadManus();
                }, 60000);
                return () => clearInterval(timer);
            }, [activeSource]);

            const filteredFeed = activeSource === "all"
                ? feed
                : feed.filter(it => it.source.toLowerCase().includes(activeSource.toLowerCase()));

            return (
                <div className="grid">
                    <div className="panel span-12">
                        <div className="panel-title" style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                            <span>Market News Aggregator</span>
                            <div style={{ display: "flex", gap: 8 }}>
                                {["all", "bbc", "coindesk"].map(src => (
                                    <button
                                        key={src}
                                        className={activeSource === src ? "small primary" : "small"}
                                        onClick={() => { setActiveSource(src); loadFeed(src); }}
                                    >
                                        {src === "all" ? "All RSS" : src === "bbc" ? "BBC Business" : "CoinDesk"}
                                    </button>
                                ))}
                                <button onClick={() => { loadFeed(activeSource); loadGlint(); loadManus(); }} disabled={loading}>{loading ? "Loading..." : "Refresh"}</button>
                            </div>
                        </div>
                        <div className="kpi-caption">RSS feeds refresh every 60s. GLINT and Manus are separate Telegram chats.</div>
                    </div>

                    <div className="panel span-6">
                        <div className="panel-title">RSS Headlines <span className="pill">{filteredFeed.length}</span></div>
                        {filteredFeed.length === 0 && (
                            <div className="kpi-caption">No news items loaded yet. Click Refresh or wait for auto-refresh.</div>
                        )}
                        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                            {filteredFeed.map((item, idx) => (
                                <div key={idx} style={{ padding: 10, background: "#1f2937", borderRadius: 6, borderLeft: `3px solid ${item.source.includes("BBC") ? "#0ea5e9" : "#8b5cf6"}` }}>
                                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12 }}>
                                        <a href={item.link} target="_blank" rel="noopener noreferrer" style={{ color: "#e5e7eb", textDecoration: "none", fontSize: 14, fontWeight: 600, lineHeight: 1.4 }}>
                                            {item.title}
                                        </a>
                                        <span className="pill" style={{ fontSize: 10, whiteSpace: "nowrap" }}>{item.source}</span>
                                    </div>
                                    {item.summary && (
                                        <div style={{ fontSize: 12, color: "#9ca3af", marginTop: 6, lineHeight: 1.4 }}>{item.summary}</div>
                                    )}
                                    <div style={{ fontSize: 11, color: "#6b7280", marginTop: 6 }}>{new Date(item.published).toLocaleString()}</div>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="panel span-3">
                        <div className="panel-title" style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                            <span>GLINT.trade <span className="pill">{glint.length}</span></span>
                            <button className="small" onClick={pollGlint} disabled={loading || !glintStatus.configured}>
                                {glintStatus.configured ? "Poll Now" : "Not Configured"}
                            </button>
                        </div>
                        {!glintStatus.configured && (
                            <div className="kpi-caption" style={{ color: "#f59e0b" }}>
                                Telegram not configured. Set GLINT_TELEGRAM_CHAT_ID in .env.
                            </div>
                        )}
                        {glintStatus.configured && (
                            <div style={{ display: "flex", gap: 4, marginBottom: 8 }}>
                                <input
                                    placeholder="Ask GLINT..."
                                    value={glintQuestion}
                                    onChange={e => setGlintQuestion(e.target.value)}
                                    onKeyDown={e => e.key === "Enter" && askGlint()}
                                    style={{ flex: 1, fontSize: 12, padding: "4px 8px", background: "#1f2937", border: "1px solid #374151", color: "#e5e7eb", borderRadius: 4 }}
                                />
                                <button className="small" onClick={askGlint} disabled={loading || !glintQuestion.trim()}>Ask</button>
                            </div>
                        )}
                        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                            {glint.map((msg, idx) => (
                                <div key={idx} style={{ padding: 10, background: "#1f2937", borderRadius: 6, borderLeft: "3px solid #f59e0b" }}>
                                    <div style={{ fontSize: 12, color: "#9ca3af", marginBottom: 4 }}>
                                        <strong>{msg.sender}</strong> · {new Date(msg.timestamp).toLocaleTimeString()}
                                    </div>
                                    <div style={{ fontSize: 13, color: "#e5e7eb", whiteSpace: "pre-wrap", lineHeight: 1.4 }}>{msg.text}</div>
                                </div>
                            ))}
                            {glint.length === 0 && glintStatus.configured && (
                                <div className="kpi-caption">No GLINT messages yet. Click Poll Now.</div>
                            )}
                        </div>
                    </div>

                    <div className="panel span-3">
                        <div className="panel-title" style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                            <span>Manus Advisor <span className="pill">{manus.length}</span></span>
                            <button className="small" onClick={pollManus} disabled={loading || !manusStatus.configured}>
                                {manusStatus.configured ? "Poll Now" : "Not Configured"}
                            </button>
                        </div>
                        {!manusStatus.configured && (
                            <div className="kpi-caption" style={{ color: "#f59e0b" }}>
                                Telegram not configured. Set MANUS_TELEGRAM_CHAT_ID in .env.
                            </div>
                        )}
                        {manusStatus.configured && (
                            <div style={{ display: "flex", gap: 4, marginBottom: 8 }}>
                                <input
                                    placeholder="Ask Manus..."
                                    value={manusQuestion}
                                    onChange={e => setManusQuestion(e.target.value)}
                                    onKeyDown={e => e.key === "Enter" && askManus()}
                                    style={{ flex: 1, fontSize: 12, padding: "4px 8px", background: "#1f2937", border: "1px solid #374151", color: "#e5e7eb", borderRadius: 4 }}
                                />
                                <button className="small" onClick={askManus} disabled={loading || !manusQuestion.trim()}>Ask</button>
                            </div>
                        )}
                        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                            {manus.map((msg, idx) => (
                                <div key={idx} style={{ padding: 10, background: "#1f2937", borderRadius: 6, borderLeft: "3px solid #22c55e" }}>
                                    <div style={{ fontSize: 12, color: "#9ca3af", marginBottom: 4 }}>
                                        <strong>{msg.sender}</strong> · {new Date(msg.timestamp).toLocaleTimeString()}
                                    </div>
                                    <div style={{ fontSize: 13, color: "#e5e7eb", whiteSpace: "pre-wrap", lineHeight: 1.4 }}>{msg.text}</div>
                                </div>
                            ))}
                            {manus.length === 0 && manusStatus.configured && (
                                <div className="kpi-caption">No Manus messages yet. Type a question above or click Poll Now.</div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function Orders({ orders }) {
            return (
                <div className="grid">
                    <div className="panel span-12">
                        <div className="panel-title">Personal Order Book <span className="pill">{orders.length} orders</span></div>
                        <OrderTable orders={orders} />
                    </div>
                </div>
            );
        }

        function Logs({ logs, raw, status }) {
            return (
                <div className="grid">
                    <div className="panel span-12">
                        <div className="panel-title">Activity Logs</div>
                        <LogList logs={logs} />
                    </div>                    <div className="panel span-12">
                        <div className="panel-title">Runtime Status</div>
                        <pre>{pretty(status)}</pre>
                    </div>
                </div>
            );
        }

        function Tooltip({ hint, recommended }) {
            const [show, setShow] = React.useState(false);
            return (
                <span style={{ position: "relative", display: "inline-flex", alignItems: "center", marginLeft: 4 }}>
                    <span
                        style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", width: 16, height: 16, borderRadius: "50%", background: "var(--sky)", color: "var(--sky-strong)", fontSize: 11, fontWeight: 700, cursor: "help" }}
                        onMouseEnter={() => setShow(true)}
                        onMouseLeave={() => setShow(false)}
                    >?</span>
                    {show && (
                        <div style={{ position: "absolute", bottom: "calc(100% + 6px)", left: "50%", transform: "translateX(-50%)", width: 190, padding: 10, borderRadius: 12, background: "#ffffff", border: "1px solid var(--mint-strong)", boxShadow: "0 8px 24px rgba(30,54,38,0.12)", zIndex: 100, fontSize: 12, lineHeight: 1.4 }}>
                            {recommended !== undefined && recommended !== "" && <div><strong>Recommended:</strong> {String(recommended)}</div>}
                            {hint && <div style={{ marginTop: 4, color: "var(--muted)" }}><strong>Hint:</strong> {hint}</div>}
                        </div>
                    )}
                </span>
            );
        }

        function Field({ label, value, onChange, type = "text", full = false, hint, recommended }) {
            return (
                <label className={full ? "full" : ""}>
                    <span style={{ display: "flex", alignItems: "center" }}>
                        {label}
                        {(hint || recommended !== undefined) && <Tooltip hint={hint} recommended={recommended} />}
                    </span>
                    <input type={type} value={value} onChange={e => onChange(e.target.value)} placeholder={recommended !== undefined && recommended !== "" ? String(recommended) : ""} />
                </label>
            );
        }

        function Select({ label, value, options, onChange, hint, recommended }) {
            return (
                <label>
                    <span style={{ display: "flex", alignItems: "center" }}>
                        {label}
                        {(hint || recommended !== undefined) && <Tooltip hint={hint} recommended={recommended} />}
                    </span>
                    <select value={value} onChange={e => onChange(e.target.value)}>
                        {options.map(option => <option key={option} value={option}>{option || "None"}</option>)}
                    </select>
                </label>
            );
        }

        function OrderTable({ orders, compact = false }) {
            if (!orders.length) return <div className="kpi-caption">No matching orders yet.</div>;
            return (
                <div className="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Symbol</th>
                                <th>Side</th>
                                <th>Intent</th>
                                <th>Decision</th>
                                {!compact && <th>Mode</th>}
                                {!compact && <th>Client Order ID</th>}
                                <th>Price</th>
                                {!compact && <th>Size</th>}
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            {orders.map(order => (
                                <tr key={`${order.id}-${order.at}`}>
                                    <td className="mono">{new Date(order.at).toLocaleString()}</td>
                                    <td>{order.symbol}</td>
                                    <td>{order.direction}</td>
                                    <td>{order.intent}</td>
                                    <td><span className={statusPill(order.final_decision)}>{order.final_decision || "UNKNOWN"}</span></td>
                                    {!compact && <td><span className={`pill ${order.execution_mode === "live" ? "error" : "ok"}`}>{order.execution_mode || "simulation"}</span></td>}
                                    {!compact && <td className="mono">{order.client_order_id || "-"}</td>}
                                    <td>{order.entry_price}</td>
                                    {!compact && <td>{order.size_base || "-"}</td>}
                                    <td>{order.reject_reason || order.broker_status || order.source}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        }

        function WalletAssetTable({ wallets, compact = false }) {
            const rows = wallets.flatMap(([walletName, wallet]) => (wallet.assets || []).map(asset => ({ walletName, ...asset })));
            if (!rows.length) return <div className="kpi-caption">No wallet assets returned yet.</div>;
            return (
                <div className="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Wallet</th>
                                <th>Asset</th>
                                <th>Balance</th>
                                <th>Available</th>
                                <th>Locked</th>
                                <th>Value USDT</th>
                                {!compact && <th>Raw Fields</th>}
                            </tr>
                        </thead>
                        <tbody>
                            {rows.map((asset, index) => (
                                <tr key={`${asset.walletName}-${asset.coin}-${index}`}>
                                    <td>{asset.walletName}</td>
                                    <td>{asset.coin || "-"}</td>
                                    <td>{money(asset.balance)}</td>
                                    <td>{asset.available === null || asset.available === undefined ? "-" : money(asset.available)}</td>
                                    <td>{asset.locked === null || asset.locked === undefined ? "-" : money(asset.locked)}</td>
                                    <td>{asset.value_usdt === null || asset.value_usdt === undefined ? "-" : money(asset.value_usdt)}</td>
                                    {!compact && <td className="mono">{JSON.stringify(asset.raw || {})}</td>}
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        }

        function LogList({ logs }) {
            if (!logs.length) return <div className="kpi-caption">No logs yet.</div>;
            return (
                <div className="log">
                    {logs.map(log => (
                        <div className="log-line" key={log.id}>
                            <span className="mono">{new Date(log.at).toLocaleTimeString()}</span>
                            <span className={statusPill(log.level)}>{log.level}</span>
                            <span>{log.message}</span>
                        </div>
                    ))}
                </div>
            );
        }

        function DecisionBars({ orders }) {
            const counts = [
                ["Executed", orders.filter(o => String(o.final_decision).includes("EXECUTED")).length, "var(--mint-strong)"],
                ["Rejected", orders.filter(o => String(o.final_decision).includes("REJECT")).length, "var(--peach-strong)"],
                ["Backtest", orders.filter(o => o.source === "backtest").length, "var(--sky-strong)"],
                ["Manual", orders.filter(o => o.source === "manual").length, "var(--butter-strong)"]
            ];
            const max = Math.max(1, ...counts.map(item => item[1]));
            return (
                <div className="bars">
                    {counts.map(([label, value, color]) => (
                        <div className="bar-row" key={label}>
                            <span>{label}</span>
                            <div className="bar-track"><div className="bar-fill" style={{ width: `${(value / max) * 100}%`, background: color }}></div></div>
                            <span>{value}</span>
                        </div>
                    ))}
                </div>
            );
        }

        function LineChart({ orders }) {
            const points = orders.slice().reverse().slice(-24).map((order, index) => {
                const yValue = String(order.final_decision).includes("EXECUTED") ? index + 1 : Math.max(0, index - 0.4);
                return { x: index, y: yValue };
            });
            const maxY = Math.max(1, ...points.map(p => p.y));
            const coords = points.length
                ? points.map((p, index) => `${20 + (index / Math.max(1, points.length - 1)) * 560},${200 - (p.y / maxY) * 160}`).join(" ")
                : "20,200 580,200";
            return (
                <svg className="chart" viewBox="0 0 600 230" preserveAspectRatio="none">
                    <polyline points={coords} fill="none" stroke="#33a56b" strokeWidth="5" strokeLinecap="round" strokeLinejoin="round" />
                    <circle cx="20" cy="200" r="4" fill="#33a56b" />
                    <text x="20" y="32" fill="#68786d" fontSize="14">Order execution trend</text>
                </svg>
            );
        }

        function LivePaperPanel({ request, addLog }) {
            const [loopStatus, setLoopStatus] = useState(null);
            const [watchlist, setWatchlist] = useState([]);
            const [positions, setPositions] = useState([]);
            const [performance, setPerformance] = useState(null);
            const [loading, setLoading] = useState(false);
            const [newSymbol, setNewSymbol] = useState("");
            const [newTimeframes, setNewTimeframes] = useState("1h");
            const [sseConnected, setSseConnected] = useState(false);

            async function refreshLoop() {
                try {
                    const data = await request("/loop/status");
                    setLoopStatus(data);
                } catch (e) {
                    addLog("error", "Loop status refresh failed", { error: e.message });
                }
            }

            async function refreshWatchlist() {
                try {
                    const data = await request("/loop/watchlist");
                    setWatchlist(data.items || []);
                } catch (e) {
                    addLog("error", "Watchlist refresh failed", { error: e.message });
                }
            }

            async function refreshPositions() {
                try {
                    const data = await request("/live/positions");
                    setPositions(data || []);
                } catch (e) {
                    addLog("error", "Positions refresh failed", { error: e.message });
                }
            }

            async function refreshPerformance() {
                try {
                    const data = await request("/live/performance?lookback_days=7");
                    setPerformance(data.metrics || null);
                } catch (e) {
                    // Performance may be empty initially
                }
            }

            async function controlLoop(action) {
                setLoading(true);
                try {
                    const data = await request("/loop/control", {
                        method: "POST",
                        body: JSON.stringify({ action })
                    });
                    addLog("system", `Loop ${action}`, data.status);
                    await refreshLoop();
                } catch (e) {
                    addLog("error", `Loop ${action} failed`, { error: e.message });
                } finally {
                    setLoading(false);
                }
            }

            async function addSymbol() {
                if (!newSymbol.trim()) return;
                setLoading(true);
                try {
                    console.log("[LivePaper] Adding symbol:", newSymbol.toUpperCase());
                    const result = await request("/loop/watchlist", {
                        method: "POST",
                        body: JSON.stringify({
                            symbol: newSymbol.toUpperCase(),
                            timeframes: newTimeframes.split(",").map(s => s.trim()),
                            active: true
                        })
                    });
                    console.log("[LivePaper] Add success:", result);
                    addLog("system", `Added ${newSymbol.toUpperCase()} to watchlist`);
                    setNewSymbol("");
                    await refreshWatchlist();
                } catch (e) {
                    console.error("[LivePaper] Add failed:", e);
                    addLog("error", `Add symbol failed: ${e.message} (status=${e.status || "?"}, path=${e.path || "?"})`, { error: e.message, status: e.status, path: e.path, response: e.response });
                } finally {
                    setLoading(false);
                }
            }

            async function removeSymbol(symbol) {
                setLoading(true);
                try {
                    await request(`/loop/watchlist/${symbol}`, { method: "DELETE" });
                    addLog("system", `Removed ${symbol} from watchlist`);
                    await refreshWatchlist();
                } catch (e) {
                    addLog("error", "Remove symbol failed", { error: e.message });
                } finally {
                    setLoading(false);
                }
            }

            async function emergencyStop() {
                if (!confirm("EMERGENCY STOP: Pause loop and close all open positions?")) return;
                setLoading(true);
                try {
                    await request("/live/emergency-stop", {
                        method: "POST",
                        body: JSON.stringify({ reason: "Manual emergency stop from UI", halt_duration_minutes: 60, close_open_positions: true })
                    });
                    addLog("critical", "Emergency stop executed");
                    await Promise.all([refreshLoop(), refreshPositions()]);
                } catch (e) {
                    addLog("error", "Emergency stop failed", { error: e.message });
                } finally {
                    setLoading(false);
                }
            }

            function connectSSE() {
                if (sseConnected) return;
                try {
                    const evtSource = new EventSource("/live/stream");
                    evtSource.onmessage = (event) => {
                        try {
                            const msg = JSON.parse(event.data);
                            if (msg.event === "position_closed") {
                                addLog("order", `Position closed: ${msg.symbol} ${msg.exit_reason} @ ${msg.exit_price}`, msg);
                                refreshPositions();
                            } else if (msg.event === "trade_filled") {
                                addLog("order", `Trade filled: ${msg.symbol}`, msg);
                                refreshPositions();
                            }
                        } catch (e) {}
                    };
                    evtSource.onerror = () => {
                        setSseConnected(false);
                    };
                    setSseConnected(true);
                } catch (e) {
                    addLog("error", "SSE connect failed", { error: e.message });
                }
            }

            useEffect(() => {
                refreshLoop();
                refreshWatchlist();
                refreshPositions();
                refreshPerformance();
                const timer = setInterval(() => {
                    refreshLoop();
                    refreshPositions();
                    refreshPerformance();
                }, 5000);
                connectSSE();
                return () => clearInterval(timer);
            }, []);

            const loopRunning = loopStatus?.is_running || false;
            const loopPaused = loopStatus?.is_paused || false;

            return (
                <div className="grid">
                    <div className="panel span-12">
                        <div className="panel-title">Live Paper Control <span className={`pill ${loopRunning ? (loopPaused ? "warn" : "ok") : "error"}`}>{loopRunning ? (loopPaused ? "Paused" : "Running") : "Stopped"}</span></div>
                        <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap", marginTop: 8 }}>
                            <button className="primary" onClick={() => controlLoop("start")} disabled={loading || loopRunning}>Start Loop</button>
                            <button className="warning" onClick={() => controlLoop("pause")} disabled={loading || !loopRunning || loopPaused}>Pause</button>
                            <button className="secondary" onClick={() => controlLoop("resume")} disabled={loading || !loopPaused}>Resume</button>
                            <button className="danger" onClick={() => controlLoop("stop")} disabled={loading || !loopRunning}>Stop Loop</button>
                            <button className="danger" onClick={emergencyStop} disabled={loading}>🚨 Emergency Stop</button>
                            <span className="pill info">{sseConnected ? "SSE Connected" : "SSE Disconnected"}</span>
                        </div>
                        {loopStatus && (
                            <div style={{ marginTop: 12, fontSize: 13, color: "var(--muted)" }}>
                                Strategy: <b>{loopStatus.current_strategy_id}</b> ·
                                Poll: <b>{loopStatus.poll_interval_seconds}s</b> ·
                                Cycles: <b>{loopStatus.loop_stats?.cycles_completed || 0}</b> ·
                                Signals: <b>{loopStatus.loop_stats?.signals_generated || 0}</b> ·
                                Trades: <b>{loopStatus.loop_stats?.trades_executed || 0}</b> ·
                                Errors (5m): <b>{loopStatus.loop_stats?.errors_last_5min || 0}</b>
                            </div>
                        )}
                    </div>

                    <div className="panel span-6">
                        <div className="panel-title">Watchlist <span className="pill">{watchlist.length} symbols</span></div>
                        <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
                            <input placeholder="Symbol (e.g. BTCUSDT)" value={newSymbol} onChange={e => setNewSymbol(e.target.value)} onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); addSymbol(); } }} style={{ flex: 1 }} />
                            <input placeholder="Timeframes" value={newTimeframes} onChange={e => setNewTimeframes(e.target.value)} onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); addSymbol(); } }} style={{ width: 120 }} />
                            <button type="button" className="primary" onClick={addSymbol} disabled={loading || !newSymbol.trim()}>{loading ? "Adding…" : "Add"}</button>
                        </div>
                        <table className="ordertable">
                            <thead>
                                <tr><th>Symbol</th><th>Timeframes</th><th>Active</th><th></th></tr>
                            </thead>
                            <tbody>
                                {watchlist.map(item => (
                                    <tr key={item.symbol || Math.random()}>
                                        <td style={{ color: "var(--text)" }}><b>{item.symbol || "???"}</b></td>
                                        <td style={{ color: "var(--text)" }}>{(item.timeframes || []).join(", ") || "—"}</td>
                                        <td style={{ color: "var(--text)" }}>{item.active ? "✅" : "⏸️"}</td>
                                        <td><button className="danger" style={{ padding: "2px 8px", fontSize: 12 }} onClick={() => removeSymbol(item.symbol)} disabled={loading}>Remove</button></td>
                                    </tr>
                                ))}
                                {watchlist.length === 0 && <tr><td colSpan={4} style={{ textAlign: "center", color: "var(--muted)" }}>No symbols in watchlist</td></tr>}
                            </tbody>
                        </table>
                    </div>

                    <div className="panel span-6">
                        <div className="panel-title">Open Positions <span className="pill">{positions.length} open</span></div>
                        <table className="ordertable">
                            <thead>
                                <tr><th>Symbol</th><th>Dir</th><th>Entry</th><th>Current</th><th>Size</th><th>Unrealized PnL</th><th>Time</th></tr>
                            </thead>
                            <tbody>
                                {positions.map(p => (
                                    <tr key={p.trade_id}>
                                        <td style={{ color: "var(--text)" }}><b>{p.symbol || "???"}</b></td>
                                        <td style={{ color: "var(--text)" }}>{p.direction || "?"}</td>
                                        <td style={{ color: "var(--text)" }}>{p.entry_price ?? "—"}</td>
                                        <td style={{ color: "var(--text)" }}>{p.current_price ?? "—"}</td>
                                        <td style={{ color: "var(--text)" }}>{p.size ?? "—"}</td>
                                        <td style={{ color: p.unrealized_pnl >= 0 ? "var(--emerald)" : "var(--rose)" }}>{p.unrealized_pnl >= 0 ? "+" : ""}{p.unrealized_pnl?.toFixed?.(4) || p.unrealized_pnl}</td>
                                        <td style={{ color: "var(--text)" }}>{p.time_in_trade_minutes?.toFixed?.(1) || "0"}m</td>
                                    </tr>
                                ))}
                                {positions.length === 0 && <tr><td colSpan={7} style={{ textAlign: "center", color: "var(--muted)" }}>No open positions</td></tr>}
                            </tbody>
                        </table>
                    </div>

                    <div className="panel span-12">
                        <div className="panel-title">Live Performance <span className="pill">7d</span></div>
                        {performance ? (
                            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(140px, 1fr))", gap: 12, marginTop: 8 }}>
                                <Kpi title="Total Trades" value={performance.total_trades || 0} caption="Completed" tone="ok" />
                                <Kpi title="Winrate" value={`${(performance.winrate_pct || 0).toFixed(1)}%`} caption={`${performance.winning_trades || 0}W / ${performance.losing_trades || 0}L`} tone={performance.winrate_pct >= 50 ? "ok" : "warn"} />
                                <Kpi title="Total PnL" value={`${(performance.total_pnl || 0).toFixed(2)}`} caption="Quote currency" tone={performance.total_pnl >= 0 ? "ok" : "warn"} />
                                <Kpi title="Profit Factor" value={`${(performance.profit_factor || 0).toFixed(2)}`} caption="Gross win / gross loss" tone={performance.profit_factor >= 1.5 ? "ok" : "warn"} />
                                <Kpi title="Sharpe" value={`${(performance.sharpe_ratio || 0).toFixed(2)}`} caption="Risk-adjusted" tone={performance.sharpe_ratio >= 1 ? "ok" : "warn"} />
                                <Kpi title="Max DD" value={`${(performance.max_drawdown_pct || 0).toFixed(2)}%`} caption="Peak to trough" tone="warn" />
                            </div>
                        ) : (
                            <div style={{ textAlign: "center", color: "var(--muted)", padding: 20 }}>No performance data yet. Execute some trades first.</div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
