<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetricFlow Bot Command Center</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

        :root {
            --bg: #f7faf7;
            --surface: #ffffff;
            --surface-soft: #fbfdfb;
            --line: #dde8df;
            --ink: #142118;
            --muted: #68786d;
            --mint: #c9f3dd;
            --mint-strong: #33a56b;
            --sky: #dceeff;
            --sky-strong: #367bb8;
            --peach: #ffe1d3;
            --peach-strong: #d86545;
            --butter: #fff1bd;
            --butter-strong: #a87812;
            --lilac: #ebe4ff;
            --radius: 18px;
            --shadow: 0 18px 60px rgba(30, 54, 38, 0.10);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            font-family: "IBM Plex Sans", sans-serif;
            background:
                linear-gradient(135deg, rgba(201, 243, 221, 0.72), transparent 30%),
                linear-gradient(225deg, rgba(220, 238, 255, 0.70), transparent 33%),
                var(--bg);
        }

        button, input, select, textarea {
            font: inherit;
        }

        button {
            min-height: 38px;
            border: 1px solid var(--line);
            border-radius: 12px;
            color: var(--ink);
            background: var(--surface);
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            border-color: #b8c9bc;
            transform: translateY(-1px);
        }

        button:disabled {
            cursor: wait;
            opacity: 0.65;
            transform: none;
        }

        button.primary {
            background: var(--mint-strong);
            border-color: var(--mint-strong);
            color: #ffffff;
        }

        button.warning {
            background: var(--butter);
            border-color: #eed276;
            color: #6b4b08;
        }

        button.danger {
            background: var(--peach);
            border-color: #f0b8a7;
            color: #91351f;
        }

        input, select, textarea {
            width: 100%;
            min-height: 40px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #ffffff;
            color: var(--ink);
            padding: 9px 11px;
            outline: none;
        }

        textarea {
            min-height: 118px;
            resize: vertical;
            line-height: 1.45;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--mint-strong);
            box-shadow: 0 0 0 3px rgba(51, 165, 107, 0.14);
        }

        .app {
            display: grid;
            grid-template-columns: 248px minmax(0, 1fr);
            min-height: 100vh;
        }

        aside {
            position: sticky;
            top: 0;
            height: 100vh;
            padding: 22px;
            border-right: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.76);
            backdrop-filter: blur(18px);
        }

        .brand {
            display: grid;
            gap: 4px;
            margin-bottom: 22px;
        }

        .brand-mark {
            width: 38px;
            height: 38px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--mint), var(--sky));
            font-weight: 700;
            color: #174426;
        }

        .brand-title {
            margin-top: 8px;
            font-size: 19px;
            font-weight: 700;
        }

        .brand-subtitle {
            color: var(--muted);
            font-size: 12px;
        }

        nav {
            display: grid;
            gap: 8px;
        }

        nav button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-align: left;
            padding: 10px 12px;
            background: transparent;
        }

        nav button.active {
            background: #ffffff;
            border-color: #bfe5cd;
            box-shadow: 0 10px 30px rgba(30, 54, 38, 0.08);
        }

        .side-status {
            margin-top: 22px;
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--muted);
            font-size: 12px;
            line-height: 1.6;
        }

        .dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            margin-right: 7px;
            background: var(--butter-strong);
        }

        .dot.ok { background: var(--mint-strong); }
        .dot.bad { background: var(--peach-strong); }

        main {
            padding: 24px;
            min-width: 0;
        }

        .header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 18px;
            margin-bottom: 16px;
        }

        h1 {
            margin: 0;
            font-size: clamp(28px, 4vw, 44px);
            line-height: 1;
            letter-spacing: 0;
        }

        .subtitle {
            margin-top: 9px;
            color: var(--muted);
            max-width: 820px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .filterbar {
            display: grid;
            grid-template-columns: 1fr 1fr 1.2fr auto;
            gap: 10px;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: rgba(255, 255, 255, 0.82);
            box-shadow: var(--shadow);
            margin-bottom: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
            gap: 14px;
        }

        .panel {
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: rgba(255, 255, 255, 0.92);
            box-shadow: var(--shadow);
            padding: 16px;
            min-width: 0;
        }

        .span-3 { grid-column: span 3; }
        .span-4 { grid-column: span 4; }
        .span-5 { grid-column: span 5; }
        .span-6 { grid-column: span 6; }
        .span-7 { grid-column: span 7; }
        .span-8 { grid-column: span 8; }
        .span-12 { grid-column: span 12; }

        .panel-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 14px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .kpi-value {
            font-size: 30px;
            line-height: 1;
            font-weight: 700;
        }

        .kpi-caption {
            margin-top: 8px;
            color: var(--muted);
            font-size: 12px;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            min-height: 24px;
            padding: 4px 9px;
            border-radius: 999px;
            color: var(--ink);
            background: var(--sky);
            font-size: 11px;
            font-weight: 700;
        }

        .pill.ok { background: var(--mint); color: #155932; }
        .pill.warn { background: var(--butter); color: #795404; }
        .pill.bad { background: var(--peach); color: #88361f; }
        .pill.ai { background: var(--lilac); color: #493c78; }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        label {
            display: grid;
            gap: 6px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
        }

        .full { grid-column: 1 / -1; }

        .row-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .row-actions input {
            flex: 1;
            min-width: 220px;
        }

        .chart {
            width: 100%;
            height: 230px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background:
                linear-gradient(#eef5ef 1px, transparent 1px),
                linear-gradient(90deg, #eef5ef 1px, transparent 1px),
                #ffffff;
            background-size: 42px 42px;
            overflow: hidden;
        }

        .wallet-visuals {
            display: grid;
            grid-template-columns: minmax(260px, 0.9fr) minmax(260px, 1.1fr) minmax(260px, 1fr);
            gap: 14px;
        }

        .pie-shell {
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 16px;
            align-items: center;
        }

        .pie {
            width: 160px;
            height: 160px;
        }

        .legend {
            display: grid;
            gap: 8px;
            font-size: 12px;
        }

        .legend-row {
            display: grid;
            grid-template-columns: 12px 1fr auto;
            gap: 8px;
            align-items: center;
        }

        .swatch {
            width: 12px;
            height: 12px;
            border-radius: 4px;
        }

        .mini-metrics {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .mini-metric {
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 12px;
            background: var(--surface-soft);
        }

        .mini-metric strong {
            display: block;
            margin-top: 6px;
            font-size: 20px;
        }

        .pnl-bars {
            display: grid;
            gap: 12px;
        }

        .pnl-bar {
            display: grid;
            gap: 6px;
        }

        .pnl-head {
            display: flex;
            justify-content: space-between;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
        }

        .pnl-track {
            height: 18px;
            border-radius: 999px;
            background: #edf3ed;
            overflow: hidden;
        }

        .pnl-fill {
            height: 100%;
            min-width: 2px;
            border-radius: 999px;
            background: var(--mint-strong);
        }

        .pnl-fill.negative {
            background: var(--peach-strong);
        }

        .wallet-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .wallet-tab {
            border-radius: 999px;
            padding: 10px 16px;
            background: var(--surface-soft);
        }

        .wallet-tab.active {
            background: var(--ink);
            border-color: var(--ink);
            color: #ffffff;
        }

        .position-alert {
            border-left: 5px solid var(--sky-strong);
        }

        .position-alert.zcash {
            border-left-color: var(--mint-strong);
            background:
                linear-gradient(90deg, rgba(201, 243, 221, 0.68), transparent 38%),
                var(--surface);
        }

        .month-header {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .month-title {
            margin: 0;
            font-size: 26px;
            letter-spacing: -0.04em;
        }

        .month-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 10px;
        }

        .weekday {
            color: var(--muted);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 0 4px;
        }

        .month-day {
            min-height: 122px;
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 12px;
            display: grid;
            align-content: space-between;
            background: var(--butter);
        }

        .month-day.profit {
            background: linear-gradient(145deg, var(--mint), #effbf4);
            border-color: #a7dfbf;
        }

        .month-day.loss {
            background: linear-gradient(145deg, var(--peach), #fff4ee);
            border-color: #efb7a6;
        }

        .month-day.no-trade,
        .month-day.flat {
            background: linear-gradient(145deg, var(--butter), #fff9df);
            border-color: #efd882;
        }

        .month-day.future {
            background: #f3f6f3;
            color: var(--muted);
            opacity: 0.72;
        }

        .month-day.blank {
            min-height: 1px;
            padding: 0;
            border: 0;
            background: transparent;
        }

        .month-day.today {
            box-shadow: 0 0 0 3px rgba(20, 33, 24, 0.10);
        }

        .month-day-head {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
        }

        .month-day strong {
            display: block;
            margin-top: 14px;
            font-size: 22px;
            letter-spacing: -0.04em;
        }

        .month-day small {
            color: var(--muted);
            font-weight: 700;
        }

        .bars {
            display: grid;
            gap: 12px;
        }

        .bar-row {
            display: grid;
            grid-template-columns: 92px 1fr 42px;
            gap: 10px;
            align-items: center;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
        }

        .bar-track {
            height: 12px;
            border-radius: 999px;
            background: #edf3ed;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            border-radius: 999px;
            background: var(--mint-strong);
        }

        .table-wrap {
            overflow: auto;
            border: 1px solid var(--line);
            border-radius: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 780px;
            font-size: 13px;
        }

        th, td {
            padding: 11px 12px;
            border-bottom: 1px solid var(--line);
            text-align: left;
            vertical-align: top;
        }

        th {
            color: var(--muted);
            background: var(--surface-soft);
            font-size: 11px;
            text-transform: uppercase;
        }

        tr:last-child td {
            border-bottom: 0;
        }

        .mono {
            font-family: "JetBrains Mono", monospace;
            font-size: 12px;
        }

        .log {
            display: grid;
            gap: 9px;
            max-height: 420px;
            overflow: auto;
        }

        .log-line {
            display: grid;
            grid-template-columns: 138px 88px 1fr;
            gap: 10px;
            align-items: start;
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--surface-soft);
            font-size: 12px;
        }

        .chat {
            display: grid;
            gap: 10px;
            max-height: 430px;
            overflow: auto;
        }

        .chat-message {
            max-width: 88%;
            padding: 11px 12px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: var(--surface-soft);
            font-size: 13px;
            line-height: 1.45;
        }

        .chat-message.user {
            justify-self: end;
            background: var(--sky);
        }

        .chat-message.assistant {
            justify-self: start;
            background: var(--mint);
        }

        pre {
            margin: 0;
            max-height: 520px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: "JetBrains Mono", monospace;
            font-size: 12px;
            line-height: 1.55;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: #fbfdfb;
        }

        .hidden { display: none; }

        @media (max-width: 1100px) {
            .app { grid-template-columns: 1fr; }
            aside {
                position: static;
                height: auto;
                border-right: 0;
                border-bottom: 1px solid var(--line);
            }
            nav { grid-template-columns: repeat(3, minmax(0, 1fr)); }
            .span-3, .span-4, .span-5, .span-6, .span-7, .span-8 { grid-column: span 12; }
            .filterbar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .wallet-visuals { grid-template-columns: 1fr; }
            .month-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        }

        @media (max-width: 680px) {
            main { padding: 14px; }
            .header { display: grid; }
            .header-actions button { flex: 1; }
            .filterbar, .form-grid { grid-template-columns: 1fr; }
            nav { grid-template-columns: 1fr; }
            .log-line { grid-template-columns: 1fr; }
            .pie-shell { grid-template-columns: 1fr; }
            .mini-metrics { grid-template-columns: 1fr; }
            .month-header { display: grid; }
            .month-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .weekday { display: none; }
            .month-day.blank { display: none; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useEffect, useMemo, useState } = React;

        const ORDER_KEY = "metricflow.bot.orders.v1";
        const LOG_KEY = "metricflow.bot.logs.v1";

        const freshSignal = () => ({
            signal_id: `manual-${Date.now()}`,
            symbol: "BTCUSD",
            timeframe: "1h",
            direction: "LONG",
            intent: "ENTRY",
            account_mode: "SPOT",
            timestamp: new Date().toISOString(),
            entry_price: 50000,
            stop_price: 48000,
            target_price: 54000,
            confluence_score: 85,
            crisis_score: 10,
            mc_dispersion: 2,
            spread: 5,
            order_command: "GO",
            market_regime: "",
            bar_confirmed: true,
            relative_volume: "",
            chop_index: "",
            hurst_exponent: "",
            drawdown_pct: "",
            pending_order_age_seconds: "",
            leverage: "",
            execution_quantity: "",
            macro_event_risk: false
        });

        const readStorage = (key, fallback) => {
            try {
                return JSON.parse(localStorage.getItem(key)) || fallback;
            } catch {
                return fallback;
            }
        };

        const writeStorage = (key, value) => localStorage.setItem(key, JSON.stringify(value));
        const pretty = (value) => JSON.stringify(value, null, 2);
        const num = (value, fallback = 0) => Number.isFinite(Number(value)) ? Number(value) : fallback;
        const money = (value) => Number.isFinite(Number(value)) ? Number(value).toLocaleString(undefined, { maximumFractionDigits: 2 }) : "0";
        const walletAmount = (wallet) => wallet && wallet.error ? "error" : money(wallet?.balance);
        const assetUsdtValue = (asset) => Number.isFinite(Number(asset?.value_usdt)) ? Number(asset.value_usdt) : (asset?.coin === "USDT" ? num(asset.balance) : null);
        const flattenWalletAssets = (primaryWallet, futuresWallet) => [
            ...((primaryWallet?.assets || []).map(asset => ({ ...asset, walletName: "Primary" }))),
            ...((futuresWallet?.assets || []).map(asset => ({ ...asset, walletName: "Futures" })))
        ];

        function walletSummary(primaryWallet, futuresWallet, orders) {
            const assets = flattenWalletAssets(primaryWallet, futuresWallet);
            const knownValue = assets.reduce((sum, asset) => {
                const value = assetUsdtValue(asset);
                return sum + (value === null ? 0 : value);
            }, 0);
            const unpriced = assets.filter(asset => assetUsdtValue(asset) === null && num(asset.balance) !== 0);
            const usdtAssets = assets.filter(asset => asset.coin === "USDT");
            const availableUsdt = usdtAssets.reduce((sum, asset) => sum + (asset.available === null || asset.available === undefined ? num(asset.balance) : num(asset.available)), 0);
            const frozenUsdt = usdtAssets.reduce((sum, asset) => sum + num(asset.locked), 0);
            const combinedUsdt = availableUsdt + frozenUsdt;
            const now = Date.now();
            const realized = (days, source = null) => orders
                .filter(order => !days || now - new Date(order.at).getTime() <= days * 86400000)
                .filter(order => !source || order.source === source)
                .reduce((sum, order) => sum + num(order.realized_pnl_quote), 0);
            return {
                assets,
                knownValue,
                unpriced,
                availableUsdt,
                frozenUsdt,
                combinedUsdt,
                dailyPnl: realized(1),
                weeklyPnl: realized(7),
                humanPnl: realized(null, "manual"),
                algoPnl: realized(null, "backtest")
            };
        }

        function dateKey(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, "0");
            const day = String(date.getDate()).padStart(2, "0");
            return `${year}-${month}-${day}`;
        }

        function monthlyPnlData(orders) {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const todayStart = new Date(year, month, now.getDate());
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDay = new Date(year, month, 1);
            const leadingBlanks = (firstDay.getDay() + 6) % 7;
            const days = Array.from({ length: daysInMonth }, (_, index) => {
                const date = new Date(year, month, index + 1);
                return {
                    key: dateKey(date),
                    date,
                    pnl: 0,
                    trades: 0,
                    sourceCounts: { manual: 0, backtest: 0 }
                };
            });
            const byKey = Object.fromEntries(days.map(day => [day.key, day]));

            orders.forEach(order => {
                const at = new Date(order.at);
                if (Number.isNaN(at.getTime()) || at.getFullYear() !== year || at.getMonth() !== month) return;
                if (!String(order.final_decision || "").includes("EXECUTED")) return;
                const bucket = byKey[dateKey(at)];
                if (!bucket) return;
                bucket.trades += 1;
                bucket.pnl += num(order.realized_pnl_quote);
                if (order.source === "manual") bucket.sourceCounts.manual += 1;
                if (order.source === "backtest") bucket.sourceCounts.backtest += 1;
            });

            const decoratedDays = days.map(day => {
                const future = day.date > todayStart;
                const state = future
                    ? "future"
                    : day.trades === 0
                        ? "no-trade"
                        : day.pnl > 0
                            ? "profit"
                            : day.pnl < 0
                                ? "loss"
                                : "flat";
                return { ...day, future, state, isToday: day.key === dateKey(now) };
            });
            const elapsedDays = decoratedDays.filter(day => !day.future);
            return {
                monthLabel: now.toLocaleDateString(undefined, { month: "long", year: "numeric" }),
                leadingBlanks,
                days: decoratedDays,
                totalPnl: elapsedDays.reduce((sum, day) => sum + day.pnl, 0),
                executedTrades: elapsedDays.reduce((sum, day) => sum + day.trades, 0),
                profitDays: elapsedDays.filter(day => day.pnl > 0).length,
                lossDays: elapsedDays.filter(day => day.pnl < 0).length,
                noTradeDays: elapsedDays.filter(day => day.trades === 0).length
            };
        }

        function positionRows(positionsPayload) {
            return Array.isArray(positionsPayload?.positions) ? positionsPayload.positions : [];
        }

        function positionSummary(positionsPayload) {
            const positions = positionRows(positionsPayload);
            const summary = positionsPayload?.summary || {};
            const zcashPositions = positions.filter(position => position.is_zcash || String(position.symbol || "").startsWith("ZEC_"));
            return {
                positions,
                openCount: positionsPayload?.open_count ?? positions.length,
                error: positionsPayload?.error || "",
                totalInitialMargin: num(summary.total_initial_margin, positions.reduce((sum, position) => sum + num(position.initial_margin), 0)),
                totalMaintMargin: num(summary.total_maint_margin, positions.reduce((sum, position) => sum + num(position.maint_margin), 0)),
                totalUnrealizedPnl: num(summary.total_unrealized_pnl, positions.reduce((sum, position) => sum + num(position.unrealized_pnl), 0)),
                zcashOpenCount: num(summary.zcash_open_count, zcashPositions.length),
                zcashInitialMargin: num(summary.zcash_initial_margin, zcashPositions.reduce((sum, position) => sum + num(position.initial_margin), 0)),
                zcashUnrealizedPnl: num(summary.zcash_unrealized_pnl, zcashPositions.reduce((sum, position) => sum + num(position.unrealized_pnl), 0))
            };
        }

        function botRows(botsPayload) {
            return Array.isArray(botsPayload?.bots) ? botsPayload.bots : [];
        }

        function botSummary(botsPayload) {
            const bots = botRows(botsPayload);
            const summary = botsPayload?.summary || {};
            const zcashBots = bots.filter(bot => bot.is_zcash || String(bot.symbol || "").startsWith("ZEC_"));
            return {
                bots,
                error: botsPayload?.error || "",
                openCount: botsPayload?.open_count ?? bots.length,
                futuresGridCount: num(summary.futures_grid_count, bots.filter(bot => bot.bot_type === "futures_grid").length),
                zcashBotCount: num(summary.zcash_bot_count, zcashBots.length),
                totalMarginBalance: num(summary.total_margin_balance, bots.reduce((sum, bot) => sum + num(bot.margin_balance), 0)),
                totalQuoteInvestment: num(summary.total_quote_investment, bots.reduce((sum, bot) => sum + num(bot.quote_investment), 0)),
                totalExtraBalance: num(summary.total_extra_balance, bots.reduce((sum, bot) => sum + num(bot.extra_balance), 0)),
                zcashMarginBalance: num(summary.zcash_margin_balance, zcashBots.reduce((sum, bot) => sum + num(bot.margin_balance), 0)),
                zcashQuoteInvestment: num(summary.zcash_quote_investment, zcashBots.reduce((sum, bot) => sum + num(bot.quote_investment), 0)),
                zcashExtraBalance: num(summary.zcash_extra_balance, zcashBots.reduce((sum, bot) => sum + num(bot.extra_balance), 0))
            };
        }

        function statusPill(value) {
            if (String(value || "").includes("EXECUTED") || String(value || "").includes("ok")) return "pill ok";
            if (String(value || "").includes("REJECT")) return "pill bad";
            return "pill warn";
        }

        function App() {
            const [tab, setTab] = useState("Overview");
            const [health, setHealth] = useState({ status: "checking" });
            const [status, setStatus] = useState(null);
            const [signal, setSignal] = useState(freshSignal());
            const [backtest, setBacktest] = useState({ symbol: "HYPEUSDT", timeframe: "1m", bars: 500, max_signals: 10, min_confluence: "" });
            const [orders, setOrders] = useState(() => readStorage(ORDER_KEY, []));
            const [logs, setLogs] = useState(() => readStorage(LOG_KEY, []));
            const [raw, setRaw] = useState("Waiting for bot activity.");
            const [loading, setLoading] = useState(false);
            const [filters, setFilters] = useState({ date: "all", segment: "all", symbol: "" });
            const [aiLayer, setAiLayer] = useState({ provider: "", profile: null, memory: [], behavior_prompt: "" });
            const [aiMessage, setAiMessage] = useState("");
            const [chartState, setChartState] = useState({ symbol: "BTCUSDT", timeframe: "1h", bars: [], indicators: [], loading: false });
            const chartRef = React.useRef(null);
            const chartContainerRef = React.useRef(null);

            function addLog(level, message, data = null) {
                const entry = { id: `${Date.now()}-${Math.random()}`, at: new Date().toISOString(), level, message, data };
                setLogs(current => {
                    const next = [entry, ...current].slice(0, 120);
                    writeStorage(LOG_KEY, next);
                    return next;
                });
            }

            function addOrders(newOrders) {
                setOrders(current => {
                    const merged = [...newOrders, ...current].slice(0, 250);
                    writeStorage(ORDER_KEY, merged);
                    return merged;
                });
            }

            async function request(path, options = {}) {
                const response = await fetch(path, {
                    headers: { "Content-Type": "application/json", ...(options.headers || {}) },
                    ...options
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || `HTTP ${response.status}`);
                return data;
            }

            async function refreshStatus() {
                try {
                    const [healthData, statusData] = await Promise.all([request("/health"), request("/backtest/status")]);
                    setHealth(healthData);
                    setStatus(statusData);
                } catch (error) {
                    setHealth({ status: "error", error: error.message });
                    addLog("error", "Status refresh failed", { error: error.message });
                }
            }

            async function refreshAIProfile() {
                try {
                    const data = await request("/ai/profile");
                    setAiLayer(data);
                } catch (error) {
                    addLog("error", "AI profile refresh failed", { error: error.message });
                }
            }

            useEffect(() => {
                refreshStatus();
                refreshAIProfile();
                const timer = setInterval(refreshStatus, 10000);
                return () => clearInterval(timer);
            }, []);

            function updateAIProfile(key, value) {
                setAiLayer(current => ({
                    ...current,
                    profile: {
                        ...(current.profile || {}),
                        [key]: value
                    }
                }));
            }

            function normalizeProfile(profile) {
                return {
                    ...profile,
                    preferred_symbols: Array.isArray(profile.preferred_symbols) ? profile.preferred_symbols : String(profile.preferred_symbols || "").split(",").map(item => item.trim()).filter(Boolean),
                    blocked_symbols: Array.isArray(profile.blocked_symbols) ? profile.blocked_symbols : String(profile.blocked_symbols || "").split(",").map(item => item.trim()).filter(Boolean),
                    guardrails: Array.isArray(profile.guardrails) ? profile.guardrails : String(profile.guardrails || "").split("\n").map(item => item.trim()).filter(Boolean),
                    max_risk_pct: profile.max_risk_pct === "" ? null : profile.max_risk_pct,
                    min_confluence_preference: profile.min_confluence_preference === "" ? null : profile.min_confluence_preference
                };
            }

            function cleanPayload(base) {
                const payload = {
                    ...base,
                    entry_price: num(base.entry_price),
                    stop_price: num(base.stop_price),
                    target_price: num(base.target_price),
                    confluence_score: num(base.confluence_score),
                    crisis_score: num(base.crisis_score),
                    mc_dispersion: num(base.mc_dispersion),
                    spread: num(base.spread),
                    bar_confirmed: Boolean(base.bar_confirmed),
                    macro_event_risk: Boolean(base.macro_event_risk)
                };

                ["relative_volume", "chop_index", "hurst_exponent", "drawdown_pct", "pending_order_age_seconds", "leverage", "execution_quantity"].forEach(key => {
                    if (payload[key] === "" || payload[key] === null || payload[key] === undefined) {
                        delete payload[key];
                    } else {
                        payload[key] = num(payload[key]);
                    }
                });

                if (!payload.market_regime) delete payload.market_regime;
                return payload;
            }

            function orderFromSignal(payload, response) {
                const result = response.result || {};
                const fill = result.simulated_fill || {};
                const broker = result.broker_result || {};
                const delta = broker.ledger_delta || {};
                return {
                    id: result.trade_id || result.signal_id || payload.signal_id,
                    at: new Date().toISOString(),
                    source: "manual",
                    signal_id: result.signal_id || payload.signal_id,
                    trade_id: result.trade_id || "",
                    symbol: delta.symbol || fill.symbol || payload.symbol,
                    direction: payload.direction,
                    intent: payload.intent,
                    account_mode: delta.account_mode || fill.account_mode || payload.account_mode,
                    entry_price: payload.entry_price,
                    size_base: delta.size_base || fill.size_base || delta.closed_size_base || fill.closed_size_base || "",
                    value_usdt: fill.order_value_usdt || "",
                    risk_pct: fill.risk_pct || "",
                    client_order_id: delta.client_order_id || fill.client_order_id || "",
                    final_decision: result.final_decision || "",
                    broker_status: broker.status || "",
                    ai_decision: result.ai_decision || "",
                    ai_trace: result.ai_trace || null,
                    reject_reason: result.reject_reason || broker.reject_reason || "",
                    realized_pnl_quote: broker.realized_pnl_quote || 0,
                    raw: response
                };
            }

            function ordersFromBacktest(response) {
                return (response.results || []).map(row => ({
                    id: row.signal_id,
                    at: new Date().toISOString(),
                    source: "backtest",
                    signal_id: row.signal_id,
                    trade_id: "",
                    symbol: response.symbol,
                    direction: row.direction,
                    intent: "ENTRY",
                    account_mode: "SIM",
                    entry_price: row.entry_price,
                    size_base: "",
                    value_usdt: "",
                    risk_pct: "",
                    client_order_id: "",
                    final_decision: row.final_decision,
                    broker_status: row.final_decision,
                    ai_decision: "",
                    ai_trace: row.ai_trace || null,
                    reject_reason: row.reject_reason || "",
                    realized_pnl_quote: 0,
                    raw: row
                }));
            }

            async function submitSignal(event) {
                event.preventDefault();
                setLoading(true);
                try {
                    const payload = cleanPayload(signal);
                    const response = await request("/webhook/m8", { method: "POST", body: JSON.stringify(payload) });
                    const order = orderFromSignal(payload, response);
                    addOrders([order]);
                    setRaw(pretty(response));
                    addLog("order", `${order.final_decision} ${order.symbol} ${order.intent}`, order);
                    await refreshStatus();
                } catch (error) {
                    setRaw(`ERROR: ${error.message}`);
                    addLog("error", "Manual signal failed", { error: error.message });
                } finally {
                    setLoading(false);
                }
            }

            async function runBacktest(event) {
                event.preventDefault();
                setLoading(true);
                try {
                    const params = new URLSearchParams({
                        symbol: backtest.symbol,
                        timeframe: backtest.timeframe,
                        bars: String(backtest.bars),
                        max_signals: String(backtest.max_signals)
                    });
                    if (backtest.min_confluence !== "") params.set("min_confluence", String(backtest.min_confluence));
                    const response = await request(`/backtest/run?${params.toString()}`, { method: "POST" });
                    const backtestOrders = ordersFromBacktest(response);
                    addOrders(backtestOrders);
                    setRaw(pretty(response));
                    addLog("backtest", `${response.signals_generated || 0} signals on ${response.symbol}`, response);
                    await refreshStatus();
                } catch (error) {
                    setRaw(`ERROR: ${error.message}`);
                    addLog("error", "Backtest failed", { error: error.message });
                } finally {
                    setLoading(false);
                }
            }

            async function resetBot() {
                setLoading(true);
                try {
                    const response = await request("/backtest/reset", { method: "POST" });
                    setRaw(pretty(response));
                    addLog("system", "Bot state reset", response);
                    await refreshStatus();
                } catch (error) {
                    setRaw(`ERROR: ${error.message}`);
                    addLog("error", "Reset failed", { error: error.message });
                } finally {
                    setLoading(false);
                }
            }

            async function saveAIProfile() {
                if (!aiLayer.profile) return;
                setLoading(true);
                try {
                    const response = await request("/ai/profile", {
                        method: "POST",
                        body: JSON.stringify(normalizeProfile(aiLayer.profile))
                    });
                    setAiLayer(current => ({ ...current, ...response, memory: current.memory || [] }));
                    setRaw(pretty(response));
                    addLog("ai", "AI behavior profile saved", response.profile);
                    await refreshAIProfile();
                } catch (error) {
                    setRaw(`ERROR: ${error.message}`);
                    addLog("error", "AI profile save failed", { error: error.message });
                } finally {
                    setLoading(false);
                }
            }

            async function sendAIMessage(event) {
                event.preventDefault();
                if (!aiMessage.trim()) return;
                setLoading(true);
                try {
                    const response = await request("/ai/chat", {
                        method: "POST",
                        body: JSON.stringify({ message: aiMessage, apply_to_profile: true })
                    });
                    setAiLayer(current => ({ ...current, ...response }));
                    setRaw(pretty(response));
                    setAiMessage("");
                    addLog("ai", "AI layer chat updated behavior memory", response.raw_profile_patch);
                    await refreshAIProfile();
                } catch (error) {
                    setRaw(`ERROR: ${error.message}`);
                    addLog("error", "AI layer chat failed", { error: error.message });
                } finally {
                    setLoading(false);
                }
            }

            async function resetAIMemory() {
                setLoading(true);
                try {
                    const response = await request("/ai/reset", { method: "POST" });
                    setRaw(pretty(response));
                    addLog("ai", "AI layer memory reset", response.profile);
                    await refreshAIProfile();
                } catch (error) {
                    setRaw(`ERROR: ${error.message}`);
                    addLog("error", "AI memory reset failed", { error: error.message });
                } finally {
                    setLoading(false);
                }
            }

            function clearLocalHistory() {
                setOrders([]);
                setLogs([]);
                writeStorage(ORDER_KEY, []);
                writeStorage(LOG_KEY, []);
                setRaw("Local dashboard history cleared.");
            }

            const filteredOrders = useMemo(() => {
                const now = Date.now();
                const days = filters.date === "7d" ? 7 : filters.date === "30d" ? 30 : null;
                return orders.filter(order => {
                    if (filters.symbol && !String(order.symbol || "").toUpperCase().includes(filters.symbol.toUpperCase())) return false;
                    if (days && now - new Date(order.at).getTime() > days * 86400000) return false;
                    if (filters.segment === "executed" && !String(order.final_decision).includes("EXECUTED")) return false;
                    if (filters.segment === "rejected" && !String(order.final_decision).includes("REJECT")) return false;
                    if (filters.segment === "manual" && order.source !== "manual") return false;
                    if (filters.segment === "backtest" && order.source !== "backtest") return false;
                    return true;
                });
            }, [orders, filters]);

            const stats = useMemo(() => {
                const executed = filteredOrders.filter(o => String(o.final_decision).includes("EXECUTED")).length;
                const rejected = filteredOrders.filter(o => String(o.final_decision).includes("REJECT")).length;
                const pnl = filteredOrders.reduce((sum, order) => sum + num(order.realized_pnl_quote), 0);
                const active = filteredOrders.filter(o => o.intent === "ENTRY" && String(o.final_decision).includes("EXECUTED")).length;
                return { executed, rejected, pnl, active, total: filteredOrders.length };
            }, [filteredOrders]);

            const broker = status?.broker || {};
            const ai = status?.ai || {};
            const risk = status?.risk_engine_state || {};
            const wallets = broker.wallets || {};
            const primaryWallet = wallets.primary || broker.balance || {};
            const futuresWallet = wallets.futures || {};
            const positions = broker.positions || { positions: [] };
            const bots = broker.bots || { bots: [] };

            return (
                <div className="app">
                    <aside>
                        <div className="brand">
                            <div className="brand-mark">MF</div>
                            <div className="brand-title">MetricFlow Bot</div>
                            <div className="brand-subtitle">Multi-agent trading control</div>
                        </div>

                        <nav>
                            {["Overview", "Wallets", "Charts", "Control", "AI Layer", "Orders", "Backtest", "Logs"].map(item => (
                                <button key={item} className={tab === item ? "active" : ""} onClick={() => setTab(item)}>
                                    <span>{item}</span><span>{tab === item ? "On" : ""}</span>
                                </button>
                            ))}
                        </nav>

                        <div className="side-status">
                            <div><span className={`dot ${health.status === "ok" ? "ok" : "bad"}`}></span>API {health.status}</div>
                            <div>Broker {broker.type || "loading"}</div>
                            <div>Mode {broker.mode || "unknown"}</div>
                            <div>AI {ai.provider || "loading"}</div>
                            <div>Primary {walletAmount(primaryWallet)} USDT</div>
                            <div>Futures {walletAmount(futuresWallet)} USDT</div>
                        </div>
                    </aside>

                    <main>
                        <div className="header">
                            <div>
                                <h1>Bot Command Center</h1>
                                <div className="subtitle">Live operational view for AI review, deterministic risk gates, Pionex execution, backtests, orders, and local activity logs.</div>
                            </div>
                            <div className="header-actions">
                                <button onClick={() => { refreshStatus(); refreshAIProfile(); }} disabled={loading}>Refresh</button>
                                <button className="warning" onClick={resetBot} disabled={loading}>Reset Bot</button>
                                <button className="danger" onClick={clearLocalHistory} disabled={loading}>Clear UI History</button>
                            </div>
                        </div>

                        <div className="filterbar">
                            <select value={filters.date} onChange={e => setFilters({ ...filters, date: e.target.value })}>
                                <option value="all">All dates</option>
                                <option value="7d">Last 7 days</option>
                                <option value="30d">Last 30 days</option>
                            </select>
                            <select value={filters.segment} onChange={e => setFilters({ ...filters, segment: e.target.value })}>
                                <option value="all">All segments</option>
                                <option value="executed">Executed</option>
                                <option value="rejected">Rejected</option>
                                <option value="manual">Manual signals</option>
                                <option value="backtest">Backtests</option>
                            </select>
                            <input placeholder="Filter symbol" value={filters.symbol} onChange={e => setFilters({ ...filters, symbol: e.target.value })} />
                            <button className="primary" onClick={() => setTab("Control")}>New Order</button>
                        </div>

                        <section className={tab === "Overview" ? "" : "hidden"}>
                            <Overview stats={stats} broker={broker} ai={ai} risk={risk} primaryWallet={primaryWallet} futuresWallet={futuresWallet} orders={filteredOrders} logs={logs} />
                        </section>

                        <section className={tab === "Wallets" ? "" : "hidden"}>
                            <Wallets primaryWallet={primaryWallet} futuresWallet={futuresWallet} positions={positions} bots={bots} orders={filteredOrders} />
                        </section>

                        <section className={tab === "Charts" ? "" : "hidden"}>
                            <ChartPanel chartState={chartState} setChartState={setChartState} chartRef={chartRef} chartContainerRef={chartContainerRef} orders={filteredOrders} />
                        </section>

                        <section className={tab === "Control" ? "" : "hidden"}>
                            <Control signal={signal} setSignal={setSignal} submitSignal={submitSignal} loading={loading} addLog={addLog} setRaw={setRaw} />
                        </section>

                        <section className={tab === "AI Layer" ? "" : "hidden"}>
                            <AILayer
                                aiLayer={aiLayer}
                                aiMessage={aiMessage}
                                setAiMessage={setAiMessage}
                                sendAIMessage={sendAIMessage}
                                updateAIProfile={updateAIProfile}
                                saveAIProfile={saveAIProfile}
                                resetAIMemory={resetAIMemory}
                                loading={loading}
                                orders={orders}
                                chartState={chartState}
                                request={request}
                                addLog={addLog}
                                setRaw={setRaw}
                                setAiLayer={setAiLayer}
                            />
                        </section>

                        <section className={tab === "Orders" ? "" : "hidden"}>
                            <Orders orders={filteredOrders} />
                        </section>

                        <section className={tab === "Backtest" ? "" : "hidden"}>
                            <Backtest backtest={backtest} setBacktest={setBacktest} runBacktest={runBacktest} loading={loading} orders={filteredOrders} />
                        </section>

                        <section className={tab === "Logs" ? "" : "hidden"}>
                            <Logs logs={logs} raw={raw} status={{ health, status }} />
                        </section>
                    </main>
                </div>
            );
        }

        function Overview({ stats, broker, ai, risk, primaryWallet, futuresWallet, orders, logs }) {
            const summary = walletSummary(primaryWallet, futuresWallet, orders);
            return (
                <div className="grid">
                    <Kpi title="Primary Wallet" value={walletAmount(primaryWallet)} caption="SPOT tradable USDT" tone="ok" />
                    <Kpi title="Futures Wallet" value={walletAmount(futuresWallet)} caption="FUTURES margin USDT" tone="warn" />
                    <Kpi title="AI Provider" value={ai.provider || "..."} caption={ai.failure_policy || "Policy"} tone="ai" />
                    <Kpi title="Executions" value={stats.executed} caption={`${stats.rejected} rejected`} tone="ok" />

                    <div className="panel span-12">
                        <div className="panel-title">Wallet Intelligence <span className="pill">{summary.assets.length} assets</span></div>
                        <WalletVisuals summary={summary} />
                    </div>

                    <div className="panel span-8">
                        <div className="panel-title">Execution Flow <span className="pill">{orders.length} records</span></div>
                        <LineChart orders={orders} />
                    </div>
                    <div className="panel span-4">
                        <div className="panel-title">Decision Mix</div>
                        <DecisionBars orders={orders} />
                    </div>
                    <div className="panel span-7">
                        <div className="panel-title">Recent Activity</div>
                        <OrderTable orders={orders.slice(0, 8)} compact />
                    </div>
                    <div className="panel span-5">
                        <div className="panel-title">System Log <span className="pill">{logs.length}</span></div>
                        <LogList logs={logs.slice(0, 6)} />
                    </div>
                    <div className="panel span-12">
                        <div className="panel-title">Wallet Assets <span className="pill">{(primaryWallet.assets || []).length + (futuresWallet.assets || []).length} assets</span></div>
                        <WalletAssetTable wallets={[["Primary", primaryWallet], ["Futures", futuresWallet]]} compact />
                    </div>
                </div>
            );
        }

        function Wallets({ primaryWallet, futuresWallet, positions, bots, orders }) {
            const summary = walletSummary(primaryWallet, futuresWallet, orders);
            const [walletTab, setWalletTab] = useState("Summary");
            const walletTabs = ["Summary", "Assets", "Monthly PnL"];
            return (
                <div className="grid">
                    <div className="panel span-12">
                        <div className="panel-title">Wallet Section <span className="pill">{walletTab}</span></div>
                        <div className="wallet-tabs">
                            {walletTabs.map(tab => (
                                <button
                                    key={tab}
                                    className={`wallet-tab ${walletTab === tab ? "active" : ""}`}
                                    onClick={() => setWalletTab(tab)}
                                >
                                    {tab}
                                </button>
                            ))}
                        </div>
                    </div>

                    {walletTab === "Summary" && (
                        <React.Fragment>
                            <div className="panel span-12">
                                <div className="panel-title">Wallet Value Overview <span className="pill">{summary.unpriced.length} unpriced</span></div>
                                <WalletVisuals summary={summary} />
                            </div>

                            <PositionExposurePanel positionsPayload={positions} />
                            <BotExposurePanel botsPayload={bots} />

                            <Kpi title="Primary Wallet" value={walletAmount(primaryWallet)} caption={`${primaryWallet.asset_count || 0} spot assets`} tone="ok" />
                            <Kpi title="Futures Wallet" value={walletAmount(futuresWallet)} caption={`${futuresWallet.asset_count || 0} futures assets`} tone="warn" />
                            <Kpi title="Primary Mode" value={primaryWallet.account_mode || "SPOT"} caption="Trading source wallet" tone="ok" />
                            <Kpi title="Futures Mode" value={futuresWallet.account_mode || "FUTURES"} caption="Margin wallet" tone="warn" />
                        </React.Fragment>
                    )}

                    {walletTab === "Assets" && (
                        <React.Fragment>
                            <div className="panel span-12">
                                <div className="panel-title">Full Wallet Information</div>
                                <WalletAssetTable wallets={[["Primary", primaryWallet], ["Futures", futuresWallet]]} />
                            </div>

                            <div className="panel span-6">
                                <div className="panel-title">Primary Raw Wallet</div>
                                <pre>{pretty(primaryWallet)}</pre>
                            </div>
                            <div className="panel span-6">
                                <div className="panel-title">Futures Raw Wallet</div>
                                <pre>{pretty(futuresWallet)}</pre>
                            </div>
                        </React.Fragment>
                    )}

                    {walletTab === "Monthly PnL" && <MonthlyPnlCalendar orders={orders} />}
                </div>
            );
        }

        function MonthlyPnlCalendar({ orders }) {
            const data = monthlyPnlData(orders);
            const weekdays = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
            return (
                <div className="panel span-12">
                    <div className="month-header">
                        <div>
                            <h2 className="month-title">{data.monthLabel}</h2>
                            <div className="kpi-caption">One tile per day. Green means profitable, red means loss, yellow means no executed trade or flat PnL.</div>
                        </div>
                        <div className="mini-metrics">
                            <MiniMetric label="Month PnL" value={<SignedMoney value={data.totalPnl} />} />

        function AssetPieChart({ summary }) {
            const palette = ["#71d8a8", "#8fc7ff", "#ffd782", "#ffb49f", "#c9b8ff", "#9be2df"];
            const slices = summary.assets
                .map((asset, index) => ({
                    label: `${asset.walletName} ${asset.coin || "Asset"}`,
                    value: assetUsdtValue(asset),
                    color: palette[index % palette.length]
                }))
                .filter(slice => slice.value !== null && slice.value > 0);
            const total = slices.reduce((sum, slice) => sum + slice.value, 0);
            let offset = 0;

            if (!total) {
                return <div className="kpi-caption">No priced wallet assets available yet.</div>;
            }

            return (
                <div className="pie-shell">
                    <svg className="pie" viewBox="0 0 42 42" aria-label="Asset value distribution">
                        <circle cx="21" cy="21" r="15.915" fill="transparent" stroke="#edf3ed" strokeWidth="8"></circle>
                        {slices.map((slice, index) => {
                            const percent = (slice.value / total) * 100;
                            const dash = `${percent} ${100 - percent}`;
                            const currentOffset = offset;
                            offset -= percent;
                            return (
                                <circle
                                    key={`${slice.label}-${index}`}
                                    cx="21"
                                    cy="21"
                                    r="15.915"
                                    fill="transparent"
                                    stroke={slice.color}
                                    strokeWidth="8"
                                    strokeDasharray={dash}
                                    strokeDashoffset={currentOffset}
                                    transform="rotate(-90 21 21)"
                                ></circle>
                            );
                        })}
                        <text x="21" y="19" textAnchor="middle" fill="#1f2b24" fontSize="4.5" fontWeight="800">${money(total)}</text>
                        <text x="21" y="24" textAnchor="middle" fill="#68786d" fontSize="3">known value</text>

                    <div className="legend">
                        {slices.map((slice, index) => (
                            <div className="legend-row" key={`${slice.label}-${index}`}>

                            </div>

                    </div>

        function Control({ signal, setSignal, submitSignal, loading, addLog, setRaw }) {

            const update = (key, value) => setSignal(current => ({ ...current, [key]: value }));

            function switchToJson() {
                setRawJson(pretty(signal));
                setJsonError("");
                setEditMode("json");
            }

            function switchToForm() {
                try {
                    const parsed = JSON.parse(rawJson);
                    if (typeof parsed !== "object" || parsed === null || Array.isArray(parsed)) {
                        throw new Error("Payload must be a JSON object.");
                    }
                    setSignal({ ...freshSignal(), ...parsed });
                    setJsonError("");
                    setEditMode("form");
                } catch (e) {
                    setJsonError(e.message);
                }
            }

            function submitJson(event) {
                event.preventDefault();
                try {
                    const parsed = JSON.parse(rawJson);
                    if (typeof parsed !== "object" || parsed === null || Array.isArray(parsed)) {
                        throw new Error("Payload must be a JSON object.");
                    }
                    setSignal({ ...freshSignal(), ...parsed });
                    setJsonError("");
                    // Defer to the actual submit handler after state updates
                    setTimeout(() => {
                        const fakeEvent = { preventDefault: () => {} };
                        submitSignal(fakeEvent);
                    }, 0);
                } catch (e) {
                    setJsonError(e.message);
                    setRaw(`JSON Error: ${e.message}`);
                    addLog("error", "Invalid JSON payload", { error: e.message });
