        function NewsPanel({ request, addLog }) {
            const [feed, setFeed] = React.useState([]);
            const [glint, setGlint] = React.useState([]);
            const [manus, setManus] = React.useState([]);
            const [glintQuestion, setGlintQuestion] = React.useState("Positions");
            const [manusQuestion, setManusQuestion] = React.useState("");
            const [loading, setLoading] = React.useState(false);
            const [activeSource, setActiveSource] = React.useState("all");
            const [glintStatus, setGlintStatus] = React.useState({});
            const [manusStatus, setManusStatus] = React.useState({});

            const mergeMessages = (incoming, existing) => {
                const combined = [...(incoming || []), ...(existing || [])];
                const seen = new Set();
                return combined.filter(m => {
                    const key = `${m.chat_id || ""}-${m.id}`;
                    if (seen.has(key)) return false;
                    seen.add(key);
                    return true;
                });
            };

            async function loadFeed(source) {
                setLoading(true);
                try {
                    const data = await request(`/news/feed?source=${source}`);
                    if (data.status === "ok") {
                        setFeed(data.items || []);
                    } else {
                        addLog("error", "News feed failed", { detail: data.detail });
                    }
                } catch (err) {
                    addLog("error", "Failed to load news", { error: err.message });
                } finally {
                    setLoading(false);
                }
            }

            async function loadGlint() {
                try {
                    const data = await request("/news/glint");
                    if (data.status === "ok") {
                        setGlint(data.messages || []);
                        setGlintStatus(data.receiver_status || {});
                    }
                } catch (err) {
                    addLog("error", "Failed to load GLINT feed", { error: err.message });
                }
            }

            async function loadManus() {
                try {
                    const data = await request("/news/manus");
                    if (data.status === "ok") {
                        setManus(data.messages || []);
                        setManusStatus(data.receiver_status || {});
                    }
                } catch (err) {
                    addLog("error", "Failed to load Manus feed", { error: err.message });
                }
            }

            async function pollGlint() {
                setLoading(true);
                try {
                    const data = await request("/news/glint/poll", { method: "POST" });
                    if (data.status === "ok") {
                        setGlint(prev => mergeMessages(data.messages, prev));
                        addLog("info", `GLINT poll: ${data.new_count} new messages`);
                    }
                } catch (err) {
                    addLog("error", "GLINT poll failed", { error: err.message });
                } finally {
                    setLoading(false);
                }
            }

            async function pollManus() {
                setLoading(true);
                try {
                    const data = await request("/news/manus/poll", { method: "POST" });
                    if (data.status === "ok") {
                        setManus(prev => mergeMessages(data.messages, prev));
                        addLog("info", `Manus poll: ${data.new_count} new messages`);
                    }
                } catch (err) {
                    addLog("error", "Manus poll failed", { error: err.message });
                } finally {
                    setLoading(false);
                }
            }

            async function askGlint() {
                if (!glintQuestion.trim()) return;
                setLoading(true);
                try {
                    const data = await request(`/news/glint/ask?question=${encodeURIComponent(glintQuestion)}`, { method: "POST" });
                    if (data.status === "ok") {
                        setGlint(prev => mergeMessages(data.messages, prev));
                        addLog("info", data.timed_out ? "GLINT ask sent; no response yet" : `Asked GLINT: ${glintQuestion}`);
                        if (data.timed_out) setTimeout(pollGlint, 3000);
                    } else {
                        addLog("error", "GLINT ask failed", { detail: data.detail });
                    }
                } catch (err) {
                    addLog("error", "Failed to ask GLINT", { error: err.message });
                } finally {
                    setLoading(false);
                }
            }

            async function askManus() {
                if (!manusQuestion.trim()) return;
                setLoading(true);
                try {
                    const data = await request(`/news/manus/ask?question=${encodeURIComponent(manusQuestion)}`, { method: "POST" });
                    if (data.status === "ok") {
                        setManus(prev => mergeMessages(data.messages, prev));
                        addLog("info", data.timed_out ? "Manus ask sent; no response yet" : `Asked Manus: ${manusQuestion}`);
                        setManusQuestion("");
                        if (data.timed_out) setTimeout(pollManus, 3000);
                    } else {
                        addLog("error", "Manus ask failed", { detail: data.detail });
                    }
                } catch (err) {
                    addLog("error", "Failed to ask Manus", { error: err.message });
                } finally {
                    setLoading(false);
                }
            }

            React.useEffect(() => {
                loadFeed("all");
                loadGlint();
                loadManus();
                const timer = setInterval(() => {
                    loadFeed(activeSource);
                    loadGlint();
                    loadManus();
                }, 60000);
                return () => clearInterval(timer);
            }, [activeSource]);

            const filteredFeed = activeSource === "all"
                ? feed
                : feed.filter(it => it.source.toLowerCase().includes(activeSource.toLowerCase()));

            return (
                <div className="grid">
                    <div className="panel span-12">
                        <div className="panel-title" style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                            <span>Market News Aggregator</span>
                            <div style={{ display: "flex", gap: 8 }}>
                                {["all", "bbc", "coindesk"].map(src => (
                                    <button
                                        key={src}
                                        className={activeSource === src ? "small primary" : "small"}
                                        onClick={() => { setActiveSource(src); loadFeed(src); }}
                                    >
                                        {src === "all" ? "All RSS" : src === "bbc" ? "BBC Business" : "CoinDesk"}
                                    </button>
                                ))}
                                <button onClick={() => { loadFeed(activeSource); loadGlint(); loadManus(); }} disabled={loading}>{loading ? "Loading..." : "Refresh"}</button>
                            </div>
                        </div>
                        <div className="kpi-caption">RSS feeds refresh every 60s. GLINT and Manus are separate Telegram chats.</div>
                    </div>

                    <div className="panel span-6">
                        <div className="panel-title">RSS Headlines <span className="pill">{filteredFeed.length}</span></div>
                        {filteredFeed.length === 0 && (
                            <div className="kpi-caption">No news items loaded yet. Click Refresh or wait for auto-refresh.</div>
                        )}
                        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                            {filteredFeed.map((item, idx) => (
                                <div key={idx} style={{ padding: 10, background: "#1f2937", borderRadius: 6, borderLeft: `3px solid ${item.source.includes("BBC") ? "#0ea5e9" : "#8b5cf6"}` }}>
                                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12 }}>
                                        <a href={item.link} target="_blank" rel="noopener noreferrer" style={{ color: "#e5e7eb", textDecoration: "none", fontSize: 14, fontWeight: 600, lineHeight: 1.4 }}>
                                            {item.title}
                                        </a>
                                        <span className="pill" style={{ fontSize: 10, whiteSpace: "nowrap" }}>{item.source}</span>
                                    </div>
                                    {item.summary && (
                                        <div style={{ fontSize: 12, color: "#9ca3af", marginTop: 6, lineHeight: 1.4 }}>{item.summary}</div>
                                    )}
                                    <div style={{ fontSize: 11, color: "#6b7280", marginTop: 6 }}>{new Date(item.published).toLocaleString()}</div>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="panel span-3">
                        <div className="panel-title" style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                            <span>GLINT.trade <span className="pill">{glint.length}</span></span>
                            <button className="small" onClick={pollGlint} disabled={loading || !glintStatus.configured}>
                                {glintStatus.configured ? "Poll Now" : "Not Configured"}
                            </button>
                        </div>
                        {!glintStatus.configured && (
                            <div className="kpi-caption" style={{ color: "#f59e0b" }}>
                                Telegram not configured. Set GLINT_TELEGRAM_CHAT_ID in .env.
                            </div>
                        )}
                        {glintStatus.configured && (
                            <div style={{ display: "flex", gap: 4, marginBottom: 8 }}>
                                <input
                                    placeholder="Ask GLINT..."
                                    value={glintQuestion}
                                    onChange={e => setGlintQuestion(e.target.value)}
                                    onKeyDown={e => e.key === "Enter" && askGlint()}
                                    style={{ flex: 1, fontSize: 12, padding: "4px 8px", background: "#1f2937", border: "1px solid #374151", color: "#e5e7eb", borderRadius: 4 }}
                                />
                                <button className="small" onClick={askGlint} disabled={loading || !glintQuestion.trim()}>Ask</button>
                            </div>
                        )}
                        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                            {glint.map((msg, idx) => (
                                <div key={idx} style={{ padding: 10, background: "#1f2937", borderRadius: 6, borderLeft: "3px solid #f59e0b" }}>
                                    <div style={{ fontSize: 12, color: "#9ca3af", marginBottom: 4 }}>
                                        <strong>{msg.sender}</strong> · {new Date(msg.timestamp).toLocaleTimeString()}
                                    </div>
                                    <div style={{ fontSize: 13, color: "#e5e7eb", whiteSpace: "pre-wrap", lineHeight: 1.4 }}>{msg.text}</div>
                                </div>
                            ))}
                            {glint.length === 0 && glintStatus.configured && (
                                <div className="kpi-caption">No GLINT messages yet. Click Poll Now.</div>
                            )}
                        </div>
                    </div>

                    <div className="panel span-3">
                        <div className="panel-title" style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                            <span>Manus Advisor <span className="pill">{manus.length}</span></span>
                            <button className="small" onClick={pollManus} disabled={loading || !manusStatus.configured}>
                                {manusStatus.configured ? "Poll Now" : "Not Configured"}
                            </button>
                        </div>
                        {!manusStatus.configured && (
                            <div className="kpi-caption" style={{ color: "#f59e0b" }}>
                                Telegram not configured. Set MANUS_TELEGRAM_CHAT_ID in .env.
                            </div>
                        )}
                        {manusStatus.configured && (
                            <div style={{ display: "flex", gap: 4, marginBottom: 8 }}>
                                <input
                                    placeholder="Ask Manus..."
                                    value={manusQuestion}
                                    onChange={e => setManusQuestion(e.target.value)}
                                    onKeyDown={e => e.key === "Enter" && askManus()}
                                    style={{ flex: 1, fontSize: 12, padding: "4px 8px", background: "#1f2937", border: "1px solid #374151", color: "#e5e7eb", borderRadius: 4 }}
                                />
                                <button className="small" onClick={askManus} disabled={loading || !manusQuestion.trim()}>Ask</button>
                            </div>
                        )}
                        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                            {manus.map((msg, idx) => (
                                <div key={idx} style={{ padding: 10, background: "#1f2937", borderRadius: 6, borderLeft: "3px solid #22c55e" }}>
                                    <div style={{ fontSize: 12, color: "#9ca3af", marginBottom: 4 }}>
                                        <strong>{msg.sender}</strong> · {new Date(msg.timestamp).toLocaleTimeString()}
                                    </div>
                                    <div style={{ fontSize: 13, color: "#e5e7eb", whiteSpace: "pre-wrap", lineHeight: 1.4 }}>{msg.text}</div>
                                </div>
                            ))}
                            {manus.length === 0 && manusStatus.configured && (
                                <div className="kpi-caption">No Manus messages yet. Type a question above or click Poll Now.</div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function Orders({ orders, setTab }) {
            const [showSim, setShowSim] = React.useState(false);
            const filtered = showSim ? orders.filter(o => (o.execution_mode || "simulation") !== "live") : orders;
            const wins = filtered.filter(o => (o.pnl || 0) > 0).length;
            const totalWithPnl = filtered.filter(o => o.pnl !== undefined && o.pnl !== null).length;
            const winrate = totalWithPnl > 0 ? ((wins / totalWithPnl) * 100).toFixed(1) : "0.0";

            return (
                <div className="grid">
                    <div className="panel span-12">
                        <div className="panel-title" style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                            <span>Personal Order Book <span className="pill">{filtered.length} orders</span></span>
                            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                                <label className="live-sim-toggle" style={{ display: "flex", alignItems: "center", gap: 6, cursor: "pointer" }}>
                                    <input type="checkbox" checked={showSim} onChange={e => setShowSim(e.target.checked)} style={{ cursor: "pointer" }} />
                                    <span>Sim only</span>
                                </label>
                                <div className="winrate-percentage" style={{ fontWeight: 700, color: "var(--emerald)" }}>
                                    Simulated Hit Rate: {winrate}%
                                </div>
                            </div>
                        </div>
                        <OrderTable orders={filtered} setTab={setTab} />
                    </div>
                </div>
            );
        }

        function Logs({ logs, raw, status }) {
            return (
                <div className="grid">
                    <div className="panel span-12">
                        <div className="panel-title">Activity Logs</div>
                        <LogList logs={logs} />
                    </div>                    <div className="panel span-12">
                        <div className="panel-title">Runtime Status</div>
                        <pre>{pretty(status)}</pre>
                    </div>
                </div>
            );
        }

        function Tooltip({ hint, recommended }) {
            const [show, setShow] = React.useState(false);
            return (
                <span style={{ position: "relative", display: "inline-flex", alignItems: "center", marginLeft: 4 }}>
                    <span
                        style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", width: 16, height: 16, borderRadius: "50%", background: "var(--sky)", color: "var(--sky-strong)", fontSize: 11, fontWeight: 700, cursor: "help" }}
                        onMouseEnter={() => setShow(true)}
                        onMouseLeave={() => setShow(false)}
                    >?</span>
                    {show && (
                        <div style={{ position: "absolute", bottom: "calc(100% + 6px)", left: "50%", transform: "translateX(-50%)", width: 190, padding: 10, borderRadius: 12, background: "var(--surface)", border: "1px solid var(--line)", boxShadow: "0 8px 24px rgba(0,0,0,0.35)", zIndex: 100, fontSize: 12, lineHeight: 1.4, color: "var(--ink)" }}>
                            {recommended !== undefined && recommended !== "" && <div><strong>Recommended:</strong> {String(recommended)}</div>}
                            {hint && <div style={{ marginTop: 4, color: "var(--muted)" }}><strong>Hint:</strong> {hint}</div>}
                        </div>
                    )}
                </span>
            );
        }

        function Field({ label, value, onChange, type = "text", full = false, hint, recommended, name }) {
            return (
                <label className={full ? "full" : ""}>
                    <span style={{ display: "flex", alignItems: "center" }}>
                        {label}
                        {(hint || recommended !== undefined) && <Tooltip hint={hint} recommended={recommended} />}
                    </span>
                    <input type={type} name={name} value={value} onChange={e => onChange(e.target.value)} placeholder={recommended !== undefined && recommended !== "" ? String(recommended) : ""} />
                </label>
            );
        }

        function Select({ label, value, options, onChange, hint, recommended }) {
            return (
                <label>
                    <span style={{ display: "flex", alignItems: "center" }}>
                        {label}
                        {(hint || recommended !== undefined) && <Tooltip hint={hint} recommended={recommended} />}
                    </span>
                    <select value={value} onChange={e => onChange(e.target.value)}>
                        {options.map(option => <option key={option} value={option}>{option || "None"}</option>)}
                    </select>
                </label>
            );
        }

        function OrderTable({ orders, setTab, compact = false }) {
            if (!orders.length) return <div className="kpi-caption">No matching orders yet.</div>;
            return (
                <div className="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Symbol</th>
                                <th>Side</th>
                                <th>Intent</th>
                                <th>Decision</th>
                                {!compact && <th>Mode</th>}
                                {!compact && <th>Client Order ID</th>}
                                <th>Price</th>
                                {!compact && <th>Size</th>}
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            {orders.map(order => (
                                <tr key={`${order.id}-${order.at}`}>
                                    <td className="mono">{new Date(order.at).toLocaleString()}</td>
                                    <td>{order.symbol}</td>
                                    <td>{order.direction}</td>
                                    <td>{order.intent}</td>
                                    <td>
                                        <span className={statusPill(order.final_decision)} title={String(order.final_decision || "").includes("REJECT") ? "See Second Brain for rules" : undefined} style={String(order.final_decision || "").includes("REJECT") ? { backgroundColor: "#b84d4d", color: "#fff", border: "none" } : undefined}>{order.final_decision || "UNKNOWN"}</span>
                                        {String(order.final_decision || "").includes("REJECT") && setTab && (
                                            <button className="small" onClick={() => setTab("Wiki & 2ndBrain")} style={{ marginLeft: 8, padding: "2px 6px", fontSize: 10 }} title="Check Second Brain Context">🧠</button>
                                        )}
                                    </td>
                                    {!compact && <td><span className={`pill ${order.execution_mode === "live" ? "error" : "ok"}`}>{order.execution_mode || "simulation"}</span></td>}
                                    {!compact && <td className="mono">{order.client_order_id || "-"}</td>}
                                    <td>{order.entry_price}</td>
                                    {!compact && <td>{order.size_base || "-"}</td>}
                                    <td>
                                        {order.reject_reason || order.broker_status || order.source}
                                        {String(order.reject_reason || "").includes("correlation") && (
                                            <div style={{ fontSize: 10, color: "var(--warn)", marginTop: 4 }}>* Prevented by Correlation Risk Cap (Second Brain Memory)</div>
                                        )}
                                    </td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        }

        function WalletAssetTable({ wallets, compact = false }) {
            const rows = wallets.flatMap(([walletName, wallet]) => (wallet.assets || []).map(asset => ({ walletName, ...asset })));
            if (!rows.length) return <div className="kpi-caption">No wallet assets returned yet.</div>;
            return (
                <div className="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Wallet</th>
                                <th>Asset</th>
                                <th>Balance</th>
                                <th>Available</th>
                                <th>Locked</th>
                                <th>Value USDT</th>
                                {!compact && <th>Raw Fields</th>}
                            </tr>
                        </thead>
                        <tbody>
                            {rows.map((asset, index) => (
                                <tr key={`${asset.walletName}-${asset.coin}-${index}`}>
                                    <td>{asset.walletName}</td>
                                    <td>{asset.coin || "-"}</td>
                                    <td>{money(asset.balance)}</td>
                                    <td>{asset.available === null || asset.available === undefined ? "-" : money(asset.available)}</td>
                                    <td>{asset.locked === null || asset.locked === undefined ? "-" : money(asset.locked)}</td>
                                    <td>{asset.value_usdt === null || asset.value_usdt === undefined ? "-" : money(asset.value_usdt)}</td>
                                    {!compact && <td className="mono">{JSON.stringify(asset.raw || {})}</td>}
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        }

        function LogList({ logs }) {
            if (!logs.length) return <div className="kpi-caption">No logs yet.</div>;
            return (
                <div className="log">
                    {logs.map(log => (
                        <div className="log-line" key={log.id}>
                            <span className="mono">{new Date(log.at).toLocaleTimeString()}</span>
                            <span className={statusPill(log.level)}>{log.level}</span>
                            <span>{log.message}</span>
                        </div>
                    ))}
                </div>
            );
        }

        function DecisionBars({ orders }) {
            const counts = [
                ["Executed", orders.filter(o => String(o.final_decision).includes("EXECUTED")).length, "var(--mint-strong)"],
                ["Rejected", orders.filter(o => String(o.final_decision).includes("REJECT")).length, "var(--peach-strong)"],
                ["Backtest", orders.filter(o => o.source === "backtest").length, "var(--sky-strong)"],
                ["Manual", orders.filter(o => o.source === "manual").length, "var(--butter-strong)"]
            ];
            const max = Math.max(1, ...counts.map(item => item[1]));
            return (
                <div className="bars">
                    {counts.map(([label, value, color]) => (
                        <div className="bar-row" key={label}>
                            <span>{label}</span>
                            <div className="bar-track"><div className="bar-fill" style={{ width: `${(value / max) * 100}%`, background: color }}></div></div>
                            <span>{value}</span>
                        </div>
                    ))}
                </div>
            );
        }

        function LineChart({ orders }) {
            const points = orders.slice().reverse().slice(-24).map((order, index) => {
                const yValue = String(order.final_decision).includes("EXECUTED") ? index + 1 : Math.max(0, index - 0.4);
                return { x: index, y: yValue };
            });
            const maxY = Math.max(1, ...points.map(p => p.y));
            const coords = points.length
                ? points.map((p, index) => `${20 + (index / Math.max(1, points.length - 1)) * 560},${200 - (p.y / maxY) * 160}`).join(" ")
                : "20,200 580,200";
            return (
                <svg className="chart" viewBox="0 0 600 230" preserveAspectRatio="none">
                    <polyline points={coords} fill="none" stroke="#33a56b" strokeWidth="5" strokeLinecap="round" strokeLinejoin="round" />
                    <circle cx="20" cy="200" r="4" fill="#33a56b" />

        // -------------------------------------------------------------
        // Wiki & 2ndBrain Panel
        // -------------------------------------------------------------
        function SecondBrainPanel({ request, addLog }) {
            const [content, setContent] = useState("");
            const [search, setSearch] = useState("");
            const [loading, setLoading] = useState(false);
            const [docs, setDocs] = useState([]);
            const [selectedDoc, setSelectedDoc] = useState("");

            async function fetchWiki() {
                setLoading(true);
                try {
                    const data = await request("/db/second-brain");
                    setContent(data.content || "");
                    if (data.docs) {
                        setDocs(data.docs);
                    }
                } catch (e) {
                    addLog("error", "Failed to load Second Brain", { error: e.message });
                } finally {
                    setLoading(false);
                }
            }

            useEffect(() => {
                if (selectedDoc) {
                    async function fetchDoc() {
                        setLoading(true);
                        try {
                            const data = await request(`/db/second-brain/doc/${selectedDoc}`);
                            setContent(data.content || "");
                        } catch (e) {
                            addLog("error", `Failed to load document: ${selectedDoc}`, { error: e.message });
                        } finally {
                            setLoading(false);
                        }
                    }
                    fetchDoc();
                } else {
                    fetchWiki();
                }
            }, [selectedDoc]);

            function parseInlineMarkdown(text) {
                if (!text) return "";
                const parts = [];
                let currentIdx = 0;
                const tokenRegex = /(\*\*.*?\*\*|`.*?`)/g;
                let match;
                while ((match = tokenRegex.exec(text)) !== null) {
                    const matchIndex = match.index;
                    const matchText = match[0];
                    if (matchIndex > currentIdx) {
                        parts.push(text.substring(currentIdx, matchIndex));
                    }
                    if (matchText.startsWith("**") && matchText.endsWith("**")) {
                        parts.push(<strong key={matchIndex}>{matchText.slice(2, -2)}</strong>);
                    } else if (matchText.startsWith("`") && matchText.endsWith("`")) {
                        parts.push(<code key={matchIndex} style={{ background: "rgba(255,255,255,0.08)", padding: "2px 5px", borderRadius: 4, fontFamily: "var(--font-mono, monospace)" }}>{matchText.slice(1, -1)}</code>);
                    }
                    currentIdx = tokenRegex.lastIndex;
                }
                if (currentIdx < text.length) {
                    parts.push(text.substring(currentIdx));
                }
                return parts.length > 0 ? parts : text;
            }

            const renderedContent = useMemo(() => {
                if (!content) return <div style={{ color: "var(--muted)" }}>No entries found.</div>;
                
                const lines = content.split("\n");
                const blocks = [];
                let currentBlock = null;

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    const trimmed = line.trim();

                    // 1. Code blocks
                    if (trimmed.startsWith("```")) {
                        if (currentBlock && currentBlock.type === "code") {
                            blocks.push(currentBlock);
                            currentBlock = null;
                        } else {
                            if (currentBlock) blocks.push(currentBlock);
                            currentBlock = { type: "code", lines: [] };
                        }
                        continue;
                    }
                    if (currentBlock && currentBlock.type === "code") {
                        currentBlock.lines.push(line);
                        continue;
                    }

                    // 2. Tables
                    if (trimmed.startsWith("|") && trimmed.endsWith("|")) {
                        if (currentBlock && currentBlock.type === "table") {
                            currentBlock.lines.push(trimmed);
                        } else {
                            if (currentBlock) blocks.push(currentBlock);
                            currentBlock = { type: "table", lines: [trimmed] };
                        }
                        continue;
                    }

                    // 3. Lists
                    if (trimmed.startsWith("- ") || trimmed.startsWith("* ") || /^\d+\.\s/.test(trimmed)) {
                        if (currentBlock && currentBlock.type === "list") {
                            currentBlock.lines.push(trimmed);
                        } else {
                            if (currentBlock) blocks.push(currentBlock);
                            currentBlock = { type: "list", lines: [trimmed] };
                        }
                        continue;
                    }

                    // 4. Empty lines
                    if (trimmed === "") {
                        if (currentBlock) {
                            blocks.push(currentBlock);
                            currentBlock = null;
                        }
                        continue;
                    }

                    // 5. Headers
                    if (trimmed.startsWith("# ") || trimmed.startsWith("## ") || trimmed.startsWith("### ") || trimmed.startsWith("#### ")) {
                        if (currentBlock) blocks.push(currentBlock);
                        blocks.push({ type: "header", text: trimmed });
                        currentBlock = null;
                        continue;
                    }

                    // 6. Paragraphs
                    if (currentBlock && currentBlock.type === "paragraph") {
                        currentBlock.lines.push(line);
                    } else {
                        if (currentBlock) blocks.push(currentBlock);
                        currentBlock = { type: "paragraph", lines: [line] };
                    }
                }
                if (currentBlock) blocks.push(currentBlock);

                // Filter by search query if applicable
                let filteredBlocks = blocks;
                if (search.trim()) {
                    const query = search.toLowerCase();
                    filteredBlocks = blocks.filter(b => {
                        if (b.type === "header") return b.text.toLowerCase().includes(query);
                        return b.lines.some(l => l.toLowerCase().includes(query));
                    });
                }

                return filteredBlocks.map((block, idx) => {
                    if (block.type === "header") {
                        if (block.text.startsWith("# ")) return <h1 key={idx} style={{ borderBottom: "1px solid var(--line)", paddingBottom: 6, margin: "20px 0 10px", fontSize: "1.6em" }}>{block.text.slice(2)}</h1>;
                        if (block.text.startsWith("## ")) return <h2 key={idx} style={{ borderBottom: "1px solid var(--line)", paddingBottom: 4, margin: "16px 0 8px", fontSize: "1.35em", color: "var(--text)" }}>{block.text.slice(3)}</h2>;
                        if (block.text.startsWith("### ")) return <h3 key={idx} style={{ margin: "12px 0 6px", fontSize: "1.15em", color: "var(--text)" }}>{block.text.slice(4)}</h3>;
                        return <h4 key={idx} style={{ margin: "10px 0 4px", fontSize: "1em", color: "var(--text)" }}>{block.text.slice(5)}</h4>;
                    }
                    if (block.type === "list") {
                        return (
                            <ul key={idx} style={{ margin: "8px 0", paddingLeft: 20 }}>
                                {block.lines.map((item, lidx) => {
                                    const contentStr = item.replace(/^[-*\d.]+\s+/, "");
                                    return <li key={lidx} style={{ margin: "4px 0", lineHeight: "1.4" }}>{parseInlineMarkdown(contentStr)}</li>;
                                })}
                            </ul>
                        );
                    }
                    if (block.type === "code") {
                        return (
                            <pre key={idx} style={{ background: "rgba(0,0,0,0.3)", padding: 12, borderRadius: "var(--radius-sm)", border: "1px solid var(--line)", overflowX: "auto", fontFamily: "var(--font-mono, monospace)", fontSize: 12, margin: "10px 0" }}>
                                <code>{block.lines.join("\n")}</code>
                            </pre>
                        );
                    }
                    if (block.type === "table") {
                        const rows = block.lines.map(line => {
                            return line.split("|").slice(1, -1).map(p => p.trim());
                        });
                        const isSeparator = row => row.every(cell => /^[-:\s]+$/.test(cell));
                        const validRows = rows.filter(r => !isSeparator(r));
                        if (validRows.length === 0) return null;

                        const hasHeader = rows.length > 1 && isSeparator(rows[1]);
                        const headerRow = hasHeader ? validRows[0] : null;
                        const bodyRows = hasHeader ? validRows.slice(1) : validRows;

                        return (
                            <div key={idx} style={{ overflowX: "auto", margin: "12px 0" }}>
                                <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
                                    {headerRow && (
                                        <thead>
                                            <tr style={{ borderBottom: "2px solid var(--line)", background: "rgba(255,255,255,0.02)" }}>
                                                {headerRow.map((cell, cidx) => (
                                                    <th key={cidx} style={{ padding: "8px 12px", textAlign: "left", fontWeight: "600" }}>{parseInlineMarkdown(cell)}</th>
                                                ))}
                                            </tr>
                                        </thead>
                                    )}
                                    <tbody>
                                        {bodyRows.map((row, ridx) => (
                                            <tr key={ridx} style={{ borderBottom: "1px solid var(--line)", background: ridx % 2 === 0 ? "transparent" : "rgba(255,255,255,0.01)" }}>
                                                {row.map((cell, cidx) => (
                                                    <td key={cidx} style={{ padding: "8px 12px" }}>{parseInlineMarkdown(cell)}</td>
                                                ))}
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        );
                    }
                    return (
                        <p key={idx} style={{ margin: "8px 0", lineHeight: "1.5" }}>
                            {parseInlineMarkdown(block.lines.join(" "))}
                        </p>
                    );
                });
            }, [content, search]);

            return (
                <div className="panel" style={{ display: "flex", flexDirection: "column", gap: 16, height: "100%" }}>
                    <div className="panel-title" style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                        <span>Wiki & 2ndBrain</span>
                        <button onClick={() => selectedDoc ? setSelectedDoc("") : fetchWiki()} disabled={loading} className="small">
                            {loading ? "Refreshing..." : "Refresh"}
                        </button>
                    </div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                        <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                            <span style={{ fontSize: 12, color: "var(--muted)" }}>Document:</span>
                            <select
                                value={selectedDoc}
                                onChange={e => setSelectedDoc(e.target.value)}
                                style={{ flex: 1, padding: "6px 10px", background: "var(--surface)", border: "1px solid var(--line)", borderRadius: "var(--radius-xs)", color: "var(--ink)", outline: "none" }}
                            >
                                <option value="">-- Compiled Second Brain --</option>
                                {docs.map(doc => (
                                    <option key={doc.name} value={doc.name}>
                                        {doc.name} ({Math.round(doc.size_bytes / 10.24) / 100} KB)
                                    </option>
                                ))}
                            </select>
                        </div>
                        <input
                            type="text"
                            placeholder={selectedDoc ? `Search inside ${selectedDoc}...` : "Search second brain..."}
                            value={search}
                            onChange={e => setSearch(e.target.value)}
                            style={{ flex: 1 }}
                        />
                    </div>
                    <div className="wiki-content" style={{ flex: 1, overflowY: "auto", background: "var(--bg)", border: "1px solid var(--line)", borderRadius: "var(--radius-sm)", padding: 16, fontFamily: "var(--font-mono, monospace)", fontSize: 13 }}>
                        {renderedContent}
                    </div>
                </div>
            );
        }

                            <div style={{ border: "1px solid var(--line)", borderRadius: "var(--radius-sm)", padding: 12, background: "rgba(0,0,0,0.1)" }}>
                                <h4 style={{ margin: "0 0 8px 0" }}>Webhook Consumer</h4>
                                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                                    <span style={{ fontSize: 12, color: "var(--muted)" }}>Status</span>
                                    <span style={{ color: workers?.webhook_consumer?.is_running ? "var(--ok)" : "var(--danger)", fontWeight: "bold" }}>
                                        {workers?.webhook_consumer?.is_running ? "RUNNING" : "STOPPED"}
                                    </span>
                                </div>
                                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 4 }}>
                                    <span style={{ fontSize: 12, color: "var(--muted)" }}>Queue Size</span>
                                    <span style={{ fontFamily: "monospace" }}>{workers?.webhook_consumer?.queue_size || 0}</span>
                                </div>
                            </div>

                            <div style={{ border: "1px solid var(--line)", borderRadius: "var(--radius-sm)", padding: 12, background: "rgba(0,0,0,0.1)" }}>
                                <h4 style={{ margin: "0 0 8px 0" }}>Position Monitor</h4>
                                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                                    <span style={{ fontSize: 12, color: "var(--muted)" }}>Status</span>
                                    <span style={{ color: workers?.position_monitor?.is_running ? "var(--ok)" : "var(--danger)", fontWeight: "bold" }}>
                                        {workers?.position_monitor?.is_running ? "RUNNING" : "STOPPED"}
                                    </span>
                                </div>
                            </div>

                            <div style={{ border: "1px solid var(--line)", borderRadius: "var(--radius-sm)", padding: 12, background: "rgba(0,0,0,0.1)" }}>
                                <h4 style={{ margin: "0 0 8px 0" }}>Training Loop</h4>
                                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                                    <span style={{ fontSize: 12, color: "var(--muted)" }}>Status</span>
                                    <span style={{ color: workers?.training_loop?.is_running ? "var(--ok)" : "var(--muted)", fontWeight: "bold" }}>
                                        {workers?.training_loop?.is_running ? "ACTIVE" : "STANDBY"}
                                    </span>
                                </div>
                                {workers?.training_loop?.interval_seconds && (
                                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 4 }}>
                                        <span style={{ fontSize: 12, color: "var(--muted)" }}>Interval</span>
                                        <span>{workers.training_loop.interval_seconds}s</span>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    <div className="panel span-12">
                        <div className="panel-title">Shadow Queue (Rejected Signal Feedback)</div>
                        <div style={{ padding: 16 }}>
                            <div style={{ display: "flex", gap: 16, marginBottom: 12, fontSize: 12, color: "var(--muted)" }}>
                                <div>Total Rejected Candidates: <b>{queueData.count}</b></div>
                                <div>Pending Evaluation: <b>{queueData.pending_count}</b></div>
                                <div>Evaluated Outcomes: <b>{queueData.evaluated_count}</b></div>
                            </div>
                            <div style={{ overflowX: "auto" }}>
                                <table className="table" style={{ width: "100%", fontSize: 12 }}>
                                    <thead>
                                        <tr>
                                            <th>Signal ID</th>
                                            <th>Added At</th>
                                            <th>Symbol</th>
                                            <th>Direction</th>
                                            <th>Price</th>
                                            <th>Scout Votes</th>
                                            <th>Status</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {queueData.entries.length === 0 ? (
                                            <tr>
                                                <td colSpan="7" style={{ textAlign: "center", color: "var(--muted)" }}>No rejected signals in shadow queue.</td>
                                            </tr>
                                        ) : (
                                            queueData.entries.map((e, i) => (
                                                <tr key={i}>
                                                    <td style={{ fontFamily: "monospace" }}>{e.signal_id}</td>
                                                    <td>{new Date(e.added_at * 1000).toLocaleTimeString()}</td>
                                                    <td>{e.symbol}</td>
                                                    <td style={{ color: e.direction === "LONG" || e.direction === "BUY" ? "var(--ok)" : "var(--danger)" }}>{e.direction}</td>
                                                    <td>{e.entry_price}</td>
                                                    <td style={{ fontFamily: "monospace", fontSize: 11 }}>
                                                        {e.scout_decisions ? Object.entries(e.scout_decisions).map(([scout, dec]) => `${scout}:${dec}`).join(", ") : "—"}
                                                    </td>
                                                    <td>
                                                        <span className={`badge ${e.evaluated ? "ok" : "warning"}`} style={{ padding: "2px 6px", borderRadius: 4, fontSize: 10 }}>
                                                            {e.evaluated ? "EVALUATED" : "PENDING"}
                                                        </span>
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
