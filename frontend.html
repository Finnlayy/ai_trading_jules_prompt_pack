        function Control({ signal, setSignal, submitSignal, loading, addLog, setRaw, request, broker }) {
            const [editMode, setEditMode] = React.useState("form");
            const [rawJson, setRawJson] = React.useState("");
            const [jsonError, setJsonError] = React.useState("");
            const [recommendations, setRecommendations] = React.useState({});
            const [hints, setHints] = React.useState({});
            const [liveConfirmed, setLiveConfirmed] = React.useState(false);
            const update = (key, value) => setSignal(current => ({ ...current, [key]: value }));
            const quick = (patch) => setSignal(current => ({ ...current, ...patch, signal_id: `manual-${Date.now()}`, timestamp: new Date().toISOString() }));

            const isLive = broker && broker.live_capable;
            const needsConfirmation = broker && broker.requires_ui_confirmation;
            const canSubmit = !isLive || !needsConfirmation || liveConfirmed;

            React.useEffect(() => {
                if (!signal.symbol || !signal.timeframe) return;
                request(`/market/recommend?symbol=${signal.symbol}&timeframe=${signal.timeframe}`)
                    .then(data => {
                        setRecommendations(data.recommendations || {});
                        setHints(data.hints || {});
                    })
                    .catch(() => {
                        setRecommendations({});
                        setHints({});
                    });
            }, [signal.symbol, signal.timeframe]);

            function applyRecommendations() {
                const recs = recommendations;
                const patch = {};
                Object.keys(recs).forEach(key => {
                    if (recs[key] !== "" && recs[key] !== null && recs[key] !== undefined) {
                        patch[key] = recs[key];
                    }
                });
                if (Object.keys(patch).length) {
                    setSignal(current => ({ ...current, ...patch }));
                    addLog("system", "Applied parameter recommendations", patch);
                }
            }

            function switchToJson() {
                setRawJson(pretty(signal));
                setJsonError("");
                setEditMode("json");
            }

            function switchToForm() {
                try {
                    const parsed = JSON.parse(rawJson);
                    if (typeof parsed !== "object" || parsed === null || Array.isArray(parsed)) {
                        throw new Error("Payload must be a JSON object.");
                    }
                    setSignal({ ...freshSignal(), ...parsed });
                    setJsonError("");
                    setEditMode("form");
                } catch (e) {
                    setJsonError(e.message);
                }
            }

            function submitJson(event) {
                event.preventDefault();
                try {
                    const parsed = JSON.parse(rawJson);
                    if (typeof parsed !== "object" || parsed === null || Array.isArray(parsed)) {
                        throw new Error("Payload must be a JSON object.");
                    }
                    setSignal({ ...freshSignal(), ...parsed });
                    setJsonError("");
                    setTimeout(() => {
                        const fakeEvent = { preventDefault: () => {} };
                        submitSignal(fakeEvent);
                    }, 0);
                } catch (e) {
                    setJsonError(e.message);
                                        addLog("error", "Invalid JSON payload", { error: e.message });
                }
            }

            return (
                <div className="grid">
                    {editMode === "form" ? (
                        <form className="panel span-8" onSubmit={submitSignal}>
                            <div className="panel-title">
                                <span>Order Control <span className="pill ok">{signal.order_command}</span></span>
                                <span style={{ display: "flex", gap: 8 }}>
                                    <button type="button" className="primary" onClick={applyRecommendations}>Apply Recommendations</button>
                                    <button type="button" onClick={switchToJson}>Edit JSON</button>
                                </span>
                            </div>
                            <div className="form-grid">
                                <Field label="Signal ID" value={signal.signal_id} onChange={v => update("signal_id", v)} hint={hints.signal_id} recommended={recommendations.signal_id} />
                                <Field label="Symbol" value={signal.symbol} onChange={v => update("symbol", v)} hint={hints.symbol} recommended={recommendations.symbol} />
                                <Field label="Timeframe" value={signal.timeframe} onChange={v => update("timeframe", v)} hint={hints.timeframe} recommended={recommendations.timeframe} />
                                <Select label="Direction" value={signal.direction} options={["LONG", "SHORT"]} onChange={v => update("direction", v)} hint={hints.direction} recommended={recommendations.direction} />
                                <Select label="Intent" value={signal.intent} options={["ENTRY", "CLOSE"]} onChange={v => update("intent", v)} hint={hints.intent} recommended={recommendations.intent} />
                                <Select label="Account" value={signal.account_mode} options={["SPOT", "FUTURES"]} onChange={v => update("account_mode", v)} hint={hints.account_mode} recommended={recommendations.account_mode} />
                                <Field label="Entry" type="number" value={signal.entry_price} onChange={v => update("entry_price", v)} hint={hints.entry_price} recommended={recommendations.entry_price} />
                                <Field label="Stop" type="number" value={signal.stop_price} onChange={v => update("stop_price", v)} hint={hints.stop_price} recommended={recommendations.stop_price} />
                                <Field label="Target" type="number" value={signal.target_price} onChange={v => update("target_price", v)} hint={hints.target_price} recommended={recommendations.target_price} />
                                <Field label="Execution Qty" type="number" value={signal.execution_quantity} onChange={v => update("execution_quantity", v)} hint={hints.execution_quantity} recommended={recommendations.execution_quantity} />
                                <Field label="Confluence" type="number" value={signal.confluence_score} onChange={v => update("confluence_score", v)} hint={hints.confluence_score} recommended={recommendations.confluence_score} />
                                <Field label="Crisis" type="number" value={signal.crisis_score} onChange={v => update("crisis_score", v)} hint={hints.crisis_score} recommended={recommendations.crisis_score} />
                                <Field label="MC Dispersion" type="number" value={signal.mc_dispersion} onChange={v => update("mc_dispersion", v)} hint={hints.mc_dispersion} recommended={recommendations.mc_dispersion} />
                                <Field label="Spread" type="number" value={signal.spread} onChange={v => update("spread", v)} hint={hints.spread} recommended={recommendations.spread} />
                                <Select label="Command" value={signal.order_command} options={["GO", "HOLD", "KILL"]} onChange={v => update("order_command", v)} hint={hints.order_command} recommended={recommendations.order_command} />
                                <Select label="Regime" value={signal.market_regime} options={["", "GREEN", "YELLOW", "ORANGE", "RED"]} onChange={v => update("market_regime", v)} hint={hints.market_regime} recommended={recommendations.market_regime} />
                                <Field label="Relative Volume" type="number" value={signal.relative_volume} onChange={v => update("relative_volume", v)} hint={hints.relative_volume} recommended={recommendations.relative_volume} />
                                <Field label="Chop Index" type="number" value={signal.chop_index} onChange={v => update("chop_index", v)} hint={hints.chop_index} recommended={recommendations.chop_index} />
                                <Field label="Hurst" type="number" value={signal.hurst_exponent} onChange={v => update("hurst_exponent", v)} hint={hints.hurst_exponent} recommended={recommendations.hurst_exponent} />
                                <Field label="Drawdown %" type="number" value={signal.drawdown_pct} onChange={v => update("drawdown_pct", v)} hint={hints.drawdown_pct} recommended={recommendations.drawdown_pct} />
                                <Field label="Pending Age Sec" type="number" value={signal.pending_order_age_seconds} onChange={v => update("pending_order_age_seconds", v)} hint={hints.pending_order_age_seconds} recommended={recommendations.pending_order_age_seconds} />
                                <Field label="Leverage" type="number" value={signal.leverage} onChange={v => update("leverage", v)} hint={hints.leverage} recommended={recommendations.leverage} />
                                <label><span style={{ display: "flex", alignItems: "center" }}>Bar Confirmed{(hints.bar_confirmed || recommendations.bar_confirmed !== undefined) && <Tooltip hint={hints.bar_confirmed} recommended={String(recommendations.bar_confirmed)} />}</span><select value={String(signal.bar_confirmed)} onChange={e => update("bar_confirmed", e.target.value === "true")}><option value="true">true</option><option value="false">false</option></select></label>
                                <label><span style={{ display: "flex", alignItems: "center" }}>Macro Event Risk{(hints.macro_event_risk || recommendations.macro_event_risk !== undefined) && <Tooltip hint={hints.macro_event_risk} recommended={String(recommendations.macro_event_risk)} />}</span><select value={String(signal.macro_event_risk)} onChange={e => update("macro_event_risk", e.target.value === "true")}><option value="false">false</option><option value="true">true</option></select></label>
                            </div>
                            <div className="row-actions">
                                <button type="button" onClick={() => quick(freshSignal())}>Sample Entry</button>
                                <button type="button" className="warning" onClick={() => quick({ order_command: "HOLD" })}>Hold</button>
                                <button type="button" className="danger" onClick={() => quick({ order_command: "KILL" })}>Kill</button>
                                <button type="button" onClick={() => quick({ intent: "CLOSE", execution_quantity: "" })}>Close</button>
                                <button type="submit" className="primary" disabled={loading}>Submit</button>
                            </div>
                        </form>
                    ) : (
                        <form className="panel span-8" onSubmit={submitJson}>
                            <div className="panel-title">
                                <span>Order Control — Raw JSON</span>
                                <button type="button" onClick={switchToForm}>Back to Form</button>
                            </div>
                            <label style={{ marginBottom: 10 }}>
                                <span>Edit payload JSON directly</span>
                                <textarea
                                    value={rawJson}
                                    onChange={e => { setRawJson(e.target.value); setJsonError(""); }}
                                    style={{ minHeight: 420, fontFamily: "JetBrains Mono, monospace", fontSize: 13 }}
                                />
                            </label>
                            {jsonError && <div style={{ color: "#d86545", fontSize: 13, marginBottom: 10 }}>⚠ {jsonError}</div>}
                            <div className="row-actions">
                                <button type="button" onClick={() => setRawJson(pretty(signal))}>Reset to Current</button>
                                <button type="button" onClick={() => quick(freshSignal())}>Sample Entry</button>
                                <button type="button" className="warning" onClick={() => { const patched = { ...signal, order_command: "HOLD" }; setSignal(patched); setRawJson(pretty(patched)); }}>Hold</button>
                                <button type="button" className="danger" onClick={() => { const patched = { ...signal, order_command: "KILL" }; setSignal(patched); setRawJson(pretty(patched)); }}>Kill</button>
                                <button type="submit" className="primary" disabled={loading}>Submit JSON</button>
                            </div>
                        </form>
                    )}

                    <div className="panel span-4">
                        <div className="panel-title">Current Payload</div>
                        <pre>{pretty(signal)}</pre>
                    </div>
                </div>
            );
        }

        function Backtest({ backtest, setBacktest, runBacktest, loading, orders }) {
            const update = (key, value) => setBacktest(current => ({ ...current, [key]: value }));
            return (
                <div className="grid">
                    <form className="panel span-4" onSubmit={runBacktest}>
                        <div className="panel-title">Backtest Parameters</div>
                        <div className="form-grid">
                            <Field label="Symbol" value={backtest.symbol} onChange={v => update("symbol", v)} full />
                            <Field label="Timeframe" value={backtest.timeframe} onChange={v => update("timeframe", v)} />
                            <Field label="Bars" type="number" value={backtest.bars} onChange={v => update("bars", v)} />
                            <Field label="Max Signals" type="number" value={backtest.max_signals} onChange={v => update("max_signals", v)} />

                        </div>

                            <button type="submit" className="primary" disabled={loading}>Run Backtest</button>
                        </div>
                    </form>
                    <div className="panel span-8">
                        <div className="panel-title">Backtest Orders</div>
                        <OrderTable orders={orders.filter(o => o.source === "backtest").slice(0, 12)} compact />

                </div>
