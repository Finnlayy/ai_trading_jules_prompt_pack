<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Bot Command Center</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap');

        :root {
            --bg: #0b0c0b;
            --panel: #151714;
            --panel-strong: #1d211c;
            --line: #32382f;
            --text: #f1f4ec;
            --muted: #9ca696;
            --soft: #cbd3c3;
            --green: #77c76a;
            --red: #ef6f64;
            --amber: #d8a84f;
            --cyan: #71b8c7;
            --input: #0f110f;
            --shadow: rgba(0, 0, 0, 0.34);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            font-family: "IBM Plex Sans", sans-serif;
            background:
                linear-gradient(120deg, rgba(119, 199, 106, 0.08), transparent 34%),
                linear-gradient(240deg, rgba(216, 168, 79, 0.09), transparent 38%),
                var(--bg);
        }

        button, input, select, textarea {
            font: inherit;
        }

        button {
            border: 1px solid var(--line);
            background: var(--panel-strong);
            color: var(--text);
            cursor: pointer;
            min-height: 38px;
        }

        button:hover {
            border-color: var(--soft);
        }

        button.primary {
            background: var(--green);
            border-color: var(--green);
            color: #081008;
            font-weight: 700;
        }

        button.danger {
            background: rgba(239, 111, 100, 0.15);
            border-color: rgba(239, 111, 100, 0.55);
            color: #ffd4d0;
        }

        input, select, textarea {
            width: 100%;
            min-height: 38px;
            border: 1px solid var(--line);
            background: var(--input);
            color: var(--text);
            padding: 9px 10px;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 2px rgba(119, 199, 106, 0.16);
        }

        textarea {
            resize: vertical;
            min-height: 210px;
            font-family: "JetBrains Mono", monospace;
            font-size: 12px;
            line-height: 1.5;
        }

        .shell {
            display: grid;
            grid-template-columns: 260px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            border-right: 1px solid var(--line);
            background: rgba(13, 15, 13, 0.86);
            padding: 22px;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .brand {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 22px;
        }

        .brand small {
            display: block;
            margin-top: 8px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 500;
        }

        .nav {
            display: grid;
            gap: 8px;
            margin-bottom: 24px;
        }

        .nav button {
            text-align: left;
            padding: 10px 12px;
        }

        .nav button.active {
            border-color: var(--green);
            background: rgba(119, 199, 106, 0.14);
        }

        .side-block {
            border-top: 1px solid var(--line);
            padding-top: 16px;
            margin-top: 18px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.55;
        }

        .status-dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            margin-right: 8px;
            background: var(--amber);
        }

        .status-dot.ok {
            background: var(--green);
        }

        .status-dot.bad {
            background: var(--red);
        }

        main {
            padding: 24px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 18px;
            margin-bottom: 18px;
        }

        h1 {
            margin: 0;
            font-size: clamp(26px, 4vw, 42px);
            line-height: 1;
            letter-spacing: 0;
        }

        .subtitle {
            color: var(--muted);
            margin-top: 8px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: flex-end;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 14px;
        }

        .panel {
            border: 1px solid var(--line);
            background: rgba(21, 23, 20, 0.88);
            box-shadow: 0 18px 50px var(--shadow);
            padding: 16px;
        }

        .span-3 { grid-column: span 3; }
        .span-4 { grid-column: span 4; }
        .span-5 { grid-column: span 5; }
        .span-6 { grid-column: span 6; }
        .span-7 { grid-column: span 7; }
        .span-8 { grid-column: span 8; }
        .span-12 { grid-column: span 12; }

        .panel-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            color: var(--soft);
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .kpi {
            font-size: 30px;
            font-weight: 700;
            line-height: 1;
        }

        .kpi-label {
            margin-top: 8px;
            color: var(--muted);
            font-size: 12px;
        }

        .mono {
            font-family: "JetBrains Mono", monospace;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            min-height: 24px;
            padding: 3px 8px;
            border: 1px solid var(--line);
            color: var(--soft);
            font-family: "JetBrains Mono", monospace;
            font-size: 11px;
            background: var(--input);
        }

        .pill.ok {
            color: #c9ffc1;
            border-color: rgba(119, 199, 106, 0.5);
        }

        .pill.warn {
            color: #ffe0a5;
            border-color: rgba(216, 168, 79, 0.5);
        }

        .pill.bad {
            color: #ffd4d0;
            border-color: rgba(239, 111, 100, 0.5);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        label {
            display: grid;
            gap: 6px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
        }

        .full {
            grid-column: 1 / -1;
        }

        .result {
            min-height: 250px;
            overflow: auto;
            border: 1px solid var(--line);
            background: #090a09;
            padding: 12px;
            color: #c8e0c2;
            font-family: "JetBrains Mono", monospace;
            font-size: 12px;
            line-height: 1.55;
            white-space: pre-wrap;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th, td {
            border-bottom: 1px solid var(--line);
            padding: 9px 8px;
            text-align: left;
            vertical-align: top;
        }

        th {
            color: var(--muted);
            font-size: 11px;
            text-transform: uppercase;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 1000px) {
            .shell {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: static;
                height: auto;
                border-right: 0;
                border-bottom: 1px solid var(--line);
            }

            .nav {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .span-3, .span-4, .span-5, .span-6, .span-7, .span-8 {
                grid-column: span 12;
            }
        }

        @media (max-width: 640px) {
            main {
                padding: 14px;
            }

            .topbar {
                display: grid;
            }

            .actions {
                justify-content: stretch;
            }

            .actions button {
                flex: 1;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .nav {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useEffect, useMemo, useState } = React;

        const defaultSignal = {
            signal_id: `manual-${Date.now()}`,
            symbol: "BTCUSD",
            timeframe: "1h",
            direction: "LONG",
            intent: "ENTRY",
            account_mode: "SPOT",
            timestamp: new Date().toISOString(),
            entry_price: 50000,
            stop_price: 48000,
            target_price: 54000,
            confluence_score: 85,
            crisis_score: 10,
            mc_dispersion: 2,
            spread: 5,
            order_command: "GO",
            bar_confirmed: true
        };

        function pretty(value) {
            return JSON.stringify(value, null, 2);
        }

        function App() {
            const [tab, setTab] = useState("Command");
            const [health, setHealth] = useState({ status: "checking" });
            const [status, setStatus] = useState(null);
            const [signal, setSignal] = useState(defaultSignal);
            const [signalResult, setSignalResult] = useState("No signal submitted yet.");
            const [backtest, setBacktest] = useState({ symbol: "HYPEUSDT", timeframe: "1m", bars: 500, max_signals: 10, min_confluence: "" });
            const [backtestResult, setBacktestResult] = useState("No backtest run yet.");
            const [loading, setLoading] = useState(false);

            async function request(path, options = {}) {
                const response = await fetch(path, {
                    headers: { "Content-Type": "application/json", ...(options.headers || {}) },
                    ...options
                });
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.detail || `HTTP ${response.status}`);
                }
                return data;
            }

            async function refresh() {
                try {
                    const [healthData, statusData] = await Promise.all([
                        request("/health"),
                        request("/backtest/status")
                    ]);
                    setHealth(healthData);
                    setStatus(statusData);
                } catch (error) {
                    setHealth({ status: "error", error: error.message });
                }
            }

            useEffect(() => {
                refresh();
                const timer = setInterval(refresh, 10000);
                return () => clearInterval(timer);
            }, []);

            const broker = status?.broker || {};
            const risk = status?.risk_engine_state || {};
            const brokerState = broker.connected || broker.type === "SimulationBroker" ? "Ready" : "Not ready";
            const statusClass = health.status === "ok" ? "ok" : "bad";

            function updateSignal(key, value) {
                setSignal(current => ({ ...current, [key]: value }));
            }

            async function submitSignal(event) {
                event.preventDefault();
                setLoading(true);
                setSignalResult("Submitting signal...");
                try {
                    const payload = {
                        ...signal,
                        entry_price: Number(signal.entry_price),
                        stop_price: Number(signal.stop_price),
                        target_price: Number(signal.target_price),
                        confluence_score: Number(signal.confluence_score),
                        crisis_score: Number(signal.crisis_score),
                        mc_dispersion: Number(signal.mc_dispersion),
                        spread: Number(signal.spread),
                        bar_confirmed: Boolean(signal.bar_confirmed)
                    };
                    const data = await request("/webhook/m8", {
                        method: "POST",
                        body: JSON.stringify(payload)
                    });
                    setSignalResult(pretty(data));
                    await refresh();
                } catch (error) {
                    setSignalResult(`ERROR: ${error.message}`);
                } finally {
                    setLoading(false);
                }
            }

            async function runBacktest(event) {
                event.preventDefault();
                setLoading(true);
                setBacktestResult("Running backtest...");
                try {
                    const params = new URLSearchParams({
                        symbol: backtest.symbol,
                        timeframe: backtest.timeframe,
                        bars: String(backtest.bars),
                        max_signals: String(backtest.max_signals)
                    });
                    if (backtest.min_confluence !== "") {
                        params.set("min_confluence", String(backtest.min_confluence));
                    }
                    const data = await request(`/backtest/run?${params.toString()}`, { method: "POST" });
                    setBacktestResult(pretty(data));
                    await refresh();
                } catch (error) {
                    setBacktestResult(`ERROR: ${error.message}`);
                } finally {
                    setLoading(false);
                }
            }

            async function resetBot() {
                setLoading(true);
                try {
                    const data = await request("/backtest/reset", { method: "POST" });
                    setSignalResult(pretty(data));
                    setBacktestResult(pretty(data));
                    await refresh();
                } catch (error) {
                    setSignalResult(`ERROR: ${error.message}`);
                } finally {
                    setLoading(false);
                }
            }

            const rows = useMemo(() => {
                if (typeof backtestResult !== "string" || !backtestResult.startsWith("{")) return [];
                try {
                    return JSON.parse(backtestResult).results || [];
                } catch {
                    return [];
                }
            }, [backtestResult]);

            return (
                <div className="shell">
                    <aside className="sidebar">
                        <div className="brand">
                            Pionex Bot Console
                            <small>AI review, risk gates, broker execution, journal output</small>
                        </div>

                        <div className="nav">
                            {["Command", "Manual Signal", "Backtest", "Raw Output"].map(item => (
                                <button key={item} className={tab === item ? "active" : ""} onClick={() => setTab(item)}>
                                    {item}
                                </button>
                            ))}
                        </div>

                        <div className="side-block">
                            <div><span className={`status-dot ${statusClass}`}></span>API: {health.status}</div>
                            <div>Broker: {broker.type || "loading"}</div>
                            <div>Mode: {broker.mode || "unknown"}</div>
                        </div>

                        <div className="side-block">
                            <div className="mono">/webhook/m8</div>
                            <div className="mono">/backtest/run</div>
                            <div className="mono">/backtest/status</div>
                        </div>
                    </aside>

                    <main>
                        <div className="topbar">
                            <div>
                                <h1>Trading Bot Command Center</h1>
                                <div className="subtitle">Current running app: FastAPI bot pipeline with AI review, risk engine, Pionex broker adapters, and backtest runner.</div>
                            </div>
                            <div className="actions">
                                <button onClick={refresh} disabled={loading}>Refresh</button>
                                <button className="danger" onClick={resetBot} disabled={loading}>Reset State</button>
                            </div>
                        </div>

                        <section className={tab === "Command" ? "" : "hidden"}>
                            <div className="grid">
                                <div className="panel span-3">
                                    <div className="panel-title">API Health <span className={`pill ${statusClass}`}>{health.status}</span></div>
                                    <div className="kpi">{health.status === "ok" ? "Online" : "Check"}</div>
                                    <div className="kpi-label">FastAPI service at 127.0.0.1:8000</div>
                                </div>
                                <div className="panel span-3">
                                    <div className="panel-title">Broker <span className={brokerState === "Ready" ? "pill ok" : "pill warn"}>{brokerState}</span></div>
                                    <div className="kpi">{broker.type || "..."}</div>
                                    <div className="kpi-label">Mode: {broker.mode || "unknown"}</div>
                                </div>
                                <div className="panel span-3">
                                    <div className="panel-title">Trades Today</div>
                                    <div className="kpi">{risk.trades_today ?? 0}</div>
                                    <div className="kpi-label">Risk engine state</div>
                                </div>
                                <div className="panel span-3">
                                    <div className="panel-title">Live Capability</div>
                                    <div className="kpi">{broker.live_capable ? "Armed" : "Dry"}</div>
                                    <div className="kpi-label">Live remains gated by config and risk checks</div>
                                </div>

                                <div className="panel span-7">
                                    <div className="panel-title">Bot Flow</div>
                                    <table>
                                        <tbody>
                                            <tr><th>1. Signal</th><td>TradingView or manual payload enters <span className="mono">/webhook/m8</span>.</td></tr>
                                            <tr><th>2. AI Review</th><td>Provider layer returns a strict SignalReview; it never places orders directly.</td></tr>
                                            <tr><th>3. Risk Engine</th><td>Deterministic gates decide GO, HOLD, KILL, reject, or simulation.</td></tr>
                                            <tr><th>4. Broker</th><td>Simulation, paper, relay, or direct Pionex adapter executes only after gates pass.</td></tr>
                                        </tbody>
                                    </table>
                                </div>

                                <div className="panel span-5">
                                    <div className="panel-title">Current Status JSON</div>
                                    <div className="result">{pretty({ health, status })}</div>
                                </div>
                            </div>
                        </section>

                        <section className={tab === "Manual Signal" ? "" : "hidden"}>
                            <div className="grid">
                                <form className="panel span-6" onSubmit={submitSignal}>
                                    <div className="panel-title">Manual M8 Signal</div>
                                    <div className="form-grid">
                                        <label>Signal ID<input value={signal.signal_id} onChange={e => updateSignal("signal_id", e.target.value)} /></label>
                                        <label>Symbol<input value={signal.symbol} onChange={e => updateSignal("symbol", e.target.value)} /></label>
                                        <label>Timeframe<input value={signal.timeframe} onChange={e => updateSignal("timeframe", e.target.value)} /></label>
                                        <label>Direction<select value={signal.direction} onChange={e => updateSignal("direction", e.target.value)}><option>LONG</option><option>SHORT</option></select></label>
                                        <label>Intent<select value={signal.intent} onChange={e => updateSignal("intent", e.target.value)}><option>ENTRY</option><option>CLOSE</option></select></label>
                                        <label>Account Mode<select value={signal.account_mode} onChange={e => updateSignal("account_mode", e.target.value)}><option>SPOT</option><option>FUTURES</option></select></label>
                                        <label>Entry Price<input type="number" value={signal.entry_price} onChange={e => updateSignal("entry_price", e.target.value)} /></label>
                                        <label>Stop Price<input type="number" value={signal.stop_price} onChange={e => updateSignal("stop_price", e.target.value)} /></label>
                                        <label>Target Price<input type="number" value={signal.target_price} onChange={e => updateSignal("target_price", e.target.value)} /></label>
                                        <label>Confluence<input type="number" min="0" max="100" value={signal.confluence_score} onChange={e => updateSignal("confluence_score", e.target.value)} /></label>
                                        <label>Crisis Score<input type="number" min="0" max="100" value={signal.crisis_score} onChange={e => updateSignal("crisis_score", e.target.value)} /></label>
                                        <label>Spread<input type="number" min="0" value={signal.spread} onChange={e => updateSignal("spread", e.target.value)} /></label>
                                        <label>MC Dispersion<input type="number" min="0" value={signal.mc_dispersion} onChange={e => updateSignal("mc_dispersion", e.target.value)} /></label>
                                        <label>Order Command<select value={signal.order_command} onChange={e => updateSignal("order_command", e.target.value)}><option>GO</option><option>HOLD</option><option>KILL</option></select></label>
                                        <label className="full">Timestamp<input value={signal.timestamp} onChange={e => updateSignal("timestamp", e.target.value)} /></label>
                                    </div>
                                    <div className="actions" style={{marginTop: 14}}>
                                        <button type="button" onClick={() => setSignal({ ...defaultSignal, signal_id: `manual-${Date.now()}`, timestamp: new Date().toISOString() })}>Load Sample</button>
                                        <button className="primary" type="submit" disabled={loading}>Submit Signal</button>
                                    </div>
                                </form>

                                <div className="panel span-6">
                                    <div className="panel-title">Execution Result</div>
                                    <div className="result">{signalResult}</div>
                                </div>
                            </div>
                        </section>

                        <section className={tab === "Backtest" ? "" : "hidden"}>
                            <div className="grid">
                                <form className="panel span-4" onSubmit={runBacktest}>
                                    <div className="panel-title">Backtest Runner</div>
                                    <div className="form-grid">
                                        <label className="full">Symbol<input value={backtest.symbol} onChange={e => setBacktest({ ...backtest, symbol: e.target.value })} /></label>
                                        <label>Timeframe<input value={backtest.timeframe} onChange={e => setBacktest({ ...backtest, timeframe: e.target.value })} /></label>
                                        <label>Bars<input type="number" min="50" value={backtest.bars} onChange={e => setBacktest({ ...backtest, bars: e.target.value })} /></label>
                                        <label>Max Signals<input type="number" min="1" value={backtest.max_signals} onChange={e => setBacktest({ ...backtest, max_signals: e.target.value })} /></label>
                                        <label>Min Confluence<input type="number" min="0" max="100" value={backtest.min_confluence} onChange={e => setBacktest({ ...backtest, min_confluence: e.target.value })} /></label>
                                    </div>
                                    <div className="actions" style={{marginTop: 14}}>
                                        <button className="primary" type="submit" disabled={loading}>Run Backtest</button>
                                    </div>
                                </form>

                                <div className="panel span-8">
                                    <div className="panel-title">Backtest Output</div>
                                    <div className="result">{backtestResult}</div>
                                </div>

                                <div className="panel span-12">
                                    <div className="panel-title">Latest Signals</div>
                                    <table>
                                        <thead>
                                            <tr>
                                                <th>Signal</th>
                                                <th>Direction</th>
                                                <th>Entry</th>
                                                <th>Confluence</th>
                                                <th>Decision</th>
                                                <th>Reject Reason</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {rows.length === 0 ? (
                                                <tr><td colSpan="6">No backtest rows loaded.</td></tr>
                                            ) : rows.slice(0, 12).map(row => (
                                                <tr key={row.signal_id}>
                                                    <td className="mono">{row.signal_id}</td>
                                                    <td>{row.direction}</td>
                                                    <td>{row.entry_price}</td>
                                                    <td>{row.confluence_score}</td>
                                                    <td>{row.final_decision}</td>
                                                    <td>{row.reject_reason || ""}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </section>

                        <section className={tab === "Raw Output" ? "" : "hidden"}>
                            <div className="grid">
                                <div className="panel span-6">
                                    <div className="panel-title">Status</div>
                                    <div className="result">{pretty({ health, status })}</div>
                                </div>
                                <div className="panel span-6">
                                    <div className="panel-title">Last Signal Result</div>
                                    <div className="result">{signalResult}</div>
                                </div>
                            </div>
                        </section>
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
