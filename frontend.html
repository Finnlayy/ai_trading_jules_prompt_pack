        function ChartPanel({ chartState, setChartState, chartRef, chartContainerRef, orders, addLog, request }) {
            const timeframes = ["1m", "5m", "15m", "30m", "1h", "4h", "1d"];
            const candleSeriesRef = React.useRef(null);
            const volumeSeriesRef = React.useRef(null);
            const lineSeriesRefs = React.useRef([]);

            async function loadChart() {
                setChartState(s => ({ ...s, loading: true }));
                try {
                    const [ohlcv, indicators] = await Promise.all([
                        request(`/market/ohlcv?symbol=${chartState.symbol}&timeframe=${chartState.timeframe}&bars=300`),
                        request(`/market/indicators?symbol=${chartState.symbol}&timeframe=${chartState.timeframe}&bars=300`),
                    ]);
                    setChartState(s => ({
                        ...s,
                        bars: ohlcv.bars || [],
                        indicators: indicators.indicators || [],
                        loading: false,
                    }));
                } catch (err) {
                    setChartState(s => ({ ...s, loading: false }));
                    addLog("error", "Chart data load failed", { error: err.message, symbol: chartState.symbol, timeframe: chartState.timeframe });
                }
            }

            React.useEffect(() => {
                loadChart();
                const timer = setInterval(loadChart, 30000);
                return () => clearInterval(timer);
            }, [chartState.symbol, chartState.timeframe]);

            // Create chart instance only when symbol or timeframe changes
            React.useEffect(() => {
                if (!chartContainerRef.current) return;
                if (chartRef.current) {
                    chartRef.current.remove();
                    chartRef.current = null;
                    candleSeriesRef.current = null;
                    volumeSeriesRef.current = null;
                }
                const theme = getComputedStyle(document.documentElement);
                const chartTextColor = theme.getPropertyValue("--ink").trim() || "#f0f0f0";
                const chartLineColor = theme.getPropertyValue("--line").trim() || "#dde8df";
                const chartGridColor = theme.getPropertyValue("--surface-soft").trim() || "#1c1d20";
                const chart = LightweightCharts.createChart(chartContainerRef.current, {
                    width: chartContainerRef.current.clientWidth,
                    height: 520,
                    layout: { background: { color: "#151618" }, textColor: chartTextColor },
                    grid: { vertLines: { color: chartGridColor }, horzLines: { color: chartGridColor } },
                    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                    rightPriceScale: { borderColor: chartLineColor },
                    timeScale: { borderColor: chartLineColor, timeVisible: true },
                });
                chartRef.current = chart;

                candleSeriesRef.current = chart.addCandlestickSeries({
                    upColor: "#33a56b", downColor: "#d86545", borderUpColor: "#33a56b", borderDownColor: "#d86545",
                    wickUpColor: "#33a56b", wickDownColor: "#d86545",
                });

                volumeSeriesRef.current = chart.addHistogramSeries({
                    color: "#33a56b", priceFormat: { type: "volume" }, priceScaleId: "", scaleMargins: { top: 0.8, bottom: 0 },
                });

                const handleResize = () => {
                    if (chartContainerRef.current && chartRef.current) {
                        chartRef.current.applyOptions({ width: chartContainerRef.current.clientWidth });
                    }
                };
                window.addEventListener("resize", handleResize);
                return () => {
                    window.removeEventListener("resize", handleResize);
                    if (chartRef.current) { chartRef.current.remove(); chartRef.current = null; }
                    candleSeriesRef.current = null;
                    volumeSeriesRef.current = null;
                };
            }, [chartState.symbol, chartState.timeframe]);

            // Update data without full rebuild
            React.useEffect(() => {
                if (!chartRef.current || !chartState.bars.length) return;

                if (candleSeriesRef.current) {
                    candleSeriesRef.current.setData(chartState.bars);
                }
                if (volumeSeriesRef.current) {
                    volumeSeriesRef.current.setData(chartState.bars.map(b => ({
                        time: b.time,
                        value: b.volume,
                        color: b.close >= b.open ? "rgba(51,165,107,0.35)" : "rgba(216,101,69,0.35)",
                    })));
                }

                // Overlay signal markers from indicators
                const markers = [];
                (chartState.indicators || []).forEach(ind => {
                    if (ind.direction_hint === "LONG" && ind.confluence_score >= 11) {
                        markers.push({ time: ind.time, position: "belowBar", color: "#33a56b", shape: "arrowUp", text: `C${Math.round(ind.confluence_score)}` });
                    } else if (ind.direction_hint === "SHORT" && ind.confluence_score >= 11) {
                        markers.push({ time: ind.time, position: "aboveBar", color: "#d86545", shape: "arrowDown", text: `C${Math.round(ind.confluence_score)}` });
                    }
                });
                if (candleSeriesRef.current) {
                    candleSeriesRef.current.setMarkers(markers);
                }

                // Remove old overlay lines and add new ones
                lineSeriesRefs.current.forEach(line => {
                    if (chartRef.current) chartRef.current.removeSeries(line);
                });
                lineSeriesRefs.current = [];
                const symbolOrders = orders.filter(o => o.symbol === chartState.symbol && o.entry_price);
                symbolOrders.forEach(order => {
                    const color = order.direction === "LONG" ? "#33a56b" : "#d86545";
                    if (order.entry_price && candleSeriesRef.current) {
                        const line = chartRef.current.addLineSeries({ color, lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dotted, lastValueVisible: false, title: `${order.direction} Entry` });
                        line.setData(chartState.bars.map(b => ({ time: b.time, value: order.entry_price })));
                        lineSeriesRefs.current.push(line);
                    }
                    if (order.stop_price && candleSeriesRef.current) {
                        const line = chartRef.current.addLineSeries({ color: "#a87812", lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed, lastValueVisible: false, title: "SL" });
                        line.setData(chartState.bars.map(b => ({ time: b.time, value: order.stop_price })));
                        lineSeriesRefs.current.push(line);
                    }
                    if (order.target_price && candleSeriesRef.current) {
                        const line = chartRef.current.addLineSeries({ color: "#367bb8", lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed, lastValueVisible: false, title: "TP" });
                        line.setData(chartState.bars.map(b => ({ time: b.time, value: order.target_price })));
                        lineSeriesRefs.current.push(line);
                    }
                });

                chartRef.current.timeScale().fitContent();
            }, [chartState.bars, chartState.indicators, orders]);

            return (
                <div className="grid">
                    <div className="panel span-12">
                        <div className="panel-title">
                            <span>Live Chart</span>
                            <span style={{ display: "flex", gap: 10, alignItems: "center" }}>
                                <input value={chartState.symbol} onChange={e => setChartState(s => ({ ...s, symbol: e.target.value.toUpperCase() }))} placeholder="Symbol" style={{ width: 120 }} />
                                <select value={chartState.timeframe} onChange={e => setChartState(s => ({ ...s, timeframe: e.target.value }))} style={{ width: 90 }}>
                                    {timeframes.map(tf => <option key={tf} value={tf}>{tf}</option>)}
                                </select>
                                <button onClick={loadChart} disabled={chartState.loading}>Refresh</button>
                                {chartState.loading && <span className="kpi-caption">Loading…</span>}
                            </span>
                        </div>
                        <div ref={chartContainerRef} style={{ width: "100%", height: 520 }} />
                    </div>
                    <div className="panel span-12">
                        <div className="panel-title">Indicator Snapshot <span className="pill">{chartState.indicators.length} bars scored</span></div>
                        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(180px, 1fr))", gap: 10 }}>
                            {(chartState.indicators.slice(-12)).map((ind, i) => (
                                <div key={i} style={{ padding: 10, borderRadius: 12, border: "1px solid var(--line)", background: ind.direction_hint === "LONG" ? "rgba(51,165,107,0.08)" : ind.direction_hint === "SHORT" ? "rgba(216,101,69,0.08)" : "rgba(104,120,109,0.06)" }}>
                                    <div className="mono" style={{ fontSize: 11 }}>{new Date(ind.time * 1000).toLocaleTimeString()}</div>
                                    <div style={{ fontWeight: 700, fontSize: 14 }}>{ind.direction_hint} <span className="pill">{ind.confluence_score}</span></div>
                                    <div className="kpi-caption">Align {ind.alignment_count}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function AILayer({ aiLayer, aiMessage, setAiMessage, sendAIMessage, updateAIProfile, saveAIProfile, resetAIMemory, loading, orders, chartState, request, addLog, setRaw, setAiLayer }) {
            const profile = aiLayer.profile || {};
            const preferred = Array.isArray(profile.preferred_symbols) ? profile.preferred_symbols.join(", ") : (profile.preferred_symbols || "");
            const blocked = Array.isArray(profile.blocked_symbols) ? profile.blocked_symbols.join(", ") : (profile.blocked_symbols || "");
            const guardrails = Array.isArray(profile.guardrails) ? profile.guardrails.join("\n") : (profile.guardrails || "");
            const latestTrace = (orders || []).find(order => order.ai_trace)?.ai_trace;

            const [analyzeBars, setAnalyzeBars] = React.useState(50);
            const [analyzeStrategy, setAnalyzeStrategy] = React.useState("");
            const [strategies, setStrategies] = React.useState([]);
            const [showPrompt, setShowPrompt] = React.useState(false);
            const [smokeResult, setSmokeResult] = React.useState(null);
            const [smokeLoading, setSmokeLoading] = React.useState(false);
            const [selectedAgent, setSelectedAgent] = React.useState("");
            const [agents, setAgents] = React.useState([]);

            React.useEffect(() => {
                request("/academy/agents/registry").then(data => setAgents(data.agents || [])).catch(() => setAgents([]));
            }, []);

            React.useEffect(() => {
                request("/ai/strategies").then(data => setStrategies(data.strategies || [])).catch(() => setStrategies([]));
            }, []);

            async function runSmokeTest() {
                setSmokeLoading(true);
                try {
                    const response = await request("/backtest/smoke", { method: "POST" });
                    setSmokeResult(response);
                                        addLog("system", `Smoke test ${response.all_passed ? "PASSED" : "FAILED"}`, { broker_mode: response.broker_mode, live_capable: response.live_capable });
                } catch (error) {
                    setSmokeResult({ error: error.message });
                    addLog("error", "Smoke test failed", { error: error.message });
                } finally {
                    setSmokeLoading(false);
                }
            }

            function buildChartContext() {
                const recentBars = chartState.bars.slice(-analyzeBars);
                const lastInd = chartState.indicators[chartState.indicators.length - 1] || {};
                return {
                    symbol: chartState.symbol,
                    timeframe: chartState.timeframe,
                    recent_candles: recentBars.map(b => ({ time: b.time, open: b.open, high: b.high, low: b.low, close: b.close, volume: b.volume })),
                    latest_indicator: {
                        confluence_score: lastInd.confluence_score,
                        direction_hint: lastInd.direction_hint,
                        alignment_count: lastInd.alignment_count,
                    },
                };
            }

            async function analyzeChart(previewOnly = false) {
                if (!chartState.bars.length) return;
                const chartContext = buildChartContext();
                const body = {
                    message: `Analyze ${chartState.symbol} on ${chartState.timeframe}.`,
                    apply_to_profile: false,
                    chart_context: chartContext,
                    bars_count: analyzeBars,
                    strategy_context: analyzeStrategy || null,
                    return_prompt_only: previewOnly,
                };
                try {
                    const response = await request("/ai/chat", { method: "POST", body: JSON.stringify(body) });
                    setAiLayer(current => ({ ...current, ...response }));
                                        if (previewOnly) setShowPrompt(true);
                    addLog("ai", previewOnly ? "AI prompt previewed" : "AI analyzed chart context", { symbol: chartState.symbol, timeframe: chartState.timeframe, bars: analyzeBars, strategy: analyzeStrategy });
                } catch (error) {
                                        addLog("error", "AI chart analysis failed", { error: error.message });
                }
            }

            return (
                <div className="grid">
                    <div className="panel span-4">
                        <div className="panel-title">AI Runtime <span className="pill ai">{aiLayer.provider || "loading"}</span></div>
                        <div className="kpi-value">{profile.risk_tolerance || "..."}</div>
                        <div className="kpi-caption">Behavior profile updated {profile.updated_at ? new Date(profile.updated_at).toLocaleString() : "never"}</div>
                    </div>
                    <div className="panel span-4">
                        <div className="panel-title">Memory</div>
                        <div className="kpi-value">{(aiLayer.memory || []).length}</div>
                        <div className="kpi-caption">Recent chat messages stored locally in server logs.</div>
                    </div>
                    <div className="panel span-4">
                        <div className="panel-title">Review Influence</div>
                        <div className="kpi-value">{profile.min_confluence_preference || "auto"}</div>
                        <div className="kpi-caption">Preferred minimum confluence for AI review context.</div>
                    </div>

                    <div className="panel span-12">
                        <div className="panel-title">
                            <span>Pionex Dry-Run Smoke Test</span>
                            <button type="button" className="primary" onClick={runSmokeTest} disabled={smokeLoading}>
                                {smokeLoading ? "Running…" : "Run Smoke Test"}
                            </button>
                        </div>
                        {smokeResult ? (
                            <div>
                                <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 10 }}>
                                    <span className={`pill ${smokeResult.all_passed ? "ok" : "bad"}`}>{smokeResult.all_passed ? "ALL PASSED" : "ISSUES FOUND"}</span>
                                    <span className="pill">Mode: {smokeResult.broker_mode}</span>
                                    <span className="pill">Live Capable: {smokeResult.live_capable ? "Yes" : "No"}</span>
                                </div>
                                {smokeResult.infrastructure_checks && (
                                    <div style={{ marginBottom: 10 }}>
                                        <div className="kpi-caption" style={{ fontWeight: 700 }}>Infrastructure</div>
                                        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(200px, 1fr))", gap: 8 }}>
                                            {smokeResult.infrastructure_checks.map((check, i) => (
                                                <div key={i} style={{ padding: 8, borderRadius: 10, border: "1px solid var(--line)", background: check.passed ? "rgba(51,165,107,0.08)" : check.passed === false ? "rgba(216,101,69,0.08)" : "rgba(104,120,109,0.06)" }}>
                                                    <div className="mono" style={{ fontSize: 11 }}>{check.test}</div>
                                                    <div style={{ fontWeight: 700, fontSize: 13 }}>{check.passed === true ? "✓ PASS" : check.passed === false ? "✗ FAIL" : "— SKIP"}</div>
                                                </div>

                                                {latestTrace.scouts[selectedAgent].decision || "UNKNOWN"}

                                            <div className="kpi-caption" style={{ marginTop: 4 }}>

                                            </div>

        function StrategyHealthPanel({ strategies, loading, onRefresh, switchStrategy, request, addLog }) {
            const [selectedId, setSelectedId] = React.useState("");
            const [libraryDetails, setLibraryDetails] = React.useState({});
            const [smokeParams, setSmokeParams] = React.useState({ symbol: "HYPEUSDT", timeframe: "1h", bars: 300, min_confluence: 70 });
            const [smokeResult, setSmokeResult] = React.useState(null);
            const [smokeLoading, setSmokeLoading] = React.useState(false);

            const fetchLibraryDetails = async () => {
                try {
                    const res = await request("/strategies/library");
                    if (res && res.strategies) {
                        const dict = {};
                        res.strategies.forEach(s => {
                            dict[s.strategy_id] = s;
                        });
                        setLibraryDetails(dict);
                        if (res.strategies.length && !selectedId) {
                            setSelectedId(res.strategies[0].strategy_id);
                        }
                    }
                } catch (e) {}
            };

            React.useEffect(() => {
                fetchLibraryDetails();
            }, [strategies]);

            const runSmokeTest = async () => {
                if (!selectedId) return;
                setSmokeLoading(true);
                setSmokeResult(null);
                try {
                    const res = await request(`/strategies/${selectedId}/backtest-smoke`, {
                        method: "POST",
                        body: JSON.stringify(smokeParams)
                    });
                    setSmokeResult(res);
                    addLog("info", `Ran diagnostic smoke backtest for ${selectedId}`);
                } catch (e) {
                    addLog("error", `Failed to run smoke test for ${selectedId}`, { error: e.message });
                } finally {
                    setSmokeLoading(false);
                }
            };

            const selectedDetails = libraryDetails[selectedId] || {};

            function formatAge(seconds) {
                if (seconds === null || seconds === undefined) return "—";
                if (seconds < 60) return `${Math.round(seconds)}s ago`;
                if (seconds < 3600) return `${Math.round(seconds / 60)}m ago`;
                if (seconds < 86400) return `${Math.round(seconds / 3600)}h ago`;
                return `${Math.round(seconds / 86400)}d ago`;
            }

            function HealthBar({ score }) {
                const color = score >= 70 ? "#22c55e" : score >= 40 ? "#f59e0b" : "#ef4444";
                return (
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <div style={{ flex: 1, background: "var(--line)", borderRadius: 4, height: 10, overflow: "hidden" }}>
                            <div style={{ width: `${score}%`, background: color, height: "100%", borderRadius: 4, transition: "width 0.4s ease" }} />
                        </div>
                        <span style={{ fontSize: 13, fontWeight: 700, color, minWidth: 40, textAlign: "right" }}>{score}</span>
                    </div>

                return (
                    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                        <div style={{ flex: 1, background: "var(--line)", borderRadius: 3, height: 6, overflow: "hidden" }}>
                            <div style={{ width: `${pct}%`, background: color, height: "100%", borderRadius: 3, transition: "width 0.3s" }} />
                        </div>
                        <span style={{ fontSize: 12, fontWeight: 600, color, minWidth: 36, textAlign: "right" }}>{pct}%</span>
                    </div>

            return (
                <div className="grid">

                            <button onClick={onRefresh} disabled={loading}>{loading ? "Loading…" : "🔄 Refresh Health"}</button>
                        </div>
                        <div className="kpi-caption">Centralized Pine Script v6 and Python strategies linked to source files.</div>
                    </div>

                    <div className="panel span-5">
                        <div className="panel-title" style={{ marginBottom: 12 }}>Strategy Repository</div>
                        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                            {strategies.map(strat => {
                                const details = libraryDetails[strat.strategy_id] || {};
                                const tags = details.tags || [];
                                return (
                                    <div
                                        key={strat.strategy_id}
                                        className={`panel ${strat.strategy_id === selectedId ? "active-strategy-card" : ""}`}
                                        style={{ margin: 0, padding: 14, cursor: "pointer", border: strat.strategy_id === selectedId ? "2px solid var(--emerald)" : "1.5px solid var(--line)" }}
                                        onClick={() => { setSelectedId(strat.strategy_id); setSmokeResult(null); }}
                                    >
                                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                                            <strong style={{ fontSize: 14, color: "var(--ink)" }}>{strat.name || strat.strategy_id}</strong>
                                            <div style={{ display: "flex", gap: 6 }}>
                                                {strat.is_active && <span className="pill ok" style={{ fontSize: 10 }}>ACTIVE</span>}
                                                <button
                                                    className="small"
                                                    onClick={(e) => { e.stopPropagation(); switchStrategy(strat.strategy_id); }}
                                                    disabled={strat.is_active}
                                                    style={{ padding: "2px 8px", minHeight: 24, fontSize: 11 }}
                                                >
                                                    {strat.is_active ? "Active" : "Switch"}
                                                </button>
                                            </div>
                                        </div>
                                        <div style={{ display: "flex", gap: 4, flexWrap: "wrap", marginBottom: 10 }}>
                                            {tags.map(t => <span key={t} className="pill info" style={{ fontSize: 9, padding: "2px 6px" }}>{t}</span>)}
                                        </div>
                                        <div style={{ fontSize: 12, display: "flex", justifyContent: "space-between", color: "var(--muted)" }}>
                                            <span>Win Rate: <b>{Math.round((strat.win_rate || 0) * 100)}%</b></span>
                                            <span>Drawdown: <b style={{ color: "var(--rose)" }}>{(strat.max_drawdown_pct || 0).toFixed(1)}%</b></span>
                                            <span>Signals: <b>{strat.total_signals || 0}</b></span>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    <div className="panel span-7">
                        {selectedId ? (
                            <div>
                                <div className="panel-title" style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                                    <span>{selectedDetails.name || selectedId} Source Code</span>
                                    <span className="pill info">{selectedDetails.filepath}</span>
                                </div>
                                <p style={{ fontSize: 13, color: "var(--muted)", margin: "4px 0 12px 0" }}>{selectedDetails.description}</p>
                                
                                <div style={{ background: "var(--bg)", border: "1.5px solid var(--line)", borderRadius: "var(--radius-sm)", padding: 12, marginBottom: 16 }}>
                                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "var(--muted)", borderBottom: "1px solid var(--line)", paddingBottom: 6, marginBottom: 8 }}>
                                        <span>SUPPORTED TIMEFRAMES: {selectedDetails.timeframes ? selectedDetails.timeframes.join(", ") : "—"}</span>
                                        <span>TYPE: {selectedDetails.strategy_type}</span>
                                    </div>
                                    {selectedDetails.code ? (
                                        <pre style={{ margin: 0, maxHeight: 300, overflow: "auto", fontFamily: "JetBrains Mono, monospace", fontSize: 12, whiteSpace: "pre-wrap" }}>
                                            <code>{selectedDetails.code}</code>
                                        </pre>
                                    ) : (
                                        <div style={{ textAlign: "center", color: "var(--muted)", padding: 24, fontSize: 13 }}>
                                            Python logic defined natively in codebase (<a href={`file:///${selectedDetails.filepath}`} target="_blank" rel="noopener noreferrer" style={{ color: "var(--indigo)" }}>{selectedDetails.filepath}</a>).
                                        </div>
                                    )}
                                </div>

                                <div className="panel" style={{ background: "var(--surface-soft)", border: "1.5px solid var(--line)" }}>
                                    <div className="panel-title" style={{ fontSize: 14 }}>Diagnostic Backtest Smoke Test</div>
                                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 10, marginTop: 8 }}>
                                        <label style={{ fontSize: 11 }}>
                                            <span>Symbol</span>
                                            <input value={smokeParams.symbol} onChange={e => setSmokeParams({ ...smokeParams, symbol: e.target.value.toUpperCase() })} style={{ minHeight: 32, fontSize: 12, padding: 6 }} />
                                        </label>
                                        <label style={{ fontSize: 11 }}>
                                            <span>Timeframe</span>
                                            <input value={smokeParams.timeframe} onChange={e => setSmokeParams({ ...smokeParams, timeframe: e.target.value })} style={{ minHeight: 32, fontSize: 12, padding: 6 }} />
                                        </label>
                                        <label style={{ fontSize: 11 }}>
                                            <span>Bars</span>
                                            <input type="number" value={smokeParams.bars} onChange={e => setSmokeParams({ ...smokeParams, bars: parseInt(e.target.value) || 200 })} style={{ minHeight: 32, fontSize: 12, padding: 6 }} />
                                        </label>
                                        <label style={{ fontSize: 11 }}>
                                            <span>Min Conf</span>
                                            <input type="number" value={smokeParams.min_confluence} onChange={e => setSmokeParams({ ...smokeParams, min_confluence: parseFloat(e.target.value) || 70 })} style={{ minHeight: 32, fontSize: 12, padding: 6 }} />
                                        </label>
                                    </div>
                                    <button
                                        className="primary"
                                        onClick={runSmokeTest}
                                        disabled={smokeLoading}
                                        style={{ marginTop: 12, minHeight: 32, padding: "6px 12px", fontSize: 12 }}
                                    >
                                        {smokeLoading ? "Scoring..." : "🔥 Run Smoke Backtest"}
                                    </button>

                                    {smokeResult && (
                                        <div style={{ marginTop: 12, borderTop: "1px solid var(--line)", paddingTop: 10, fontSize: 12 }}>
                                            <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 10 }}>
                                                <div>Scored Bars: <b>{smokeResult.bars_scored}</b></div>
                                                <div>Signals Generated: <b>{smokeResult.signals_generated}</b></div>
                                                <div>Max Confluence: <b>{smokeResult.max_confluence}</b></div>
                                            </div>
                                            {smokeResult.sample_scores && smokeResult.sample_scores.length > 0 && (
                                                <div style={{ marginTop: 8 }}>
                                                    <strong>Sample Scores:</strong>
                                                    <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 4 }}>
                                                        {smokeResult.sample_scores.map((s, idx) => (
                                                            <span key={idx} className={`pill ${s.direction === "LONG" ? "ok" : s.direction === "SHORT" ? "error" : "info"}`} style={{ fontSize: 10 }}>
                                                                {s.direction} ({s.confluence_score}%)
                                                            </span>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>
                        ) : (
                            <p className="muted" style={{ textAlign: "center", padding: 40 }}>Select a strategy from the repository to view code and run diagnostics.</p>
                        )}
                    </div>
                </div>
            );
        }


        function ConfidencePanel({ request, addLog }) {
            const [stats, setStats] = React.useState({});
            const [loading, setLoading] = React.useState(false);
            const [selectedSymbol, setSelectedSymbol] = React.useState("");

            async function loadStats() {
                setLoading(true);
                try {
                    const data = await request("/confidence/stats");
                    setStats(data);
                } catch (err) {
                    addLog("error", "Failed to load confidence stats", { error: err.message });
                } finally {
                    setLoading(false);
                }
            }

            async function resetSymbol(sym) {
                try {
                    await request(`/confidence/reset/${sym}`, { method: "POST" });
                    addLog("info", `Reset confidence stats for ${sym}`);
                    loadStats();
                } catch (err) {
                    addLog("error", `Failed to reset ${sym}`, { error: err.message });
                }
            }

            async function resetAll() {
                if (!confirm("Reset ALL confidence stats? This cannot be undone.")) return;
                try {
                    await request("/confidence/reset", { method: "POST" });
                    addLog("info", "Reset all confidence stats");
                    loadStats();
                } catch (err) {
                    addLog("error", "Failed to reset all stats", { error: err.message });
                }
            }

            React.useEffect(() => {
                loadStats();
                const timer = setInterval(loadStats, 30000);
                return () => clearInterval(timer);
            }, []);

            const symbols = Object.keys(stats).sort();

            function ScoutBar({ label, accuracy, calls }) {
                const pct = Math.round((accuracy || 0) * 100);
                const color = pct >= 70 ? "#22c55e" : pct >= 50 ? "#f59e0b" : "#ef4444";
                return (
                    <div style={{ marginBottom: 8 }}>
                        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 2 }}>
                            <span>{label}</span>
                            <span>{pct}% ({calls} calls)</span>
                        </div>
                        <div style={{ background: "#1f2937", borderRadius: 4, height: 8, overflow: "hidden" }}>
                            <div style={{ width: `${pct}%`, background: color, height: "100%", borderRadius: 4, transition: "width 0.3s" }} />
                        </div>
                    </div>
                );
            }

            function SymbolCard({ symbol, data }) {
                const long = data.long_stats || {};
                const short = data.short_stats || {};
                const scouts = data.scout_stats || {};
                return (
                    <div className="panel" style={{ minWidth: 320, flex: 1 }}>
                        <div className="panel-title" style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                            <span>{symbol}</span>
                            <span className="pill">{data.total_signals || 0} signals</span>
                        </div>
                        <div style={{ marginBottom: 12 }}>
                            <div style={{ fontSize: 13, color: "#9ca3af", marginBottom: 4 }}>Direction Track Record</div>
                            <div style={{ display: "flex", gap: 16, fontSize: 13 }}>
                                <div>LONG: <strong style={{ color: long.win_rate > 0.5 ? "#22c55e" : "#ef4444" }}>{((long.win_rate || 0) * 100).toFixed(0)}%</strong> <span className="muted">({long.wins || 0}W/{long.losses || 0}L)</span></div>
                                <div>SHORT: <strong style={{ color: short.win_rate > 0.5 ? "#22c55e" : "#ef4444" }}>{((short.win_rate || 0) * 100).toFixed(0)}%</strong> <span className="muted">({short.wins || 0}W/{short.losses || 0}L)</span></div>
                            </div>
                        </div>
                        <div style={{ marginBottom: 12 }}>
                            <div style={{ fontSize: 13, color: "#9ca3af", marginBottom: 4 }}>Scout Accuracy</div>
                            {["technical", "sentiment", "risk", "macro"].map(name => {
                                const s = scouts[name] || {};
                                return <ScoutBar key={name} label={name.charAt(0).toUpperCase() + name.slice(1)} accuracy={s.accuracy || 0} calls={s.calls || 0} />;
                            })}
                        </div>
                        <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                            <button className="small" onClick={() => setSelectedSymbol(symbol)}>View Context</button>
                            <button className="small warning" onClick={() => resetSymbol(symbol)}>Reset</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="grid">
                    <div className="panel span-12">
                        <div className="panel-title" style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                            <span>Confidence Registry <span className="pill">{symbols.length} symbols</span></span>
                            <div style={{ display: "flex", gap: 8 }}>
                                <button onClick={loadStats} disabled={loading}>{loading ? "Loading..." : "Refresh"}</button>
                                <button className="warning" onClick={resetAll}>Reset All</button>
                            </div>
                        </div>
                        <div className="kpi-caption">Per-symbol scout accuracy, win rates, and direction stats. Scouts learn via prompt injection — not model weights.</div>
                    </div>
                    {symbols.length === 0 && (
                        <div className="panel span-12">
                            <div className="kpi-caption">No confidence data yet. Submit signals or run backtests to populate the registry.</div>
                        </div>
                    )}
                    <div className="panel span-12" style={{ display: "flex", flexWrap: "wrap", gap: 12, padding: 12 }}>
                        {symbols.map(sym => <SymbolCard key={sym} symbol={sym} data={stats[sym]} />)}
                    </div>

                    {selectedSymbol && (
                        <div className="panel span-12" style={{ marginTop: 12 }}>
                            <div className="panel-title">Injected Context: {selectedSymbol}</div>
                            <pre style={{ whiteSpace: "pre-wrap", fontSize: 13 }}>
                                {(() => {
                                    const d = stats[selectedSymbol] || {};
                                    const long = d.long_stats || {};
                                    const short = d.short_stats || {};
                                    const scouts = d.scout_stats || {};
                                    return `Symbol: ${selectedSymbol}
Total signals: ${d.total_signals || 0}
LONG: ${((long.win_rate || 0) * 100).toFixed(0)}% win rate (${long.wins || 0}W/${long.losses || 0}L), avg RR: ${(long.avg_rr || 0).toFixed(2)}, avg PnL: ${(long.avg_pnl_pct || 0).toFixed(2)}%
SHORT: ${((short.win_rate || 0) * 100).toFixed(0)}% win rate (${short.wins || 0}W/${short.losses || 0}L), avg RR: ${(short.avg_rr || 0).toFixed(2)}, avg PnL: ${(short.avg_pnl_pct || 0).toFixed(2)}%
${["technical", "sentiment", "risk", "macro"].map(n => {
    const s = scouts[n] || {};
    return `  ${n}: ${((s.accuracy || 0) * 100).toFixed(0)}% accuracy (${s.correct_calls || 0}/${s.calls || 0}), avg confidence: ${(s.avg_confidence || 0).toFixed(2)}`;
}).join("\n")}
Historical avg confluence: ${(d.avg_confluence || 0).toFixed(1)}, avg crisis: ${(d.avg_crisis || 0).toFixed(1)}`;
                                })()}
                            </pre>
                            <button className="small" onClick={() => setSelectedSymbol("")}>Close</button>
                        </div>
                    )}
                </div>
            );
        }

        function LifecycleLearningPanel({ request, addLog }) {
            const [summary, setSummary] = React.useState(null);
            const [engineStatus, setEngineStatus] = React.useState(null);
            const [outcomes, setOutcomes] = React.useState([]);
            const [learning, setLearning] = React.useState([]);
            const [careerEvents, setCareerEvents] = React.useState([]);
            const [candidates, setCandidates] = React.useState([]);
            const [loading, setLoading] = React.useState(false);
            const [engineLoading, setEngineLoading] = React.useState(false);

            async function loadLifecycle() {
                setLoading(true);
                try {
                    const [summaryData, engineData, outcomeData, learningData, careerData, candidateData] = await Promise.all([
                        request("/lifecycle/summary"),
                        request("/lifecycle/engine/status"),
                        request("/lifecycle/outcomes?limit=25"),
                        request("/lifecycle/learning?limit=50"),
                        request("/academy/agents/careers/recent?limit=25&event_type=prediction_result"),
                        request("/lifecycle/candidates?limit=25"),
                    ]);
                    setSummary(summaryData);
                    setEngineStatus(engineData);
                    setOutcomes(outcomeData.items || []);
                    setLearning(learningData.items || []);
                    setCareerEvents(careerData.career || []);
                    setCandidates(candidateData.items || []);
                } catch (err) {
                    addLog("error", "Failed to load lifecycle learning data", { error: err.message });
                } finally {
                    setLoading(false);
                }
            }

            async function controlEngine(action) {
                setEngineLoading(true);
                try {
                    const data = await request("/lifecycle/engine/control", {
                        method: "POST",
                        body: JSON.stringify({ action })
                    });
                    setEngineStatus(data);
                    addLog("system", `Paper training engine ${action}`, data.engine);
                    await loadLifecycle();
                } catch (err) {
                    addLog("error", `Paper training engine ${action} failed`, { error: err.message });
                } finally {
                    setEngineLoading(false);
                }
            }

            React.useEffect(() => {
                loadLifecycle();
                const timer = setInterval(loadLifecycle, 15000);
                return () => clearInterval(timer);
            }, []);

            const outcomeStats = summary?.outcomes || {};
            const candidateStats = summary?.candidates || {};
            const learningStats = summary?.learning || {};
            const scoutAccuracy = learningStats.scout_accuracy || {};
            const scoutRows = Object.entries(scoutAccuracy).sort((a, b) => (b[1].total || 0) - (a[1].total || 0));
            const engine = engineStatus?.engine || {};
            const components = engineStatus?.components || {};
            const loopComponent = components.autonomous_loop || {};
            const monitorComponent = components.position_monitor || {};
            const engineWarnings = engineStatus?.warnings || [];
            const engineRunning = engine.state === "running";
            const enginePaused = engine.state === "paused";

            function formatNumber(value, decimals = 2) {
                const n = Number(value || 0);
                return Number.isFinite(n) ? n.toFixed(decimals) : "0.00";
            }

            function shortId(value) {
                if (!value) return "--";
                return String(value).length > 18 ? `${String(value).slice(0, 18)}...` : String(value);
            }

            return (
                <div className="grid" data-testid="lifecycle-learning-panel">
                    <div className="panel span-12">
                        <div className="panel-title" style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                            <span>Paper Outcome Learning <span className="pill">{outcomeStats.total || 0} outcomes</span></span>
                            <button type="button" onClick={loadLifecycle} disabled={loading}>{loading ? "Loading..." : "Refresh"}</button>
                        </div>
                        <div className="kpi-caption">Closed paper positions become PaperOutcome rows, then AgentLearningEvent rows update scout confidence and academy careers.</div>
                    </div>

                    <div className="panel span-12">
                        <div className="panel-title">Paper Training Engine <span className={`pill ${engineRunning ? "ok" : enginePaused ? "warn" : "neutral"}`}>{engine.state || "unknown"}</span></div>
                        <div className="actions" data-testid="paper-training-engine-controls">
                            <button type="button" className="primary" disabled={engineLoading || engineRunning} onClick={() => controlEngine("start")}>Start Engine</button>
                            <button type="button" disabled={engineLoading || !engineRunning} onClick={() => controlEngine("pause")}>Pause</button>
                            <button type="button" disabled={engineLoading || !enginePaused} onClick={() => controlEngine("resume")}>Resume</button>
                            <button type="button" className="danger" disabled={engineLoading || engine.state === "stopped"} onClick={() => controlEngine("stop")}>Stop</button>
                        </div>
                        <div className="kpi-caption">
                            Loop {loopComponent.running ? "running" : "stopped"} · Monitor {monitorComponent.running ? "running" : "stopped"} · Mode {engine.execution_mode || "paper"}
                        </div>
                        {engineWarnings.length > 0 && (
                            <div className="notice warn">{engineWarnings.join(" ")}</div>
                        )}
                    </div>

                    <div className="panel span-3">
                        <Kpi title="Candidates" value={candidateStats.total || 0} caption={`${candidateStats.closed || 0} closed`} tone="ok" />
                    </div>
                    <div className="panel span-3">
                        <Kpi title="Simulated Hit Rate" value={`${formatNumber((outcomeStats.win_rate || 0) * 100, 1)}%`} caption={`${outcomeStats.wins || 0}W / ${outcomeStats.losses || 0}L`} tone={(outcomeStats.win_rate || 0) >= 0.5 ? "ok" : "warn"} />
                    </div>
                    <div className="panel span-3">
                        <Kpi title="Simulated PnL" value={formatNumber(outcomeStats.total_pnl || 0, 4)} caption={`Avg R ${formatNumber(outcomeStats.avg_r_multiple || 0, 2)}`} tone={(outcomeStats.total_pnl || 0) >= 0 ? "ok" : "warn"} />
                    </div>
                    <div className="panel span-3">
                        <Kpi title="Learning Events" value={learningStats.events || 0} caption={`${scoutRows.length} scouts`} tone="info" />
                    </div>

                    <div className="panel span-6">
                        <div className="panel-title">Recent Paper Outcomes</div>
                        <table className="ordertable" data-testid="paper-outcomes-table">
                            <thead>
                                <tr><th>Symbol</th><th>Dir</th><th>Reason</th><th>PnL</th><th>R</th><th>Strategy</th></tr>
                            </thead>
                            <tbody>
                                {outcomes.map(row => (
                                    <tr key={row.trade_id}>
                                        <td><b>{row.symbol}</b></td>
                                        <td>{row.direction}</td>
                                        <td>{row.close_reason}</td>
                                        <td style={{ color: row.pnl >= 0 ? "var(--emerald)" : "var(--rose)" }}>{row.pnl >= 0 ? "+" : ""}{formatNumber(row.pnl, 4)}</td>
                                        <td>{formatNumber(row.r_multiple, 2)}</td>
                                        <td>{row.strategy_id || "--"}</td>
                                    </tr>
                                ))}
                                {outcomes.length === 0 && <tr><td colSpan={6} style={{ textAlign: "center", color: "var(--muted)" }}>No paper outcomes yet</td></tr>}
                            </tbody>
                        </table>
                    </div>

                    <div className="panel span-6">
                        <div className="panel-title">Scout Outcome Accuracy</div>
                        <table className="ordertable" data-testid="scout-learning-table">
                            <thead>
                                <tr><th>Scout</th><th>Correct</th><th>Total</th><th>Accuracy</th></tr>
                            </thead>
                            <tbody>
                                {scoutRows.map(([name, row]) => (
                                    <tr key={name}>
                                        <td><b>{name}</b></td>
                                        <td>{row.correct || 0}</td>
                                        <td>{row.total || 0}</td>
                                        <td style={{ color: (row.accuracy || 0) >= 0.5 ? "var(--emerald)" : "var(--rose)" }}>{formatNumber((row.accuracy || 0) * 100, 0)}%</td>
                                    </tr>
                                ))}
                                {scoutRows.length === 0 && <tr><td colSpan={4} style={{ textAlign: "center", color: "var(--muted)" }}>No scout learning events yet</td></tr>}
                            </tbody>
                        </table>
                    </div>

                    <div className="panel span-7">
                        <div className="panel-title">Recent Learning Events</div>
                        <table className="ordertable">
                            <thead>
                                <tr><th>Scout</th><th>Symbol</th><th>Dir</th><th>Correct</th><th>Trade</th></tr>
                            </thead>
                            <tbody>
                                {learning.slice(0, 12).map((row, index) => (
                                    <tr key={`${row.trade_id}-${row.scout_name}-${index}`}>
                                        <td><b>{row.scout_name}</b></td>
                                        <td>{row.symbol}</td>
                                        <td>{row.direction}</td>
                                        <td><span className={`pill ${row.was_correct ? "ok" : "error"}`}>{row.was_correct ? "yes" : "no"}</span></td>
                                        <td>{shortId(row.trade_id)}</td>
                                    </tr>
                                ))}
                                {learning.length === 0 && <tr><td colSpan={5} style={{ textAlign: "center", color: "var(--muted)" }}>No learning events yet</td></tr>}
                            </tbody>
                        </table>
                    </div>

                    <div className="panel span-5">
                        <div className="panel-title">Academy Career Outcomes</div>
                        <table className="ordertable" data-testid="academy-career-outcomes-table">
                            <thead>
                                <tr><th>Scout</th><th>Symbol</th><th>Strategy</th><th>Correct</th></tr>
                            </thead>
                            <tbody>
                                {careerEvents.slice(0, 8).map(row => (
                                    <tr key={row.entry_id}>
                                        <td><b>{row.scout_name}</b></td>
                                        <td>{row.details?.symbol || "--"}</td>
                                        <td>{row.details?.strategy_id || "--"}</td>
                                        <td><span className={`pill ${row.details?.is_correct ? "ok" : "error"}`}>{row.details?.is_correct ? "yes" : "no"}</span></td>
                                    </tr>
                                ))}
                                {careerEvents.length === 0 && <tr><td colSpan={4} style={{ textAlign: "center", color: "var(--muted)" }}>No paper outcome careers yet</td></tr>}
                            </tbody>
                        </table>
                    </div>

                    <div className="panel span-5">
                        <div className="panel-title">Recent Candidates</div>
                        <table className="ordertable">
                            <thead>
                                <tr><th>Symbol</th><th>TF</th><th>Status</th><th>Risk</th><th>Reason</th><th>Vote</th><th>Score</th></tr>
                            </thead>
                            <tbody>
                                {candidates.slice(0, 12).map(row => (
                                    <tr key={row.candidate_id} title={row.confidence_context || ""}>
                                        <td><b>{row.symbol}</b></td>
                                        <td>{row.timeframe}</td>
                                        <td><span className={`pill ${row.status === "paper_closed" ? "ok" : row.status === "risk_rejected" ? "error" : "warn"}`}>{row.status}</span></td>
                                        <td>{row.risk_decision ? <span className={`pill ${row.risk_decision === 'PROCEED_TO_SIMULATION' ? 'ok' : 'error'}`}>{shortId(row.risk_decision)}</span> : "-"}</td>
                                        <td>{shortId(row.reject_reason) || "-"}</td>
                                        <td>{row.weighted_scout_vote !== undefined && row.weighted_scout_vote !== null ? formatNumber(row.weighted_scout_vote, 2) : "-"}</td>
                                        <td>{formatNumber(row.confluence_score, 1)}</td>
                                    </tr>

                </div>
