        function ChartPanel({ chartState, setChartState, chartRef, chartContainerRef, orders }) {
            const timeframes = ["1m", "5m", "15m", "30m", "1h", "4h", "1d"];

            async function loadChart() {
                setChartState(s => ({ ...s, loading: true }));
                try {
                    const [ohlcv, indicators] = await Promise.all([
                        fetch(`/market/ohlcv?symbol=${chartState.symbol}&timeframe=${chartState.timeframe}&bars=300`).then(r => r.json()),
                        fetch(`/market/indicators?symbol=${chartState.symbol}&timeframe=${chartState.timeframe}&bars=300`).then(r => r.json()),
                    ]);
                    setChartState(s => ({
                        ...s,
                        bars: ohlcv.bars || [],
                        indicators: indicators.indicators || [],
                        loading: false,
                    }));
                } catch (err) {
                    setChartState(s => ({ ...s, loading: false }));
                }
            }

            React.useEffect(() => {
                loadChart();
                const timer = setInterval(loadChart, 30000);
                return () => clearInterval(timer);
            }, [chartState.symbol, chartState.timeframe]);

            React.useEffect(() => {
                if (!chartContainerRef.current || !chartState.bars.length) return;
                if (chartRef.current) {
                    chartRef.current.remove();
                    chartRef.current = null;
                }
                const chart = LightweightCharts.createChart(chartContainerRef.current, {
                    width: chartContainerRef.current.clientWidth,
                    height: 520,
                    layout: { background: { color: "#ffffff" }, textColor: "#142118" },
                    grid: { vertLines: { color: "#f0f0f0" }, horzLines: { color: "#f0f0f0" } },
                    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                    rightPriceScale: { borderColor: "#dde8df" },
                    timeScale: { borderColor: "#dde8df", timeVisible: true },
                });
                chartRef.current = chart;

                const candleSeries = chart.addCandlestickSeries({
                    upColor: "#33a56b", downColor: "#d86545", borderUpColor: "#33a56b", borderDownColor: "#d86545",
                    wickUpColor: "#33a56b", wickDownColor: "#d86545",
                });
                candleSeries.setData(chartState.bars);

                const volumeSeries = chart.addHistogramSeries({
                    color: "#33a56b", priceFormat: { type: "volume" }, priceScaleId: "", scaleMargins: { top: 0.8, bottom: 0 },
                });
                volumeSeries.setData(chartState.bars.map(b => ({
                    time: b.time,
                    value: b.volume,
                    color: b.close >= b.open ? "rgba(51,165,107,0.35)" : "rgba(216,101,69,0.35)",
                })));

                // Overlay signal markers from indicators
                const markers = [];
                (chartState.indicators || []).forEach(ind => {
                    if (ind.direction_hint === "LONG" && ind.confluence_score >= 11) {
                        markers.push({ time: ind.time, position: "belowBar", color: "#33a56b", shape: "arrowUp", text: `C${Math.round(ind.confluence_score)}` });
                    } else if (ind.direction_hint === "SHORT" && ind.confluence_score >= 11) {
                        markers.push({ time: ind.time, position: "aboveBar", color: "#d86545", shape: "arrowDown", text: `C${Math.round(ind.confluence_score)}` });
                    }
                });
                candleSeries.setMarkers(markers);

                // Overlay executed orders as horizontal lines
                const symbolOrders = orders.filter(o => o.symbol === chartState.symbol && o.entry_price);
                symbolOrders.forEach(order => {
                    const color = order.direction === "LONG" ? "#33a56b" : "#d86545";
                    if (order.entry_price) {
                        const line = chart.addLineSeries({ color, lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dotted, lastValueVisible: false, title: `${order.direction} Entry` });
                        line.setData(chartState.bars.map(b => ({ time: b.time, value: order.entry_price })));
                    }
                    if (order.stop_price) {
                        const line = chart.addLineSeries({ color: "#a87812", lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed, lastValueVisible: false, title: "SL" });
                        line.setData(chartState.bars.map(b => ({ time: b.time, value: order.stop_price })));
                    }
                    if (order.target_price) {
                        const line = chart.addLineSeries({ color: "#367bb8", lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed, lastValueVisible: false, title: "TP" });
                        line.setData(chartState.bars.map(b => ({ time: b.time, value: order.target_price })));
                    }
                });

                chart.timeScale().fitContent();

                const handleResize = () => {
                    if (chartContainerRef.current && chartRef.current) {
                        chartRef.current.applyOptions({ width: chartContainerRef.current.clientWidth });
                    }
                };
                window.addEventListener("resize", handleResize);
                return () => {
                    window.removeEventListener("resize", handleResize);
                    if (chartRef.current) { chartRef.current.remove(); chartRef.current = null; }
                };
            }, [chartState.bars, chartState.indicators, orders, chartState.symbol]);

            return (
                <div className="grid">
                    <div className="panel span-12">
                        <div className="panel-title">
                            <span>Live Chart</span>
                            <span style={{ display: "flex", gap: 10, alignItems: "center" }}>
                                <input value={chartState.symbol} onChange={e => setChartState(s => ({ ...s, symbol: e.target.value.toUpperCase() }))} placeholder="Symbol" style={{ width: 120 }} />
                                <select value={chartState.timeframe} onChange={e => setChartState(s => ({ ...s, timeframe: e.target.value }))} style={{ width: 90 }}>
                                    {timeframes.map(tf => <option key={tf} value={tf}>{tf}</option>)}
                                </select>
                                <button onClick={loadChart} disabled={chartState.loading}>Refresh</button>
                                {chartState.loading && <span className="kpi-caption">Loading…</span>}
                            </span>
                        </div>
                        <div ref={chartContainerRef} style={{ width: "100%", height: 520 }} />
                    </div>
                    <div className="panel span-12">
                        <div className="panel-title">Indicator Snapshot <span className="pill">{chartState.indicators.length} bars scored</span></div>
                        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(180px, 1fr))", gap: 10 }}>
                            {(chartState.indicators.slice(-12)).map((ind, i) => (
                                <div key={i} style={{ padding: 10, borderRadius: 12, border: "1px solid var(--line)", background: ind.direction_hint === "LONG" ? "rgba(51,165,107,0.08)" : ind.direction_hint === "SHORT" ? "rgba(216,101,69,0.08)" : "rgba(104,120,109,0.06)" }}>
                                    <div className="mono" style={{ fontSize: 11 }}>{new Date(ind.time * 1000).toLocaleTimeString()}</div>
                                    <div style={{ fontWeight: 700, fontSize: 14 }}>{ind.direction_hint} <span className="pill">{ind.confluence_score}</span></div>
                                    <div className="kpi-caption">Align {ind.alignment_count}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function AILayer({ aiLayer, aiMessage, setAiMessage, sendAIMessage, updateAIProfile, saveAIProfile, resetAIMemory, loading, orders, chartState, request, addLog, setRaw, setAiLayer }) {
            const profile = aiLayer.profile || {};
            const preferred = Array.isArray(profile.preferred_symbols) ? profile.preferred_symbols.join(", ") : (profile.preferred_symbols || "");
            const blocked = Array.isArray(profile.blocked_symbols) ? profile.blocked_symbols.join(", ") : (profile.blocked_symbols || "");
            const guardrails = Array.isArray(profile.guardrails) ? profile.guardrails.join("\n") : (profile.guardrails || "");
            const latestTrace = (orders || []).find(order => order.ai_trace)?.ai_trace;

            const [analyzeBars, setAnalyzeBars] = React.useState(50);
            const [analyzeStrategy, setAnalyzeStrategy] = React.useState("");
            const [strategies, setStrategies] = React.useState([]);
            const [showPrompt, setShowPrompt] = React.useState(false);
            const [smokeResult, setSmokeResult] = React.useState(null);
            const [smokeLoading, setSmokeLoading] = React.useState(false);

            React.useEffect(() => {
                request("/ai/strategies").then(data => setStrategies(data.strategies || [])).catch(() => setStrategies([]));
            }, []);

            async function runSmokeTest() {
                setSmokeLoading(true);
                try {
                    const response = await request("/backtest/smoke", { method: "POST" });
                    setSmokeResult(response);
                    setRaw(pretty(response));
                    addLog("system", `Smoke test ${response.all_passed ? "PASSED" : "FAILED"}`, { broker_mode: response.broker_mode, live_capable: response.live_capable });
                } catch (error) {
                    setSmokeResult({ error: error.message });
                    addLog("error", "Smoke test failed", { error: error.message });
                } finally {
                    setSmokeLoading(false);
                }
            }

            function buildChartContext() {
                const recentBars = chartState.bars.slice(-analyzeBars);
                const lastInd = chartState.indicators[chartState.indicators.length - 1] || {};
                return {
                    symbol: chartState.symbol,
                    timeframe: chartState.timeframe,
                    recent_candles: recentBars.map(b => ({ time: b.time, open: b.open, high: b.high, low: b.low, close: b.close, volume: b.volume })),
                    latest_indicator: {
                        confluence_score: lastInd.confluence_score,
                        direction_hint: lastInd.direction_hint,
                        alignment_count: lastInd.alignment_count,
                    },
                };
            }

            async function analyzeChart(previewOnly = false) {
                if (!chartState.bars.length) return;
                const chartContext = buildChartContext();
                const body = {
                    message: `Analyze ${chartState.symbol} on ${chartState.timeframe}.`,
                    apply_to_profile: false,
                    chart_context: chartContext,
                    bars_count: analyzeBars,
                    strategy_context: analyzeStrategy || null,
                    return_prompt_only: previewOnly,
                };
                try {
                    const response = await request("/ai/chat", { method: "POST", body: JSON.stringify(body) });
                    setAiLayer(current => ({ ...current, ...response }));
                    setRaw(pretty(response));
                    if (previewOnly) setShowPrompt(true);
                    addLog("ai", previewOnly ? "AI prompt previewed" : "AI analyzed chart context", { symbol: chartState.symbol, timeframe: chartState.timeframe, bars: analyzeBars, strategy: analyzeStrategy });
                } catch (error) {
                    setRaw(`ERROR: ${error.message}`);
                    addLog("error", "AI chart analysis failed", { error: error.message });
                }
            }

            return (
                <div className="grid">
                    <div className="panel span-4">
                        <div className="panel-title">AI Runtime <span className="pill ai">{aiLayer.provider || "loading"}</span></div>
                        <div className="kpi-value">{profile.risk_tolerance || "..."}</div>
                        <div className="kpi-caption">Behavior profile updated {profile.updated_at ? new Date(profile.updated_at).toLocaleString() : "never"}</div>
                    </div>
                    <div className="panel span-4">
                        <div className="panel-title">Memory</div>
                        <div className="kpi-value">{(aiLayer.memory || []).length}</div>
                        <div className="kpi-caption">Recent chat messages stored locally in server logs.</div>
                    </div>
                    <div className="panel span-4">
                        <div className="panel-title">Review Influence</div>
                        <div className="kpi-value">{profile.min_confluence_preference || "auto"}</div>
                        <div className="kpi-caption">Preferred minimum confluence for AI review context.</div>
                    </div>

                    <div className="panel span-12">
                        <div className="panel-title">
                            <span>Pionex Dry-Run Smoke Test</span>
                            <button type="button" className="primary" onClick={runSmokeTest} disabled={smokeLoading}>
                                {smokeLoading ? "Running…" : "Run Smoke Test"}
                            </button>
                        </div>
                        {smokeResult ? (
                            <div>
                                <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 10 }}>
                                    <span className={`pill ${smokeResult.all_passed ? "ok" : "bad"}`}>{smokeResult.all_passed ? "ALL PASSED" : "ISSUES FOUND"}</span>
                                    <span className="pill">Mode: {smokeResult.broker_mode}</span>
                                    <span className="pill">Live Capable: {smokeResult.live_capable ? "Yes" : "No"}</span>
                                </div>
                                {smokeResult.infrastructure_checks && (
                                    <div style={{ marginBottom: 10 }}>
                                        <div className="kpi-caption" style={{ fontWeight: 700 }}>Infrastructure</div>
                                        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(200px, 1fr))", gap: 8 }}>
                                            {smokeResult.infrastructure_checks.map((check, i) => (
                                                <div key={i} style={{ padding: 8, borderRadius: 10, border: "1px solid var(--line)", background: check.passed ? "rgba(51,165,107,0.08)" : check.passed === false ? "rgba(216,101,69,0.08)" : "rgba(104,120,109,0.06)" }}>
                                                    <div className="mono" style={{ fontSize: 11 }}>{check.test}</div>
                                                    <div style={{ fontWeight: 700, fontSize: 13 }}>{check.passed === true ? "✓ PASS" : check.passed === false ? "✗ FAIL" : "— SKIP"}</div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                                {smokeResult.pipeline_checks && (
                                    <div>
                                        <div className="kpi-caption" style={{ fontWeight: 700 }}>Pipeline</div>
                                        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(240px, 1fr))", gap: 8 }}>
                                            {smokeResult.pipeline_checks.map((check, i) => (
                                                <div key={i} style={{ padding: 8, borderRadius: 10, border: "1px solid var(--line)", background: check.error ? "rgba(216,101,69,0.08)" : check.is_dry_run ? "rgba(51,165,107,0.08)" : "rgba(167,139,12,0.08)" }}>
                                                    <div className="mono" style={{ fontSize: 11 }}>{check.signal_id}</div>
                                                    <div style={{ fontWeight: 700, fontSize: 13 }}>{check.error ? `✗ ERROR: ${check.error}` : `${check.final_decision} (${check.broker_status})`}</div>
                                                    {check.reject_reason && <div className="kpi-caption">{check.reject_reason}</div>}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                                {smokeResult.error && <div style={{ color: "#d86545" }}>⚠ {smokeResult.error}</div>}
                            </div>
                        ) : (
                            <div className="kpi-caption">Click "Run Smoke Test" to verify the Pionex Direct broker pipeline in dry-run mode. No live orders will be sent.</div>
                        )}
                    </div>

                    <form className="panel span-7" onSubmit={sendAIMessage}>
                        <div className="panel-title">AI Layer Chat <span className="pill ok">memory on</span></div>
                        <div className="chat">
                            {(aiLayer.memory || []).length === 0 ? (
                                <div className="kpi-caption">No AI-layer memory yet.</div>
                            ) : (aiLayer.memory || []).map((message, index) => (
                                <div className={`chat-message ${message.role}`} key={`${message.timestamp}-${index}`}>
                                    <div className="mono">{message.role} - {new Date(message.timestamp).toLocaleTimeString()}</div>
                                    <div>{message.content}</div>
                                </div>
                            ))}
                        </div>
                        <div className="row-actions">
                            <input value={aiMessage} onChange={event => setAiMessage(event.target.value)} placeholder="Tell the AI layer how to behave during signal review" />
                            <button className="primary" type="submit" disabled={loading}>Send</button>
                            <button type="button" className="danger" onClick={resetAIMemory} disabled={loading}>Reset Memory</button>
                        </div>

                        <div style={{ marginTop: 14, padding: 12, border: "1px solid var(--line)", borderRadius: 12, background: "var(--surface-soft)" }}>
                            <div className="panel-title" style={{ marginBottom: 10 }}>Chart Analysis Controls</div>
                            <div className="row-actions" style={{ marginBottom: 10, flexWrap: "wrap" }}>
                                <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12 }}>
                                    <span>Bars</span>
                                    <select value={analyzeBars} onChange={e => setAnalyzeBars(Number(e.target.value))} style={{ width: 70 }}>
                                        {[10, 25, 50, 100, 200].map(n => <option key={n} value={n}>{n}</option>)}
                                    </select>
                                </label>
                                <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12 }}>
                                    <span>Strategy</span>
                                    <select value={analyzeStrategy} onChange={e => setAnalyzeStrategy(e.target.value)} style={{ width: 180 }}>
                                        <option value="">None / Manual</option>
                                        {strategies.map(s => <option key={`${s.type}-${s.name}`} value={s.name}>{s.name} ({s.type})</option>)}
                                    </select>
                                </label>
                                <button type="button" className="warning" disabled={loading || !chartState.bars.length} onClick={() => analyzeChart(false)}>
                                    {loading ? "Analyzing…" : "Analyze Chart"}
                                </button>
                                <button type="button" disabled={loading || !chartState.bars.length} onClick={() => analyzeChart(true)}>
                                    Preview Prompt
                                </button>
                            </div>
                            <div className="kpi-caption">Moonshot AI key is used for LLM calls. Bars: {analyzeBars} | Strategy: {analyzeStrategy || "none"}</div>
                        </div>

                        {aiLayer.generated_prompt && showPrompt && (
                            <div style={{ marginTop: 14 }}>
                                <div className="panel-title">
                                    <span>Generated Prompt</span>
                                    <button type="button" onClick={() => { setAiMessage(aiLayer.generated_prompt); setShowPrompt(false); addLog("system", "Copied generated prompt to chat input"); }}>
                                        Copy to Chat Input
                                    </button>
                                </div>
                                <pre style={{ maxHeight: 300, overflow: "auto", fontSize: 12 }}>{aiLayer.generated_prompt}</pre>
                                {aiLayer.system_prompt && (
                                    <details style={{ marginTop: 8 }}>
                                        <summary className="kpi-caption">System Prompt</summary>
                                        <pre style={{ maxHeight: 200, overflow: "auto", fontSize: 11, marginTop: 6 }}>{aiLayer.system_prompt}</pre>
                                    </details>
                                )}
                            </div>
                        )}
                    </form>

                    <div className="panel span-5">
                        <div className="panel-title">Behavior Profile</div>
                        <div className="form-grid">
                            <Field label="Trading Style" value={profile.trading_style || ""} onChange={value => updateAIProfile("trading_style", value)} />
                            <Select label="Risk Tolerance" value={profile.risk_tolerance || "moderate"} options={["conservative", "moderate", "aggressive"]} onChange={value => updateAIProfile("risk_tolerance", value)} />
                            <Field label="Preferred Symbols" value={preferred} onChange={value => updateAIProfile("preferred_symbols", value)} />
                            <Field label="Blocked Symbols" value={blocked} onChange={value => updateAIProfile("blocked_symbols", value)} />
                            <Field label="Max Risk %" type="number" value={profile.max_risk_pct ?? ""} onChange={value => updateAIProfile("max_risk_pct", value)} />
                            <Field label="Min Confluence" type="number" value={profile.min_confluence_preference ?? ""} onChange={value => updateAIProfile("min_confluence_preference", value)} />
                            <label className="full"><span>Notes</span><textarea value={profile.notes || ""} onChange={event => updateAIProfile("notes", event.target.value)} /></label>
                            <label className="full"><span>Guardrails</span><textarea value={guardrails} onChange={event => updateAIProfile("guardrails", event.target.value)} /></label>
                        </div>
                        <div className="row-actions">
                            <button className="primary" type="button" onClick={saveAIProfile} disabled={loading}>Save Profile</button>
                        </div>
                    </div>

                    <div className="panel span-12">
                        <div className="panel-title">Active AI Review Prompt</div>
                        <pre>{aiLayer.behavior_prompt || "Loading behavior prompt..."}</pre>
                    </div>

                    <div className="panel span-12">
                        <div className="panel-title">Latest AI Reasoning Audit <span className="pill warn">summary only</span></div>
                        <pre>{latestTrace ? pretty(latestTrace) : "No AI audit trace yet. Submit a manual signal or run a backtest to populate this panel."}</pre>
                    </div>
                </div>
            );
        }

        function Orders({ orders }) {
            return (
                <div className="grid">
                    <div className="panel span-12">
                        <div className="panel-title">Personal Order Book <span className="pill">{orders.length} orders</span></div>
                        <OrderTable orders={orders} />
                    </div>
                </div>
            );
        }

        function Logs({ logs, raw, status }) {
            return (
                <div className="grid">
                    <div className="panel span-6">
                        <div className="panel-title">Activity Logs</div>
                        <LogList logs={logs} />
                    </div>
                    <div className="panel span-6">
                        <div className="panel-title">Raw Response</div>
                        <pre>{raw}</pre>
                    </div>
                    <div className="panel span-12">
                        <div className="panel-title">Runtime Status</div>
                        <pre>{pretty(status)}</pre>
                    </div>
                </div>
            );
        }

        function Field({ label, value, onChange, type = "text", full = false }) {
            return <label className={full ? "full" : ""}><span>{label}</span><input type={type} value={value} onChange={e => onChange(e.target.value)} /></label>;
        }

        function Select({ label, value, options, onChange }) {
            return <label><span>{label}</span><select value={value} onChange={e => onChange(e.target.value)}>{options.map(option => <option key={option} value={option}>{option || "None"}</option>)}</select></label>;
        }

        function OrderTable({ orders, compact = false }) {
            if (!orders.length) return <div className="kpi-caption">No matching orders yet.</div>;
            return (
                <div className="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Symbol</th>
                                <th>Side</th>
                                <th>Intent</th>
                                <th>Decision</th>
                                {!compact && <th>Client Order ID</th>}
                                <th>Price</th>
                                {!compact && <th>Size</th>}
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            {orders.map(order => (
                                <tr key={`${order.id}-${order.at}`}>
                                    <td className="mono">{new Date(order.at).toLocaleString()}</td>
                                    <td>{order.symbol}</td>
                                    <td>{order.direction}</td>
                                    <td>{order.intent}</td>
                                    <td><span className={statusPill(order.final_decision)}>{order.final_decision || "UNKNOWN"}</span></td>
                                    {!compact && <td className="mono">{order.client_order_id || "-"}</td>}
                                    <td>{order.entry_price}</td>
                                    {!compact && <td>{order.size_base || "-"}</td>}
                                    <td>{order.reject_reason || order.broker_status || order.source}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        }

        function WalletAssetTable({ wallets, compact = false }) {
            const rows = wallets.flatMap(([walletName, wallet]) => (wallet.assets || []).map(asset => ({ walletName, ...asset })));
            if (!rows.length) return <div className="kpi-caption">No wallet assets returned yet.</div>;
            return (
                <div className="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Wallet</th>
                                <th>Asset</th>
                                <th>Balance</th>
                                <th>Available</th>
                                <th>Locked</th>
                                <th>Value USDT</th>
                                {!compact && <th>Raw Fields</th>}
                            </tr>
                        </thead>
                        <tbody>
                            {rows.map((asset, index) => (
                                <tr key={`${asset.walletName}-${asset.coin}-${index}`}>
                                    <td>{asset.walletName}</td>
                                    <td>{asset.coin || "-"}</td>
                                    <td>{money(asset.balance)}</td>
                                    <td>{asset.available === null || asset.available === undefined ? "-" : money(asset.available)}</td>
                                    <td>{asset.locked === null || asset.locked === undefined ? "-" : money(asset.locked)}</td>
                                    <td>{asset.value_usdt === null || asset.value_usdt === undefined ? "-" : money(asset.value_usdt)}</td>
                                    {!compact && <td className="mono">{JSON.stringify(asset.raw || {})}</td>}
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        }

        function LogList({ logs }) {
            if (!logs.length) return <div className="kpi-caption">No logs yet.</div>;
            return (
                <div className="log">
                    {logs.map(log => (
                        <div className="log-line" key={log.id}>
                            <span className="mono">{new Date(log.at).toLocaleTimeString()}</span>
                            <span className={statusPill(log.level)}>{log.level}</span>
                            <span>{log.message}</span>
                        </div>
                    ))}
                </div>
            );
        }

        function DecisionBars({ orders }) {
            const counts = [
                ["Executed", orders.filter(o => String(o.final_decision).includes("EXECUTED")).length, "var(--mint-strong)"],
                ["Rejected", orders.filter(o => String(o.final_decision).includes("REJECT")).length, "var(--peach-strong)"],
                ["Backtest", orders.filter(o => o.source === "backtest").length, "var(--sky-strong)"],
                ["Manual", orders.filter(o => o.source === "manual").length, "var(--butter-strong)"]
            ];
            const max = Math.max(1, ...counts.map(item => item[1]));
            return (
                <div className="bars">
                    {counts.map(([label, value, color]) => (
                        <div className="bar-row" key={label}>
                            <span>{label}</span>
                            <div className="bar-track"><div className="bar-fill" style={{ width: `${(value / max) * 100}%`, background: color }}></div></div>
                            <span>{value}</span>
                        </div>
                    ))}
                </div>
            );
        }

        function LineChart({ orders }) {
            const points = orders.slice().reverse().slice(-24).map((order, index) => {
                const yValue = String(order.final_decision).includes("EXECUTED") ? index + 1 : Math.max(0, index - 0.4);
                return { x: index, y: yValue };
            });
            const maxY = Math.max(1, ...points.map(p => p.y));
            const coords = points.length
                ? points.map((p, index) => `${20 + (index / Math.max(1, points.length - 1)) * 560},${200 - (p.y / maxY) * 160}`).join(" ")
                : "20,200 580,200";
            return (
                <svg className="chart" viewBox="0 0 600 230" preserveAspectRatio="none">
                    <polyline points={coords} fill="none" stroke="#33a56b" strokeWidth="5" strokeLinecap="round" strokeLinejoin="round" />
                    <circle cx="20" cy="200" r="4" fill="#33a56b" />
                    <text x="20" y="32" fill="#68786d" fontSize="14">Order execution trend</text>
                </svg>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
